  -- ============================================================
  -- PROFILES POLICIES
  -- ============================================================

  drop policy if exists
    "profiles read"
  on public.profiles;


  create policy
    "profiles read"
  on public.profiles
  for select
  to authenticated
  using (
    true
  );


  drop policy if exists
    "profiles update own"
  on public.profiles;


  create policy
    "profiles update own"
  on public.profiles
  for update
  to authenticated
  using (
    id = auth.uid()
  )
  with check (
    id = auth.uid()
  );


  -- Do not allow client to change role/login directly.

  revoke update
  on public.profiles
  from authenticated;


  grant update (
    username,
    public_id,
    avatar_url,
    banner_url,
    updated_at
  )
  on public.profiles
  to authenticated;


  grant select
  on public.profiles
  to authenticated;


  -- ============================================================
  -- WALLETS POLICIES
  -- ============================================================

  drop policy if exists
    "wallet read own or admin"
  on public.wallets;


  create policy
    "wallet read own or admin"
  on public.wallets
  for select
  to authenticated
  using (
    user_id = auth.uid()
    or
    public.is_admin(
      auth.uid()
    )
  );


  grant select
  on public.wallets
  to authenticated;


  -- ============================================================
  -- TRANSACTION POLICIES
  -- ============================================================

  drop policy if exists
    "transactions read"
  on public.wallet_transactions;


  create policy
    "transactions read"
  on public.wallet_transactions
  for select
  to authenticated
  using (
    user_id =
      auth.uid()
    or
    public.is_admin(
      auth.uid()
    )
  );


  grant select
  on public.wallet_transactions
  to authenticated;


  -- ============================================================
  -- CONVERSATIONS POLICIES
  -- ============================================================

  drop policy if exists
    "conversations read participant"
  on public.direct_conversations;


  create policy
    "conversations read participant"
  on public.direct_conversations
  for select
  to authenticated
  using (
    user1_id =
      auth.uid()
    or
    user2_id =
      auth.uid()
    or
    public.is_admin(
      auth.uid()
    )
  );


  grant select
  on public.direct_conversations
  to authenticated;


  -- ============================================================
  -- MESSAGES POLICIES
  -- ============================================================

  drop policy if exists
    "messages read participant"
  on public.messages;


  create policy
    "messages read participant"
  on public.messages
  for select
  to authenticated
  using (
    public.is_admin(
      auth.uid()
    )
    or
    exists (
      select 1
      from public.direct_conversations c
      where
        c.id =
          messages.conversation_id
        and (
          c.user1_id =
            auth.uid()
          or
          c.user2_id =
            auth.uid()
        )
    )
  );


  drop policy if exists
    "messages send participant"
  on public.messages;


  create policy
    "messages send participant"
  on public.messages
  for insert
  to authenticated
  with check (
    sender_id =
      auth.uid()
    and
    exists (
      select 1
      from public.direct_conversations c
      where
        c.id =
          messages.conversation_id
        and (
          c.user1_id =
            auth.uid()
          or
          c.user2_id =
            auth.uid()
        )
    )
  );


  grant select, insert
  on public.messages
  to authenticated;


  -- ============================================================
  -- MARKETPLACE POLICIES
  -- ============================================================

  drop policy if exists
    "marketplace read"
  on public.marketplace_listings;


  create policy
    "marketplace read"
  on public.marketplace_listings
  for select
  to authenticated
  using (
    true
  );


  drop policy if exists
    "marketplace create own"
  on public.marketplace_listings;


  create policy
    "marketplace create own"
  on public.marketplace_listings
  for insert
  to authenticated
  with check (
    seller_id =
      auth.uid()

    and

    (
      (
        asset_type =
          'username'

        and

        exists (
          select 1
          from public.profiles
          where id =
            auth.uid()
            and lower(
              username
            ) =
            lower(
              asset_value
            )
        )
      )

      or

      (
        asset_type =
          'id'

        and

        exists (
          select 1
          from public.profiles
          where id =
            auth.uid()
            and public_id =
              asset_value
        )
      )
    )

    and

    lower(asset_value) <>
      'sewa_blat'
  );


  drop policy if exists
    "marketplace seller cancel"
  on public.marketplace_listings;


  create policy
    "marketplace seller cancel"
  on public.marketplace_listings
  for update
  to authenticated
  using (
    seller_id =
      auth.uid()
  )
  with check (
    seller_id =
      auth.uid()
  );


  grant select, insert, update
  on public.marketplace_listings
  to authenticated;

  -- MARKETPLACE SALES
  -- ============================================================

  drop policy if exists
    "sales read related"
  on public.marketplace_sales;


  create policy
    "sales read related"
  on public.marketplace_sales
  for select
  to authenticated
  using (
    seller_id =
      auth.uid()
    or
    buyer_id =
      auth.uid()
    or
    public.is_admin(
      auth.uid()
    )
  );


  grant select
  on public.marketplace_sales
  to authenticated;


  -- ============================================================
  -- SETTINGS
  -- ============================================================

  on public.app_settings;

    "settings public read"
  on public.app_settings
  for select
  to anon, authenticated

    true
  );


  drop policy if exists
    "settings admin update"
  on public.app_settings;


  create policy
    "settings admin update"
  on public.app_settings
  for update
  to authenticated
  using (
    public.is_admin(
      auth.uid()
    )
  )
  with check (
    public.is_admin(
      auth.uid()
    )
  );


  grant select
  on public.app_settings
  to anon, authenticated;


  grant update
  on public.app_settings
  to authenticated;


  -- ============================================================
  -- AUDIT

  drop policy if exists

  create policy
    "audit admin read"
  on public.admin_audit_logs
  for select
  to authenticated
  using (
