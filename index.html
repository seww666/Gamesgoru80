function resizeComposer(
  textarea
){

  textarea.style.height=
    "45px";


  textarea.style.height=
    Math.min(
      textarea.scrollHeight,
      130
    )
    +"px";

}


function messagesMarkup(){

  if(
    !state.messages.length
  ){

    return `
      <div class="empty">

        <strong>
          Початок розмови
        </strong>

        <p>
          Надішліть перше повідомлення.
        </p>

      </div>
    `;

  }


  return state.messages
    .map(
      message=>{

        const mine=
          message.sender_id===
          state.user.id;


        const text=
          message.content||"";


        const image=
          message._imageUrl||null;


        return `
          <div
            class="
              message-row
              ${mine?"mine":""}
            "
          >

            <div class="message">

              ${
                message.image_path
                ||
                image
                  ?`

                    ${
                      image

                        ?`
                          <div
                            class="message-image-wrap"

                            onclick="
                              openImageViewer(
                                '${esc(image)}'
                              )
                            "
                          >

                            <img
                              class="message-image"

                              src="${esc(image)}"

                              alt="Фото"

                              loading="lazy"
                            >

                          </div>
                        `

                        :`
                          <div
                            class="message-image-loading"
                          ></div>
                        `
                    }

                  `
                  :""
              }


              ${
                text

                  ?`
                    <div class="message-text">
                      ${esc(text)}
                    </div>
                  `

                  :""
              }


              <div class="message-time">

                ${formatTime(
                  message.created_at
                )}

                ${
                  message._uploading
                    ?" · завантаження фото"
                    :""
                }

                ${
                  message._pending
                    ?" · надсилання"
                    :""
                }

                ${
                  message._failed
                    ?" · помилка"
                    :""
                }

              </div>

            </div>

          </div>
        `;

      }
    )
    .join("");

}


/* =====================================================
   LOAD CHAT LIST
===================================================== */

async function loadChats(){

  const root=
    qs("#chatList");


  if(!root){
    return;
  }


  const uid=
    state.user.id;


  const {
    data,
    error
  }=
    await sb

      .from(
        "direct_conversations"
      )

      .select("*")

      .or(
        `user1_id.eq.${uid},user2_id.eq.${uid}`
      )

      .order(
        "updated_at",
        {
          ascending:false
        }
      );


  if(error){

    root.innerHTML=`
      <div class="empty">

        <strong>
          Не вдалося завантажити чати
        </strong>

      </div>
    `;

    return;

  }


  const chats=
    data
    ||
    [];


  const ids=
    chats.map(
      chat=>

        chat.user1_id===uid

          ?chat.user2_id

          :chat.user1_id
    );


  let users=[];


  if(ids.length){

    const {
      data:profiles
    }=
      await sb

        .from("profiles")

        .select(
          "id,login,username,public_id,avatar_url,banner_url,created_at"
        )

        .in(
          "id",
          ids
        );


    users=
      profiles
      ||
      [];

  }


  const map=
    Object.fromEntries(

      users.map(
        user=>[
          user.id,
          user
        ]
      )

    );


  const withPreview=
    await Promise.all(

      chats.map(
        async chat=>{

          const otherId=
            chat.user1_id===uid

              ?chat.user2_id

              :chat.user1_id;


          let latest=null;


          try{

            const {
              data:lastMessage
            }=
              await sb

                .from("messages")

                .select(
                  "content,image_path,created_at,sender_id"
                )

                .eq(
                  "conversation_id",
                  chat.id
                )

                .order(
                  "created_at",
                  {
                    ascending:false
                  }
                )

                .limit(1)

                .maybeSingle();


            latest=
              lastMessage;

          }catch{}


          return {

            ...chat,

            other:
              map[otherId],

            latest

          };

        }
      )

    );


  state.conversations=
    withPreview;


  renderChatList();

}


function renderChatList(){

  const root=
    qs("#chatList");


  if(!root){
    return;
  }


  if(
    !state.conversations.length
  ){

    root.innerHTML=`
      <div class="empty">

        <div class="empty-icon">

          <i
            data-lucide="message-circle"
            class="icon"
          ></i>

        </div>

        <strong>
          Чатів ще немає
        </strong>

        <p>
          Натисніть кнопку зверху
          та знайдіть користувача.
        </p>

      </div>
    `;


    refreshIcons();

    return;

  }


  root.innerHTML=
    state.conversations

      .map(
        chat=>{

          let preview=
            "Розмову створено";


          if(
            chat.latest?.image_path
            &&
            chat.latest?.content
          ){

            preview=
              "Фото · "
              +
              chat.latest.content;

          }else if(
            chat.latest?.image_path
          ){

            preview=
              "Фото";

          }else if(
            chat.latest?.content
          ){

            preview=
              chat.latest.content;

          }


          return `

            <button
              class="
                chat-item

                ${
                  state.activeConversation
                    ?.id===chat.id
                    ?"active"
                    :""
                }
              "

              data-search="${esc(
                (
                  (
                    chat.other?.username
                    ||
                    ""
                  )

                  +

                  " "

                  +

                  (
                    chat.other?.public_id
                    ||
                    ""
                  )
                )
                .toLowerCase()
              )}"

              onclick="
                openChat(
                  '${chat.id}',
                  '${chat.other?.id}'
                )
              "
            >

              ${avatarStatus(
                chat.other
              )}


              <div class="chat-item-content">

                <div class="chat-item-row">

                  <span class="chat-name">

                    ${esc(
                      chat.other
                        ?.username
                      ||
                      "Користувач"
                    )}

                  </span>


                  <span class="chat-time">

                    ${formatTime(
                      chat.latest
                        ?.created_at
                      ||
                      chat.updated_at
                    )}

                  </span>

                </div>


                <div class="chat-preview">

                  ${esc(preview)}

                </div>

              </div>

            </button>
          `;

        }
      )

      .join("");


  refreshIcons();

  refreshOnlineIndicators();

}


function filterChats(value){

  const query=
    value
      .trim()
      .toLowerCase();


  qsa(
    ".chat-item"
  )
    .forEach(
      item=>{

        if(
          !item.dataset.search
        ){

          return;

        }


        item.style.display=

          item.dataset.search
            .includes(query)

            ?""

            :"none";

      }
    );

}


/* =====================================================
   CREATE CHAT
===================================================== */

async function createChat(
  userId
){

  const {
    data,
    error
  }=
    await sb.rpc(

      "get_or_create_direct_conversation",

      {
        target_user_id:
          userId
      }

    );


  if(error){

    toast(
      error.message
      ||
      "Не вдалося створити чат",
      "error"
    );

    return;

  }


  closeModal();


  await loadChats();


  await openChat(
    data,
    userId
  );

}


/* =====================================================
   CHAT CHANNEL
===================================================== */

async function stopChatChannel(){

  state.chatChannelReady=
    false;


  if(
    state.messageChannel
  ){

    try{

      await sb.removeChannel(
        state.messageChannel
      );

    }catch{}


    state.messageChannel=
      null;

  }

}


async function setupChatChannel(
  conversationId
){

  await stopChatChannel();


  const channel=
    sb.channel(

      "chat:"
      +
      conversationId,

      {
        config:{
          broadcast:{
            self:false
          }
        }
      }

    );


  state.messageChannel=
    channel;


  channel.on(

    "postgres_changes",

    {
      event:"INSERT",

      schema:"public",

      table:"messages",

      filter:
        `conversation_id=eq.${conversationId}`
    },

    async payload=>{

      const incoming=
        await hydrateMessageMedia(
          payload.new
        );


      const index=
        state.messages
          .findIndex(
            message=>
              message.id===
              incoming.id
          );


      if(index>=0){

        state.messages[index]=
          incoming;

      }else{

        state.messages
          .push(
            incoming
          );

      }


      refreshMessages(
        true
      );


      refreshConversationPreview(
        incoming
      );

    }

  );


  channel.on(

    "broadcast",

    {
      event:"typing"
    },

    payload=>{

      const data=
        payload.payload||{};


      if(
        data.user_id===
        state.user.id
      ){

        return;

      }


      if(
        data.conversation_id!==
        state.activeConversation?.id
      ){

        return;

      }


      showTypingIndicator(
        data.user_id,
        Boolean(
          data.typing
        )
      );

    }

  );


  channel.subscribe(
    status=>{

      state.chatChannelReady=
        status===
        "SUBSCRIBED";

    }
  );

}


/* =====================================================
   OPEN CHAT
===================================================== */

async function openChat(
  conversationId,
  userId
){

  await stopTyping();


  clearSelectedImage();


  let user=
    state.conversations

      .find(
        chat=>
          chat.id===
          conversationId
      )

      ?.other;


  if(!user){

    const {data}=
      await sb

        .from("profiles")

        .select(
          "id,login,username,public_id,avatar_url,banner_url,created_at"
        )

        .eq(
          "id",
          userId
        )

        .maybeSingle();


    user=
      data;

  }


  if(!user){

    toast(
      "Користувача не знайдено",
      "error"
    );

    return;

  }


  state.activeConversation={
    id:
      conversationId
  };


  state.activeChatUser=
    user;


  state.mobileChatOpen=
    true;


  const {
    data,
    error
  }=
    await sb

      .from("messages")

      .select("*")

      .eq(
        "conversation_id",
        conversationId
      )

      .order(
        "created_at",
        {
          ascending:true
        }
      )

      .limit(500);


  if(error){

    toast(
      "Не вдалося відкрити чат",
      "error"
    );

    return;

  }


  state.messages=
    await Promise.all(

      (data||[])
        .map(
          hydrateMessageMedia
        )

    );


  await setupChatChannel(
    conversationId
  );


  renderChats();


  setTimeout(
    scrollMessages,
    40
  );

}


function closeMobileChat(){

  stopTyping();

  clearSelectedImage();


  state.mobileChatOpen=
    false;


  renderChats();

}


/* =====================================================
   MESSAGE UI
===================================================== */

function refreshMessages(
  scroll=false
){

  const root=
    qs("#messages");


  if(!root){
    return;
  }


  root.innerHTML=
    messagesMarkup();


  refreshIcons();


  if(scroll){

    scrollMessages();

  }

}


function scrollMessages(){

  const root=
    qs("#messages");


  if(root){

    requestAnimationFrame(
      ()=>{

        root.scrollTop=
          root.scrollHeight;

      }
    );

  }

}


function messageKey(event){

  if(
    event.key==="Enter"
    &&
    !event.shiftKey
    &&
    window.innerWidth>760
  ){

    event.preventDefault();

    sendMessage();

  }

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  if(
    !state.activeConversation
  ){

    return;

  }


  const input=
    qs("#messageInput");


  const content=
    input
      ?.value
      .trim()
    ||
    "";


  const imageFile=
    state.selectedImage;


  if(
    !content
    &&
    !imageFile
  ){

    return;

  }


  await stopTyping();


  const button=
    qs("#sendMessageButton");


  if(button){

    button.disabled=
      true;

  }


  const id=
    crypto.randomUUID();


  const createdAt=
    new Date()
      .toISOString();


  let localImageUrl=
    null;


  if(
    imageFile
    &&
    state.selectedImagePreview
  ){

    localImageUrl=
      state.selectedImagePreview;

  }


  const optimistic={

    id,

    conversation_id:
      state.activeConversation.id,

    sender_id:
      state.user.id,

    content:
      content||null,

    image_path:
      imageFile
        ?"pending"
        :null,

    created_at:
      createdAt,

    _imageUrl:
      localImageUrl,

    _uploading:
      Boolean(imageFile),

    _pending:
      !imageFile,

    _failed:false

  };


  state.messages.push(
    optimistic
  );


  if(input){

    input.value="";

    input.style.height=
      "45px";

  }


  state.selectedImage=
    null;

  state.selectedImagePreview=
    null;


  updateComposerPreview();


  refreshMessages(
    true
  );


  try{

    let imagePath=null;


    if(imageFile){

      imagePath=
        await uploadChatImage(
          imageFile
        );


      state.messages=
        state.messages.map(
          message=>

            message.id===id

              ?{
                  ...message,

                  image_path:
                    imagePath,

                  _uploading:false,

                  _pending:true
                }

              :message
        );


      refreshMessages(
        true
      );

    }


    const {
      data:inserted,
      error
    }=
      await sb

        .from("messages")

        .insert({

          id,

          conversation_id:
            state.activeConversation.id,

          sender_id:
            state.user.id,

          content:
            content||null,

          image_path:
            imagePath

        })

        .select()

        .single();


    if(error){

      throw error;

    }


    let finalMessage=
      await hydrateMessageMedia(
        inserted
      );


    if(
      imageFile
      &&
      !finalMessage._imageUrl
      &&
      localImageUrl
    ){

      finalMessage._imageUrl=
        localImageUrl;

    }


    state.messages=
      state.messages.map(
        message=>

          message.id===id

            ?finalMessage

            :message
      );


    refreshMessages(
      true
    );


    refreshConversationPreview(
      finalMessage
    );


  }catch(error){

    console.error(
      "SEND ERROR",
      error
    );


    state.messages=
      state.messages.map(
        message=>

          message.id===id

            ?{
                ...message,

                _pending:false,

                _uploading:false,

                _failed:true
              }

            :message
      );


    refreshMessages();


    toast(
      error.message
      ||
      "Повідомлення не надіслано",
      "error"
    );


  }finally{

    if(button){

      button.disabled=
        false;

    }

  }

}

function refreshConversationPreview(
  message
){

  const chat=
    state.conversations
      .find(
        item=>
          item.id===
          message.conversation_id
      );


  if(!chat){

    return;

  }


  chat.latest={

    content:
      message.content,

    image_path:
      message.image_path,

    created_at:
      message.created_at,

    sender_id:
      message.sender_id

  };


  chat.updated_at=
    message.created_at;


  state.conversations.sort(

    (a,b)=>

      new Date(
        b.latest?.created_at
        ||
        b.updated_at
      )

      -

      new Date(
        a.latest?.created_at
        ||
        a.updated_at
      )

  );


  renderChatList();

}

          "."

    price<=0

      "Вкажіть правильну ціну",

    );

  const assetValue=

    type==="username"

      ?state.profile.username

      :state.profile.public_id;


  const button=
    qs("#listingButton");


  setLoading(
    button,
    true
  );


  const {error}=
    await sb

      .from(
        "marketplace_listings"
      )

      .insert({

        seller_id:
          state.user.id,

        asset_type:
          type,

        asset_value:
          assetValue,

        status:

    button,
    false

  if(error){

      error.message

    );

  closeModal();


  await loadListings();


  toast(

  );

  if(ids.length){

      await sb

        .from("profiles")

        .select(

        .in(
          "id",
          ids
        );


    users=
      data
      ||
      [];

  }


  const map=
    Object.fromEntries(

      users.map(

          user

      )

    );


  qs("#adminContent")
    .innerHTML=`

      <section class="card">

            font-weight:850;
            border-bottom:
            1px solid var(--border)

            <thead>

              <tr>

                  Користувач 1
                </th>

                </th>

                <th>
                  Оновлено
                </th>

                <th>
                </th>

              </tr>

            </thead>


            <tbody>

              ${
                (chats||[])

                  .map(
                    chat=>`

                      <tr>

                        <td>
                          ${esc(
                            map[
                              chat.user1_id
                            ]
                              ?.username
                            ||
                            "Користувач"
                          )}
                        </td>

                        <td>
                          ${esc(
                            map[
                              chat.user2_id
                            ]
                              ?.username
                            ||
                            "Користувач"
                          )}

}


async function openAdminChat(
  chatId
){

  const {
    data:messages,
    error
  }=
    await sb

      .from("messages")

      .select("*")

      .eq(
        "conversation_id",
        chatId
      )

      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    toast(
      "Не вдалося відкрити чат",
      "error"
    );

    return;

  }


  const ids=[
    ...new Set(

      (messages||[])

        .map(
          message=>
            message.sender_id
        )

    )
  ];


  let users=[];


  if(ids.length){

    const {data}=
      await sb

        .from("profiles")

        .select(
          "id,username"
        )

        .in(
          "id",
          ids
        );


    users=
      data
      ||
      [];

  }


  const map=
    Object.fromEntries(

      users.map(
        user=>[
          user.id,
          user.username
        ]
      )

    );


  const hydrated=
    await Promise.all(
      (messages||[])
        .map(
          hydrateMessageMedia
        )
    );


  modal(

    "Перегляд чату",

    `
      <div
        style="
          display:flex;
          flex-direction:column;
          gap:7px
        "
      >

        ${
          hydrated.length

            ?hydrated

                .map(
                  message=>`

                    <div
                      style="
                        padding:10px;

                        border-radius:12px;

                        border:
                        1px solid var(--border);

                        background:#171717
                      "
                    >

                      <div
                        style="
                          color:var(--yellow);

                          font-size:10px;
                          font-weight:800
                        "
                      >

                        ${esc(
                          map[
                            message.sender_id
                          ]
                          ||
                          "Користувач"
                        )}

                      </div>


                      ${
                        message._imageUrl

                          ?`
                            <img
                              src="${esc(
                                message._imageUrl
                              )}"

                              style="
                                display:block;

                                max-width:100%;

                                max-height:300px;

                                object-fit:contain;

                                border-radius:10px;

                                margin-top:8px;

                                cursor:pointer
                              "

                              onclick="
                                openImageViewer(
                                  '${esc(
                                    message._imageUrl
                                  )}'
                                )
                              "
                            >
                          `

                          :""
                      }


                      ${
                        message.content

                          ?`
                            <div
                              style="
                                margin-top:7px;

                                line-height:1.45;

                                font-size:12px
                              "
                            >
                              ${esc(
                                message.content
                              )}
                            </div>
                          `

                          :""
                      }


                      <div
                        style="
                          margin-top:5px;

                          color:#666;

                          font-size:8px
                        "
                      >

                        ${formatDate(
                          message.created_at
                        )}

                        ${formatTime(
                          message.created_at
                        )}

                      </div>

                    </div>
                  `
                )

                .join("")

            :`
              <div class="empty">
                Повідомлень немає
              </div>
            `
        }

      </div>
    `

  );

}

async function saveAdminLogo(){

  const file=
    qs("#adminLogo")
      ?.files?.[0];


  if(!file){

    toast(
      "Оберіть зображення",
      "error"
    );

    return;

  }


  const button=
    qs("#logoButton");


  setLoading(
    button,
    true
  );


  try{

    const ext=
      file.name
        .split(".")
        .pop()

      ||

      "png";


    const path=
      `logo-${
        Date.now()
      }.${ext}`;


    const {error}=
      await sb.storage

        .from("branding")

        .upload(

          path,

          file,

          {
            upsert:true
          }

        );


    if(error){

      throw error;

    }


    const {data}=
      sb.storage

        .from("branding")

        .getPublicUrl(path);


    const url=
      data.publicUrl;


    const {
      error:updateError
    }=
      await sb

        .from(
          "app_settings"
        )

        .update({

          logo_url:
            url,

          updated_at:
            new Date()
              .toISOString()

        })

        .eq(
          "id",
          1
        );


    if(updateError){

      throw updateError;

    }


    state.logoUrl=
      url;


    render();


    toast(
      "Логотип змінено",
      "success"
    );


  }catch(error){

    console.error(error);


    toast(
      error.message
      ||
      "Не вдалося змінити логотип",
      "error"
    );


  }finally{

    setLoading(
      button,
      false
    );

  }

}
