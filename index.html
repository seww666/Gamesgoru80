<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2c314">

<title>LiptonGram</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
*{box-sizing:border-box}

:root{
  --bg:#080808;
  --panel:#111;
  --panel2:#171717;
  --panel3:#202020;
  --text:#fff;
  --muted:#858585;
  --yellow:#f2c314;
  --yellow2:#ffdd4c;
  --danger:#ff5858;
  --success:#45d685;
  --border:rgba(255,255,255,.08);
  --shadow:0 25px 70px rgba(0,0,0,.36);
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(900px 450px at 50% -180px,rgba(242,195,20,.14),transparent 70%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}

button,input,textarea,select{font:inherit}
button{color:inherit}
button,a{-webkit-tap-highlight-color:transparent}

input::placeholder,
textarea::placeholder{color:#666}

.hidden{display:none!important}

.icon{width:20px;height:20px}
.icon-sm{width:17px;height:17px}

.spin{animation:spin .8s linear infinite}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes enter{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:none}
}

@keyframes modalIn{
  from{opacity:0;transform:translateY(16px) scale(.98)}
  to{opacity:1;transform:none}
}

.page-animation{
  animation:enter .22s ease both;
}

::-webkit-scrollbar{
  width:7px;
  height:7px;
}

::-webkit-scrollbar-thumb{
  background:#292929;
  border-radius:10px;
}

/* BUTTONS */

.btn{
  min-height:43px;
  padding:0 16px;
  border:0;
  border-radius:13px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-weight:750;
  cursor:pointer;
  transition:.15s ease;
}

.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.btn-primary{
  color:#111;
  background:linear-gradient(135deg,var(--yellow2),var(--yellow));
}

.btn-secondary{
  background:#1a1a1a;
  border:1px solid var(--border);
}

.btn-danger{
  background:rgba(255,88,88,.1);
  color:#ff7979;
  border:1px solid rgba(255,88,88,.17);
}

.icon-btn{
  width:42px;
  height:42px;
  flex:0 0 42px;
  padding:0;
  border:1px solid var(--border);
  border-radius:13px;
  background:#181818;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.15s ease;
}

.icon-btn:hover{background:#222}
.icon-btn:active{transform:scale(.95)}

/* INPUT */

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field label{
  color:#b4b4b4;
  font-size:12px;
  font-weight:700;
}

.input{
  width:100%;
  height:46px;
  padding:0 14px;
  color:white;
  background:#101010;
  border:1px solid var(--border);
  outline:0;
  border-radius:13px;
  transition:.16s ease;
}

.input:focus{
  border-color:rgba(242,195,20,.55);
  box-shadow:0 0 0 4px rgba(242,195,20,.07);
}

/* AUTH */

.auth-page{
  min-height:100vh;
  min-height:100dvh;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.auth-card{
  width:min(430px,100%);
  padding:28px;
  border-radius:27px;
  background:rgba(15,15,15,.9);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);
}

.auth-logo{
  width:70px;
  height:70px;
  margin:0 auto 18px;
  border-radius:21px;
  overflow:hidden;
  color:#111;
  background:linear-gradient(135deg,var(--yellow2),var(--yellow));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:900;
}

.auth-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.auth-title{
  margin:0;
  text-align:center;
  font-size:30px;
  font-weight:850;
}

.auth-sub{
  margin:7px 0 23px;
  color:var(--muted);
  text-align:center;
  font-size:13px;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  padding:4px;
  margin-bottom:18px;
  background:#0c0c0c;
  border:1px solid var(--border);
  border-radius:14px;
}

.auth-tab{
  height:39px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#777;
  font-weight:750;
  cursor:pointer;
}

.auth-tab.active{
  background:#202020;
  color:white;
}

.auth-form{
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* APP */

.app{
  min-height:100vh;
  min-height:100dvh;
  display:grid;
  grid-template-columns:260px minmax(0,1fr);
}

.sidebar{
  position:sticky;
  top:0;
  height:100vh;
  height:100dvh;
  padding:18px 13px;
  border-right:1px solid var(--border);
  background:rgba(9,9,9,.88);
  backdrop-filter:blur(20px);
  display:flex;
  flex-direction:column;
  z-index:30;
}

.brand{
  height:55px;
  padding:0 8px;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:11px;
}

.brand-logo{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border-radius:12px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#111;
  font-size:18px;
  font-weight:900;
  background:linear-gradient(135deg,var(--yellow2),var(--yellow));
}

.brand-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.brand-name{
  font-size:18px;
  font-weight:850;
}

.side-nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav-btn{
  width:100%;
  height:48px;
  padding:0 13px;
  border:0;
  border-radius:13px;
  color:#858585;
  background:transparent;
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:750;
  cursor:pointer;
  transition:.15s ease;
}

.nav-btn:hover{
  color:white;
  background:#151515;
}

.nav-btn.active{
  color:#111;
  background:linear-gradient(135deg,var(--yellow2),var(--yellow));
}

.sidebar-space{flex:1}

.side-user{
  padding:9px;
  border-radius:16px;
  border:1px solid var(--border);
  background:#111;
  display:flex;
  align-items:center;
  gap:9px;
}

.side-user-info{
  min-width:0;
  flex:1;
}

.side-user-name{
  font-size:12px;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
}

.side-user-id{
  margin-top:2px;
  color:#777;
  font-size:10px;
}

.main{min-width:0}

.page{
  width:min(1180px,100%);
  margin:auto;
  padding:25px;
}

.page-head{
  min-height:54px;
  margin-bottom:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.page-title{
  margin:0;
  font-size:27px;
  font-weight:850;
}

.page-desc{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.card{
  border:1px solid var(--border);
  border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.008));
  box-shadow:0 15px 50px rgba(0,0,0,.19);
}

/* AVATAR */

.avatar{
  width:43px;
  height:43px;
  flex:0 0 43px;
  overflow:hidden;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.09);
  background:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.avatar.large{
  width:106px;
  height:106px;
  flex:0 0 106px;
  font-size:29px;
  border:4px solid #101010;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* EMPTY */

.empty{
  min-height:240px;
  padding:30px;
  color:#777;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.empty-icon{
  width:52px;
  height:52px;
  margin-bottom:13px;
  border-radius:16px;
  border:1px solid var(--border);
  background:#181818;
  display:flex;
  align-items:center;
  justify-content:center;
}

.empty strong{
  color:white;
  font-size:15px;
}

.empty p{
  max-width:400px;
  margin:7px 0 0;
  line-height:1.5;
  font-size:12px;
}

/* BALANCE */

.balance{
  height:42px;
  padding:4px 5px 4px 13px;
  border-radius:13px;
  border:1px solid var(--border);
  background:#151515;
  display:inline-flex;
  align-items:center;
  gap:9px;
}

.balance-value{
  font-size:13px;
  font-weight:850;
}

.balance-plus{
  width:31px;
  height:31px;
  padding:0;
  border:0;
  border-radius:9px;
  color:#111;
  background:var(--yellow);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* PROFILE */

.profile-card{overflow:hidden}

.profile-banner{
  height:235px;
  background:
    linear-gradient(120deg,#2b250d,#534000,#181818);
  background-size:cover;
  background-position:center;
}

.profile-info{
  padding:0 23px 23px;
  display:flex;
  align-items:flex-end;
  gap:18px;
}

.profile-avatar{
  margin-top:-50px;
}

.profile-main{
  min-width:0;
  flex:1;
  padding-top:16px;
}

.profile-name{
  margin:0;
  font-size:24px;
  font-weight:850;
  word-break:break-word;
}

.profile-login{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.profile-tags{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.tag{
  min-height:27px;
  padding:0 8px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#171717;
  color:#aaa;
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:10px;
}

.profile-actions{
  padding-top:15px;
}

.profile-stats{
  margin-top:14px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px;
}

.stat{
  padding:19px;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
}

.stat-value{
  margin-top:7px;
  font-size:21px;
  font-weight:850;
  word-break:break-word;
}

/* CHATS */

.chat-layout{
  height:calc(100dvh - 50px);
  padding:25px;
  display:grid;
  grid-template-columns:335px minmax(0,1fr);
  gap:14px;
}

.chat-list-panel,
.chat-panel{
  min-height:0;
  overflow:hidden;
}

.chat-list-panel{
  display:flex;
  flex-direction:column;
}

.chat-list-head{
  padding:17px;
  border-bottom:1px solid var(--border);
}

.chat-title-row{
  margin-bottom:13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.chat-title-row h2{
  margin:0;
  font-size:21px;
}

.search{
  position:relative;
}

.search i{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:#666;
  pointer-events:none;
}

.search .input{
  height:42px;
  padding-left:39px;
}

.chat-list{
  min-height:0;
  flex:1;
  overflow:auto;
  padding:6px;
}

.chat-item{
  width:100%;
  padding:9px;
  border:0;
  border-radius:14px;
  color:white;
  background:transparent;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  cursor:pointer;
}

.chat-item:hover,
.chat-item.active{
  background:#1a1a1a;
}

.chat-item-content{
  min-width:0;
  flex:1;
}

.chat-item-row{
  display:flex;
  justify-content:space-between;
  gap:7px;
}

.chat-name{
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-time{
  color:#666;
  font-size:9px;
}

.chat-preview{
  margin-top:3px;
  color:#777;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-panel{
  display:flex;
  flex-direction:column;
}

.active-chat-head{
  height:67px;
  flex:0 0 67px;
  padding:0 17px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
}

.active-chat-user{
  min-width:0;
  cursor:pointer;
}

.active-chat-name{
  font-size:13px;
  font-weight:800;
}

.active-chat-id{
  margin-top:2px;
  color:#777;
  font-size:10px;
}

.messages{
  min-height:0;
  flex:1;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:7px;
  scroll-behavior:smooth;
}

.message-row{
  display:flex;
}

.message-row.mine{
  justify-content:flex-end;
}

.message{
  max-width:78%;
  padding:9px 12px 7px;
  border-radius:16px;
  background:#202020;
  font-size:13px;
  line-height:1.45;
  word-break:break-word;
}

.message-row.mine .message{
  color:#111;
  background:linear-gradient(135deg,#f5c518,#e4ae00);
  border-bottom-right-radius:5px;
}

.message-row:not(.mine) .message{
  border-bottom-left-radius:5px;
}

.message-time{
  margin-top:3px;
  opacity:.55;
  text-align:right;
  font-size:8px;
}

.composer{
  padding:11px 13px;
  border-top:1px solid var(--border);
  background:rgba(13,13,13,.95);
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.composer textarea{
  min-height:43px;
  max-height:125px;
  flex:1;
  padding:10px 13px;
  resize:none;
  outline:0;
  color:white;
  background:#171717;
  border:1px solid var(--border);
  border-radius:14px;
}

.send{
  width:43px;
  height:43px;
  flex:0 0 43px;
  padding:0;
  border:0;
  border-radius:13px;
  color:#111;
  background:var(--yellow);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* SHOP */

.shop-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:13px;
}

.listing{
  min-height:200px;
  padding:17px;
  display:flex;
  flex-direction:column;
}

.listing-type{
  width:fit-content;
  padding:5px 7px;
  border-radius:7px;
  color:var(--yellow);
  background:rgba(242,195,20,.08);
  font-size:9px;
  font-weight:850;
  text-transform:uppercase;
}

.listing-value{
  margin-top:16px;
  font-size:20px;
  font-weight:850;
  word-break:break-word;
}

.listing-seller{
  margin-top:4px;
  color:#777;
  font-size:11px;
}

.listing-space{flex:1}

.listing-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:9px;
}

.listing-price{
  font-size:17px;
  font-weight:850;
}

/* ADMIN */

.admin-tabs{
  margin-bottom:14px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.admin-tab{
  height:38px;
  padding:0 12px;
  border:1px solid var(--border);
  border-radius:10px;
  color:#777;
  background:#151515;
  font-size:11px;
  font-weight:750;
  cursor:pointer;
}

.admin-tab.active{
  color:#111;
  background:var(--yellow);
  border-color:var(--yellow);
}

.admin-stats{
  margin-bottom:14px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.admin-stat{padding:17px}

.admin-number{
  margin-top:7px;
  font-size:23px;
  font-weight:850;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}

th,td{
  padding:12px 14px;
  text-align:left;
  white-space:nowrap;
  border-bottom:1px solid rgba(255,255,255,.05);
}

th{color:#777}

.role{
  padding:4px 7px;
  border-radius:7px;
  background:#222;
  font-size:9px;
}

.role.admin{
  color:var(--yellow);
  background:rgba(242,195,20,.1);
}

/* MODAL */

.modal-bg{
  position:fixed;
  inset:0;
  z-index:500;
  padding:17px;
  background:rgba(0,0,0,.74);
  backdrop-filter:blur(8px);
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal{
  width:min(480px,100%);
  max-height:calc(100dvh - 34px);
  overflow:auto;
  border-radius:23px;
  border:1px solid rgba(255,255,255,.1);
  background:#111;
  box-shadow:var(--shadow);
  animation:modalIn .18s ease both;
}

.modal-head{
  padding:18px 18px 8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.modal-title{
  margin:0;
  font-size:18px;
  font-weight:850;
}

.modal-body{
  padding:12px 18px 19px;
}

.modal-form{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

/* PAYMENT */

.payment-card{
  height:185px;
  margin-bottom:17px;
  padding:20px;
  border-radius:21px;
  border:1px solid rgba(242,195,20,.16);
  background:
    radial-gradient(250px 120px at 90% 0,rgba(255,220,60,.27),transparent 65%),
    linear-gradient(135deg,#2b260e,#111);
  display:flex;
  flex-direction:column;
}

.payment-chip{
  width:38px;
  height:28px;
  margin-bottom:28px;
  border-radius:7px;
  background:linear-gradient(135deg,#dabe6e,#8c7024);
}

.payment-number{
  font-size:16px;
  letter-spacing:2px;
}

.payment-bottom{
  margin-top:auto;
  color:#aaa;
  font-size:10px;
  display:flex;
  justify-content:space-between;
}

.payment-error{
  margin-bottom:12px;
  padding:11px;
  border-radius:11px;
  color:#ff7777;
  background:rgba(255,80,80,.08);
  border:1px solid rgba(255,80,80,.15);
  font-size:11px;
}

/* TOAST */

#toasts{
  position:fixed;
  right:16px;
  bottom:16px;
  z-index:1000;
  display:flex;
  flex-direction:column;
  gap:7px;
  pointer-events:none;
}

.toast{
  width:min(340px,calc(100vw - 32px));
  padding:11px 13px;
  border-radius:13px;
  border:1px solid var(--border);
  background:#191919;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:9px;
  font-size:11px;
  animation:enter .18s ease both;
}

.bottom-nav{display:none}

/* MOBILE */

@media(max-width:1000px){
  .app{
    grid-template-columns:80px minmax(0,1fr);
  }

  .brand-name,
  .nav-btn span,
  .side-user-info{
    display:none;
  }

  .brand{justify-content:center}
  .nav-btn{padding:0;justify-content:center}

  .shop-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .admin-stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:760px){
  .app{display:block}
  .sidebar{display:none}

  .main{
    min-height:100dvh;
    padding-bottom:78px;
  }

  .bottom-nav{
    position:fixed;
    left:10px;
    right:10px;
    bottom:max(10px,env(safe-area-inset-bottom));
    z-index:100;
    min-height:61px;
    padding:5px;
    border-radius:19px;
    border:1px solid rgba(255,255,255,.09);
    background:rgba(15,15,15,.92);
    backdrop-filter:blur(20px);
    display:grid;

const SUPABASE_URL =

const SUPABASE_KEY =

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const state = {
  user:null,
  session:null,

  profile:null,

    balance:0
  },

  page:"chats",

  adminUsers:[]
};

function qs(value){
  return document.querySelector(value);
}

function qsa(value){
  return [...document.querySelectorAll(value)];
}

function esc(value=""){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function refreshIcons(){
  requestAnimationFrame(()=>{
    if(window.lucide){
      lucide.createIcons();
    }
  });
}

function money(value){
  return new Intl.NumberFormat(
    "en-US",
    {
      style:"currency",
      currency:"USD"
    }
  ).format(
    Number(value||0)
  );
}

function formatDate(value){
  if(!value)return "—";

  try{
    return new Intl.DateTimeFormat(
      "uk-UA",
      {
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      }
    ).format(new Date(value));
  }catch{
    return "—";
  }
}

function formatTime(value){
  if(!value)return "";

  try{
    return new Intl.DateTimeFormat(
      "uk-UA",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    ).format(new Date(value));
  }catch{
    return "";
  }
}

function loginEmail(login){
  return (
    login
      .trim()
      .toLowerCase()
    +
    "@liptongram.app"
  );
}

function validLogin(value){
  return /^[A-Za-z0-9_]{3,24}$/
    .test(value);
}

function initials(profile){
  return (
    profile?.username ||
    profile?.login ||
    "LG"
  )
    .slice(0,2)
    .toUpperCase();
}

function avatar(
  profile,
  large=false
){
  if(profile?.avatar_url){
    return `
      <div class="avatar ${large?"large":""}">
        <img
          src="${esc(profile.avatar_url)}"
          alt=""
        >
      </div>
    `;
  }

  return `
    <div class="avatar ${large?"large":""}">
      ${esc(initials(profile))}
    </div>
  `;
}

function logoMarkup(
  className="brand-logo"
){
  if(state.logoUrl){
    return `
      <div class="${className}">
        <img
          src="${esc(state.logoUrl)}"
          alt=""
        >
      </div>
    `;
  }

  return `
    <div class="${className}">
      L
    </div>
  `;
}

function toast(
  text,
  type=""
){
  const root=qs("#toasts");

  const div=
    document.createElement("div");

  div.className="toast";

  div.innerHTML=`
    <i
      data-lucide="${
        type==="error"
          ?"circle-alert"
          :type==="success"
            ?"circle-check"
            :"info"
      }"
      class="icon-sm"
    ></i>

    <span>
      ${esc(text)}
    </span>
  `;

  root.appendChild(div);

  refreshIcons();

  setTimeout(()=>{
    div.style.opacity="0";

    setTimeout(
      ()=>div.remove(),
      200
    );
  },3000);
}

function modal(
  title,
  content
){

          </div>

    `;

  refreshIcons();
}

function closeModal(){
  qs("#modalRoot").innerHTML="";
}

function setLoading(
  button,
  loading
){
  if(!button)return;

  button.disabled=loading;

  if(loading){
    button.dataset.oldHtml=
      button.innerHTML;

    button.innerHTML=`
      <i
        data-lucide="loader-circle"
        class="icon-sm spin"
      ></i>
    `;
  }else{
    if(button.dataset.oldHtml){
      button.innerHTML=
        button.dataset.oldHtml;
    }
  }

  refreshIcons();
}

/* =====================================================
   INITIALIZE
===================================================== */

async function loadBranding(){
  try{
    const {data}=
      await sb
        .from("app_settings")
        .select("logo_url")
        .eq("id",1)
        .maybeSingle();

    state.logoUrl=
      data?.logo_url||null;
  }catch{
    state.logoUrl=null;
  }
}

async function init(){
  await loadBranding();

  const {
    data:{
      session
    }
  }=
    await sb.auth.getSession();

  state.session=session;
  state.user=session?.user||null;

  if(state.user){
    await loadMe();
  }

  render();

  sb.auth.onAuthStateChange(
    async(
      event,
      session
    )=>{
      state.session=session;
      state.user=session?.user||null;

      if(state.user){
        await loadMe();
      }else{
        state.profile=null;
        state.wallet={balance:0};
        state.page="chats";
      }

      render();
    }
  );
}

/* =====================================================
   CURRENT PROFILE
===================================================== */

async function loadMe(){
  if(!state.user)return;

  try{
    /*
      Ця функція створить profile/wallet,
      якщо акаунт був створений раніше,
      ніж таблиці.
    */
    try{
      await sb.rpc(
        "ensure_my_profile"
      );
    }catch(error){
      console.warn(
        "ensure_my_profile",
        error
      );
    }

    const {
      data:profile,
      error:profileError
    }=
      await sb
        .from("profiles")
        .select("*")
        .eq(
          "id",
          state.user.id
        )
        .maybeSingle();

    if(profileError){
      console.error(
        profileError
      );
    }

    if(profile){
      state.profile=profile;
    }else{
      const login=
        state.user
          .user_metadata
          ?.login
        ||
        state.user
          .email
          ?.split("@")[0]
        ||
        "user";

      state.profile={
        id:state.user.id,
        login,
        username:login,
        public_id:"------",
        avatar_url:null,
        banner_url:null,
        role:"user",
        created_at:
          state.user.created_at
      };
    }

    const {
      data:wallet
    }=
      await sb
        .from("wallets")
        .select("*")
        .eq(
          "user_id",
          state.user.id
        )
        .maybeSingle();

    state.wallet=
      wallet||{
        balance:0
      };

  }catch(error){
    console.error(
      "LOAD PROFILE ERROR",
      error
    );
  }
}

/* =====================================================
   AUTH
===================================================== */

async function signIn(){
  const login=
    qs("#authLogin")
      .value
      .trim();

  const password=
    qs("#authPassword")
      .value;

  if(!validLogin(login)){
    toast(
      "Неправильний логін",
      "error"
    );

    return;
  }

  const button=
    qs("#authButton");

  setLoading(
    button,
    true
  );

  const {error}=
    await sb.auth
      .signInWithPassword({
        email:
          loginEmail(login),
        password
      });

  setLoading(
    button,
    false
  );

  if(error){
    toast(
      "Невірний логін або пароль",
      "error"
    );
  }
}

async function signUp(){
  const login=
    qs("#authLogin")
      .value
      .trim();

  const password=
    qs("#authPassword")
      .value;

  if(!validLogin(login)){
    toast(
      "Логін: 3–24 символи, букви, цифри або _",
      "error"
    );

    return;
  }

  if(
    !password ||
    password.length<8
  ){
    toast(
      "Пароль мінімум 8 символів",
      "error"
    );

    return;
  }

  const button=
    qs("#authButton");

  setLoading(
    button,
    true
  );

  const {
    data,
    error
  }=
    await sb.auth.signUp({
      email:
        loginEmail(login),

      password,

      options:{
        data:{
          login
        }
      }
    });

  setLoading(
    button,
    false
  );

  if(error){
    toast(
      error.message,
      "error"
    );

    return;
  }

  if(!data.session){
    toast(
      "У Supabase потрібно вимкнути Confirm Email",
      "error"
    );

    return;
  }

  toast(
    "Акаунт створено",
    "success"
  );
}

async function logout(){
  if(state.messageChannel){
    await sb.removeChannel(
      state.messageChannel
    );

    state.messageChannel=null;
  }

  await sb.auth.signOut();
}

async function uploadProfileImage(
  file,
  prefix
){
  if(!file)return null;

  if(
    !file.type.startsWith("image/")
  ){
    throw new Error(
      "Оберіть зображення"
    );
  }

  if(
    file.size>
    8*1024*1024
  ){
    throw new Error(
      "Зображення занадто велике"
    );
  }

  const extension=
    file.name
      .split(".")
      .pop()
      ?.toLowerCase()
    ||
    "jpg";

  const path=
    `${state.user.id}/${prefix}-${Date.now()}.${extension}`;

  const {error}=
    await sb.storage
      .from("profiles")
      .upload(
        path,
        file,
        {
          upsert:true
        }
      );

  if(error){
    throw error;
  }

  const {data}=
    sb.storage
      .from("profiles")
      .getPublicUrl(path);

  return data.publicUrl;
}

async function saveProfile(){
  const button=
    qs("#profileSaveButton");

  const username=
    qs("#editUsername")
      .value
      .trim();

  const publicId=
    qs("#editPublicId")
      .value
      .trim();

  if(
    !/^[A-Za-z0-9_]{3,24}$/
      .test(username)
  ){
    toast(
      "Username: 3–24 символи, букви, цифри або _",
      "error"
    );

    return;
  }

  if(
    !/^\d{6}$/
      .test(publicId)
  ){
    toast(
      "ID повинен містити рівно 6 цифр",
      "error"
    );

    return;
  }

  setLoading(
    button,
    true
  );

  try{
    let avatarUrl=
      state.profile?.avatar_url||
      null;

    let bannerUrl=
      state.profile?.banner_url||
      null;

    const avatarFile=
      qs("#avatarFile")
        ?.files?.[0];

    const bannerFile=
      qs("#bannerFile")
        ?.files?.[0];

    if(avatarFile){
      avatarUrl=
        await uploadProfileImage(
          avatarFile,
          "avatar"
        );
    }

    if(bannerFile){
      bannerUrl=
        await uploadProfileImage(
          bannerFile,
          "banner"
        );
    }

    const {data,error}=
      await sb
        .from("profiles")
        .update({
          username,
          public_id:publicId,
          avatar_url:avatarUrl,
          banner_url:bannerUrl,
          updated_at:
            new Date()
              .toISOString()
        })
        .eq(
          "id",
          state.user.id
        )
        .select()
        .single();

    if(error){
      throw error;
    }

    state.profile=data;

    closeModal();

    render();

    toast(
      "Профіль збережено",
      "success"
    );

  }catch(error){
    console.error(error);

    const message=
      String(
        error?.message||""
      ).toLowerCase();

    if(
      message.includes("duplicate") ||
      message.includes("unique")
    ){
      toast(
        "Такий Username або ID уже зайнятий",
        "error"
      );
    }else{
      toast(
        error.message||
        "Не вдалося зберегти профіль",
        "error"
      );
    }

  }finally{
    setLoading(
      button,
      false
    );
  }
}

function formatCard(input){
  let value=
    input.value
      .replace(/\D/g,"")
      .slice(0,16);

  value=value.replace(
    /(\d{4})(?=\d)/g,
    "$1 "
  );

  input.value=value;

  const preview=
    qs("#cardPreview");

  if(preview){
    preview.textContent=
      value||
      "•••• •••• •••• ••••";
  }
}

function formatDateCard(input){
  let value=
    input.value
      .replace(/\D/g,"")
      .slice(0,4);

  if(value.length>2){
    value=
      value.slice(0,2)
      +
      "/"
      +
      value.slice(2);
  }

  input.value=value;

  const preview=
    qs("#datePreview");

  if(preview){
    preview.textContent=
      value||"MM/YY";
  }
}

async function fakePayment(){
  const amount=
    Number(
      qs("#topupAmount")
        .value
        .replace(",",".")
    );

  if(
    !Number.isFinite(amount) ||
    amount<=0
  ){
    toast(
      "Вкажіть правильну суму",
      "error"
    );

    return;
  }

  const button=
    qs("#payButton");

  setLoading(
    button,
    true
  );

  /*
    Дані картки нікуди
    не передаються і не зберігаються.
  */

  await new Promise(
    resolve=>
      setTimeout(resolve,1400)
  );

  setLoading(
    button,
    false
  );

  qs("#paymentError")
    ?.classList
    .remove("hidden");

  ["cardNumber","cardDate","cardCVV"]
    .forEach(id=>{
      const el=qs("#"+id);

      if(el){
        el.value="";
      }
    });
}

async function runUserSearch(value){
  const root=
    qs("#userResults");

  if(!root)return;

  const query=
    value.trim();

  if(query.length<2){
    root.innerHTML="";
    return;
  }

  let request=
    sb
      .from("profiles")
      .select(
        "id,login,username,public_id,avatar_url,banner_url,created_at"
      )
      .neq(
        "id",
        state.user.id
      )
      .limit(15);

  if(/^\d{6}$/.test(query)){
    request=
      request.eq(
        "public_id",
        query
      );
  }else{
    const safe=
      query.replace(
        /[^A-Za-z0-9_]/g,
        ""
      );

    request=
      request.ilike(
        "username",
        `%${safe}%`
      );
  }

  const {
    data,
    error
  }=
    await request;

  if(error){
    console.error(error);
    return;
  }

  if(!data?.length){
    root.innerHTML=`
      <div class="empty">
        <strong>
          Нічого не знайдено
        </strong>
      </div>
    `;

    return;
  }

  root.innerHTML=
    data.map(user=>`
      <div
        class="chat-item"
        style="cursor:default"
      >

        <div
          onclick="
            openPublicProfile(
              '${user.id}'
            )
          "
          style="cursor:pointer"
        >
          ${avatar(user)}
        </div>

        <div
          class="chat-item-content"
          onclick="
            openPublicProfile(
              '${user.id}'
            )
          "
          style="cursor:pointer"
        >
          <div class="chat-name">
            ${esc(user.username)}
          </div>

          <div class="chat-preview">
            ID ${esc(user.public_id)}
          </div>
        </div>

        <button
          class="icon-btn"
          onclick="
            createChat(
              '${user.id}'
            )
          "
        >
          <i
            data-lucide="message-circle"
            class="icon-sm"
          ></i>
        </button>

      </div>
    `).join("");

  refreshIcons();
}

async function loadChats(){
  const root=
    qs("#chatList");

  if(!root)return;

  const uid=
    state.user.id;

  const {
    data,
    error
  }=
    await sb
      .from("direct_conversations")
      .select("*")
      .or(
        `user1_id.eq.${uid},user2_id.eq.${uid}`
      )
      .order(
        "updated_at",
        {
          ascending:false
        }
      );

  if(error){
    root.innerHTML=`
      <div class="empty">
        <strong>
          Не вдалося завантажити чати
        </strong>
      </div>
    `;

    return;
  }

  const chats=data||[];

  const ids=
    chats.map(chat=>
      chat.user1_id===uid
        ?chat.user2_id
        :chat.user1_id
    );

  let users=[];

  if(ids.length){
    const {data:profiles}=
      await sb
        .from("profiles")
        .select(
          "id,login,username,public_id,avatar_url,banner_url,created_at"
        )
        .in(
          "id",
          ids
        );

    users=profiles||[];
  }

  const map=
    Object.fromEntries(
      users.map(user=>[
        user.id,
        user
      ])
    );

  state.conversations=
    chats.map(chat=>{
      const otherId=
        chat.user1_id===uid
          ?chat.user2_id
          :chat.user1_id;

      return {
        ...chat,
        other:map[otherId]
      };
    });

  renderChatList();
}

        </strong>

        <p>
          Створіть першу розмову.

          <div class="chat-item-content">

              <span class="chat-name">

                  chat.other?.username||
                  "Користувач"
                )}

              <span class="chat-time">
                ${formatTime(
                  chat.updated_at
                )}

            <div class="chat-preview">
              Відкрити розмову
            </div>

          </div>

        </button>
      `)
      .join("");

  refreshIcons();
}

function filterChats(value){
  const query=
    value
      .trim()
      .toLowerCase();

  qsa(".chat-item")
    .forEach(item=>{
      if(!item.dataset.search){
        return;
      }

      item.style.display=
        item.dataset.search
          .includes(query)
          ?""
          :"none";
    });
}

async function createChat(userId){
  const {
    data,
    error
  }=
    await sb.rpc(
      "get_or_create_direct_conversation",
      {
        target_user_id:userId
      }
    );

  if(error){
    toast(
      error.message||
      "Не вдалося створити чат",
      "error"
    );

    return;
  }

  closeModal();

  await loadChats();

  await openChat(
    data,
    userId
  );
}

async function openChat(
  conversationId,
  userId
){
  let user=
    state.conversations
      .find(
        chat=>
          chat.id===conversationId
      )
      ?.other;

  if(!user){
    const {data}=
      await sb
        .from("profiles")
        .select(
          "id,login,username,public_id,avatar_url,banner_url,created_at"
        )
        .eq(
          "id",
          userId
        )
        .maybeSingle();

    user=data;
  }

  state.activeConversation={
    id:conversationId
  };

  state.activeChatUser=user;

  state.mobileChatOpen=true;

  const {
    data,
    error
  }=
    await sb
      .from("messages")
      .select("*")
      .eq(
        "conversation_id",
        conversationId
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      )
      .limit(500);

  if(error){
    toast(
      "Не вдалося відкрити чат",
      "error"
    );

    return;
  }

  state.messages=data||[];

  if(state.messageChannel){
    await sb.removeChannel(
      state.messageChannel
    );
  }

  state.messageChannel=
    sb
      .channel(
        "chat:"+conversationId
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            `conversation_id=eq.${conversationId}`
        },
        payload=>{
          const incoming=
            payload.new;

          const exists=
            state.messages.some(
              message=>
                message.id===
                incoming.id
            );

          if(exists){
            state.messages=
              state.messages.map(
                message=>
                  message.id===
                  incoming.id
                    ?incoming
                    :message
              );
          }else{
            state.messages.push(
              incoming
            );
          }

          refreshMessages(true);
        }
      )
      .subscribe();

  renderChats();

  setTimeout(
    scrollMessages,
    40
  );
}

function closeMobileChat(){
  state.mobileChatOpen=false;
  renderChats();
}

function refreshMessages(
  scroll=false
){
  const root=
    qs("#messages");

  if(!root)return;

  root.innerHTML=
    messagesMarkup();

  refreshIcons();

  if(scroll){
    scrollMessages();
  }
}

function scrollMessages(){
  const root=
    qs("#messages");

  if(root){
    root.scrollTop=
      root.scrollHeight;
  }
}

function messageKey(event){
  if(
    event.key==="Enter" &&
    !event.shiftKey &&
    window.innerWidth>760
  ){
    event.preventDefault();
    sendMessage();
  }
}

async function sendMessage(){
  if(!state.activeConversation){
    return;
  }

  const input=
    qs("#messageInput");

  const content=
    input?.value.trim();

  if(!content)return;

  input.value="";

  const id=
    crypto.randomUUID();

  state.messages.push({
    id,

    conversation_id:
      state.activeConversation.id,

    sender_id:
      state.user.id,

    content,

    created_at:
      new Date().toISOString(),

    _pending:true
  });

  refreshMessages(true);

  const {error}=
    await sb
      .from("messages")
      .insert({
        id,

        conversation_id:
          state.activeConversation.id,

        sender_id:
          state.user.id,

        content
      });

  if(error){
    state.messages=
      state.messages.map(
        message=>
          message.id===id
            ?{
                ...message,
                _pending:false,
                _failed:true
              }
            :message
      );

    refreshMessages();

    toast(
      "Повідомлення не надіслано",
      "error"
    );

    return;
  }

  state.messages=
    state.messages.map(
      message=>
        message.id===id
          ?{
              ...message,
              _pending:false
            }
          :message
    );

  refreshMessages();
}

async function loadListings(){

      .from("marketplace_listings")
      .select(`

      `)
      .eq(

async function createListing(){
  const type=
    qs("#listingType").value;

  const price=
    Number(
      qs("#listingPrice")
        .value
        .replace(",",".")
    );

  if(
    !Number.isFinite(price) ||
    price<=0
  ){
    toast(
      "Вкажіть правильну ціну",
      "error"
    );

    return;
  }

  const assetValue=
    type==="username"
      ?state.profile.username
      :state.profile.public_id;

  const button=
    qs("#listingButton");

  setLoading(
    button,
    true
  );

  const {error}=
    await sb
      .from("marketplace_listings")
      .insert({
        seller_id:
          state.user.id,

        asset_type:type,

        asset_value:
          assetValue,

        price,

        status:"active"
      });

  setLoading(
    button,
    false
  );

  if(error){
    toast(
      error.message||
      "Не вдалося виставити",
      "error"
    );

    return;
  }

  closeModal();

  await loadListings();

  toast(
    "Виставлено на продаж",
    "success"
  );
}

async function cancelListing(id){
  const {error}=
    await sb
      .from("marketplace_listings")
      .update({
        status:"cancelled"
      })
      .eq(
        "id",
        id
      )
      .eq(
        "seller_id",
        state.user.id
      );

  if(error){
    toast(
      "Не вдалося зняти",
      "error"
    );

    return;
  }

  await loadListings();
}

async function buyListing(id){

  setLoading(
    button,

  const {error}=
    await sb.rpc(
      "admin_adjust_balance",

}

async function saveAdminLogo(){
  const file=
    qs("#adminLogo")
      ?.files?.[0];

  if(!file){
    toast(
      "Оберіть зображення",
      "error"
    );

    return;
  }

  const button=
    qs("#logoButton");

  setLoading(
    button,
    true
  );

  try{
    const ext=
      file.name
        .split(".")
        .pop()
      ||
      "png";

    const path=
      `logo-${Date.now()}.${ext}`;

    const {error}=
      await sb.storage
        .from("branding")
        .upload(
          path,
          file,
          {
            upsert:true
          }
        );

    if(error){
      throw error;
    }

    const {data}=
      sb.storage
        .from("branding")
        .getPublicUrl(path);

    const url=
      data.publicUrl;

    const {
      error:updateError
    }=
      await sb
        .from("app_settings")
        .update({
          logo_url:url,
          updated_at:
            new Date()
              .toISOString()
        })
        .eq(
          "id",
          1
        );

    if(updateError){
      throw updateError;
    }

    state.logoUrl=url;

    render();

    toast(
      "Логотип змінено",
      "success"
    );

  }catch(error){
    console.error(error);

    toast(
      error.message||
      "Не вдалося змінити логотип",
      "error"
    );

  }finally{
    setLoading(
      button,
      false
    );
  }
}
