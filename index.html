   LOAD CHAT LIST
===================================================== */

async function loadChats(){

  const root=
    qs("#chatList");


  if(!root){
    return;
  }


  const uid=
    state.user.id;


  const requestId=
    ++state.chatListRequest;


  const {
    data,
    error
  }=
    await sb

      .from(
        "direct_conversations"
      )

      .select("*")

      .or(
        `user1_id.eq.${uid},user2_id.eq.${uid}`
      )

      .order(
        "updated_at",
        {
          ascending:false
        }
      );


  if(error){

    if(
      requestId!==
      state.chatListRequest
      ||
      uid!==state.user?.id
    ){
      return;
    }

    root.innerHTML=`
      <div class="empty">

        <strong>
          Не вдалося завантажити чати
        </strong>

        <p>
          Перевірте з'єднання та відкрийте розділ ще раз.
        </p>

      </div>
    `;

    return;

  }


  const chats=
    data
    ||
    [];


  const ids=
    chats.map(
      chat=>

        chat.user1_id===uid

          ?chat.user2_id

          :chat.user1_id
    );


  let users=[];


  if(ids.length){

    const {
      data:profiles,
      error:profilesError
    }=
      await sb

        .from("profiles")

        .select(
          "id,login,username,public_id,avatar_url,banner_url,created_at"
        )

        .in(
          "id",
          ids
        );


    users=
      profiles
      ||
      [];


    if(profilesError){

      console.error(
        "CHAT PROFILES ERROR",
        profilesError
      );

    }

  }


  const map=
    Object.fromEntries(

      users.map(
        user=>[
          user.id,
          user
        ]
      )

    );


  const withPreview=
    await Promise.all(

      chats.map(
        async chat=>{

          const otherId=
            chat.user1_id===uid

              ?chat.user2_id

              :chat.user1_id;


          let latest=null;


          try{

            const {
              data:lastMessage
            }=
              await sb

                .from("messages")

                .select(
                  "content,image_path,created_at,sender_id"
                )

                .eq(
                  "conversation_id",
                  chat.id
                )

                .order(
                  "created_at",
                  {
                    ascending:false
                  }
                )

                .limit(1)

                .maybeSingle();


            latest=
              lastMessage;

          }catch{}


          return {

            ...chat,

            other:
              map[otherId]
              ||
              {
                id:otherId,
                login:"user",
                username:"Користувач",
                public_id:"------",
                avatar_url:null,
                banner_url:null
              },

            latest

          };

        }
      )

    );


  if(
    requestId!==
    state.chatListRequest
    ||
    uid!==state.user?.id
  ){

    return;

  }


  state.conversations=
    withPreview;


  renderChatList();

}


function renderChatList(){

  const root=
    qs("#chatList");


  if(!root){
    return;
  }


  if(
    !state.conversations.length
  ){

    root.innerHTML=`
      <div class="empty">

        <div class="empty-icon">

          <i
            data-lucide="message-circle"
            class="icon"
          ></i>

        </div>

        <strong>
          Чатів ще немає
        </strong>

        <p>
          Натисніть кнопку зверху
          та знайдіть користувача.
        </p>

      </div>
    `;


    refreshIcons();

    return;

  }


  root.innerHTML=
    state.conversations

      .map(
        chat=>{

          let preview=
            "Розмову створено";


          if(
            chat.latest?.image_path
            &&
            chat.latest?.content
          ){

            preview=
              "Фото · "
              +
              chat.latest.content;

          }else if(
            chat.latest?.image_path
          ){

            preview=
              "Фото";

          }else if(
            chat.latest?.content
          ){

            preview=
              chat.latest.content;

          }


          return `

            <button
              class="
                chat-item

                ${
                  state.activeConversation
                    ?.id===chat.id
                    ?"active"
                    :""
                }
              "

              data-search="${esc(
                (
                  (
                    chat.other?.username
                    ||
                    ""
                  )

                  +

                  " "

                  +

                  (
                    chat.other?.public_id
                    ||
                    ""
                  )
                )
                .toLowerCase()
              )}"

              onclick="
                openChat(
                  '${chat.id}',
                  '${chat.other?.id}'
                )
              "
            >

              ${avatarStatus(
                chat.other
              )}


              <div class="chat-item-content">

                <div class="chat-item-row">

                  <span class="chat-name">

                    ${esc(
                      chat.other
                        ?.username
                      ||
                      "Користувач"
                    )}

                  </span>


                  <span class="chat-time">

                    ${formatTime(
                      chat.latest
                        ?.created_at
                      ||
                      chat.updated_at
                    )}

                  </span>

                </div>


                <div class="chat-preview">

                  ${esc(preview)}

                </div>

              </div>

            </button>
          `;

        }
      )

      .join("");


  refreshIcons();

  refreshOnlineIndicators();

}


function filterChats(value){

  const query=
    value
      .trim()
      .toLowerCase();


  qsa(
    ".chat-item"

    .forEach(
      item=>{

        if(
          !item.dataset.search
        ){

          return;

        }


        item.style.display=

          item.dataset.search
            .includes(query)

            ?""

            :"none";

      }
    );

}

/* =====================================================
   CHAT CHANNEL
===================================================== */

async function stopChatChannel(){

  state.chatChannelReady=
    false;


  if(
    state.messageChannel
  ){

    try{

      await sb.removeChannel(
        state.messageChannel
      );

    }catch{}


    state.messageChannel=
      null;

  }

}


async function setupChatChannel(
  conversationId,
  requestId=null
){

  await stopChatChannel();


  if(
    requestId!==null
    &&
    requestId!==
    state.chatOpenRequest
  ){

    return false;

  }


  const channel=
    sb.channel(

      "chat:"
      +
      conversationId,

      {
        config:{
          broadcast:{
            self:false
          }
        }
      }

    );


  state.messageChannel=
    channel;


  channel.on(

    "postgres_changes",

    {
      event:"INSERT",

      schema:"public",

      table:"messages",

      filter:
        `conversation_id=eq.${conversationId}`
    },

    async payload=>{

      if(
        state.activeConversation?.id!==
        conversationId
      ){

        return;

      }

      const incoming=
        await hydrateMessageMedia(
          payload.new
        );


      if(
        state.activeConversation?.id!==
        conversationId
      ){

        return;

      }


      const index=
        state.messages
          .findIndex(
            message=>
              message.id===
              incoming.id
          );


      if(index>=0){

        state.messages[index]=
          incoming;

      }else{

        state.messages
          .push(
            incoming
          );

      }


      refreshMessages(
        true
      );


      refreshConversationPreview(
        incoming
      );

    }

  );


  channel.on(

    "broadcast",

    {
      event:"typing"
    },

    payload=>{

      const data=
        payload.payload||{};


      if(
        data.user_id===
        state.user.id
      ){

        return;

      }


      if(
        data.conversation_id!==
        state.activeConversation?.id
      ){

        return;

      }


      showTypingIndicator(
        data.user_id,
        Boolean(
          data.typing
        )
      );

    }

  );


  channel.subscribe(
    status=>{

      state.chatChannelReady=
        status===
        "SUBSCRIBED";

    }
  );


  return true;

}


/* =====================================================
   OPEN CHAT
===================================================== */

async function openChat(
  conversationId,
  userId
){

  const requestId=
    ++state.chatOpenRequest;

  await stopTyping();


  clearSelectedImage();


  if(
    state.typingHideTimer
  ){

    clearTimeout(
      state.typingHideTimer
    );

    state.typingHideTimer=
      null;

  }


  state.typingUserId=
    null;


  let user=
    state.conversations

      .find(
        chat=>
          chat.id===
          conversationId
      )

      ?.other;


  if(!user){

    const {data}=
      await sb

        .from("profiles")

        .select(
          "id,login,username,public_id,avatar_url,banner_url,created_at"
        )

        .eq(
          "id",
          userId
        )

        .maybeSingle();


    user=
      data;

  }


  if(
    requestId!==
    state.chatOpenRequest
  ){

    return;

  }


  if(!user){

    toast(
      "Користувача не знайдено",
      "error"
    );

    return;

  }


  const {
    data,
    error
  }=
    await sb

      .from("messages")

      .select("*")

      .eq(
        "conversation_id",
        conversationId
      )

      .order(
        "created_at",
        {
          ascending:true
        }
      )

      .limit(500);


  if(
    requestId!==
    state.chatOpenRequest
  ){

    return;

  }


  if(error){

    toast(
      "Не вдалося відкрити чат",
      "error"
    );

    return;

  }


  const hydratedMessages=
    await Promise.all(

      (data||[])
        .map(
          hydrateMessageMedia
        )

    );


  if(
    requestId!==
    state.chatOpenRequest
  ){

    return;

  }


  state.activeConversation={
    id:
      conversationId
  };


  state.activeChatUser=
    user;


  state.mobileChatOpen=
    true;


  state.messages=
    hydratedMessages;


  const channelReady=
    await setupChatChannel(
      conversationId,
      requestId
    );


  if(
    !channelReady
    ||
    requestId!==
    state.chatOpenRequest
  ){

    return;

  }


  renderChats();


  setTimeout(
    scrollMessages,
    40
  );

}


function closeMobileChat(){

  state.chatOpenRequest++;

  stopTyping();

  clearSelectedImage();


  state.mobileChatOpen=
    false;


  renderChats();

}

/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  if(
    !state.activeConversation
    ||
    state.sendingMessage
  ){

    return;

  }


  const conversationId=
    state.activeConversation.id;


  const isStillOpen=()=>
    state.activeConversation?.id===
    conversationId;


  const input=
    qs("#messageInput");


  const content=
    input
      ?.value
      .trim()
    ||
    "";


  const imageFile=
    state.selectedImage;


  if(
    !content
    &&
    !imageFile
  ){

    return;

  }


  state.sendingMessage=
    true;


  await stopTyping();


  const button=
    qs("#sendMessageButton");


  if(button){

    button.disabled=
      true;

  }


  const id=
    crypto.randomUUID();


  const createdAt=
    new Date()
      .toISOString();


  let localImageUrl=
    null;


  if(
    imageFile
    &&
    state.selectedImagePreview
  ){

    localImageUrl=
      state.selectedImagePreview;

  }


  const optimistic={

    id,

    conversation_id:
      conversationId,

    sender_id:
      state.user.id,

    content:
      content||null,

    image_path:
      imageFile
        ?"pending"
        :null,

    created_at:
      createdAt,

    _imageUrl:
      localImageUrl,

    _uploading:
      Boolean(imageFile),

    _pending:
      !imageFile,

    _failed:false

  };


  state.messages.push(
    optimistic
  );


  if(input){

    input.value="";

    input.style.height=
      "46px";

  }


  state.selectedImage=
    null;

  state.selectedImagePreview=
    null;


  updateComposerPreview();


  refreshMessages(
    true
  );


  try{

    let imagePath=null;


    if(imageFile){

      imagePath=
        await uploadChatImage(
          imageFile,
          conversationId
        );


      state.messages=
        state.messages.map(
          message=>

            message.id===id

              ?{
                  ...message,

                  image_path:
                    imagePath,

                  _uploading:false,

                  _pending:true
                }

              :message
        );


      if(isStillOpen()){

        refreshMessages(
          true
        );

      }

    }


    const {
      data:inserted,
      error
    }=
      await sb

        .from("messages")

        .insert({

          id,

          conversation_id:
            conversationId,

          sender_id:
            state.user.id,

          content:
            content||null,

          image_path:
            imagePath

        })

        .select()

        .single();


    if(error){

      throw error;

    }


    let finalMessage=
      await hydrateMessageMedia(
        inserted
      );


    if(
      imageFile
      &&
      !finalMessage._imageUrl
      &&
      localImageUrl
    ){

      finalMessage._imageUrl=
        localImageUrl;

    }


    state.messages=
      state.messages.map(
        message=>

          message.id===id

            ?finalMessage

            :message
      );


    if(isStillOpen()){

      refreshMessages(
        true
      );

    }


    refreshConversationPreview(
      finalMessage
    );


    if(
      localImageUrl
      &&
      finalMessage._imageUrl!==
      localImageUrl
    ){

      try{

        URL.revokeObjectURL(
          localImageUrl
        );

      }catch{}

    }


  }catch(error){

    console.error(
      "SEND ERROR",
      error
    );


    state.messages=
      state.messages.map(
        message=>

          message.id===id

            ?{
                ...message,

                _pending:false,

                _uploading:false,

                _failed:true
              }

            :message
      );


    if(isStillOpen()){

      refreshMessages();

    }


    toast(
      error.message
      ||
      "Повідомлення не надіслано",
      "error"
    );


  }finally{

    state.sendingMessage=
      false;

    if(button){

      button.disabled=
        false;

    }


    if(isStillOpen()){

      qs("#messageInput")
        ?.focus();

    }

  }

}


/* =====================================================
   CHAT PREVIEW UPDATE
===================================================== */

function refreshConversationPreview(
  message
){

  const chat=
    state.conversations
      .find(
        item=>
          item.id===
          message.conversation_id
      );


  if(!chat){

    return;

  }


  chat.latest={

    content:
      message.content,

    image_path:
      message.image_path,

    created_at:
      message.created_at,

    sender_id:
      message.sender_id

  };


  chat.updated_at=
    message.created_at;


  state.conversations.sort(

    (a,b)=>

      new Date(
        b.latest?.created_at
        ||
        b.updated_at
      )

      -

      new Date(
        a.latest?.created_at
        ||
        a.updated_at
      )

  );


  renderChatList();

}

                </th>

                <th>
                  ID
                </th>

                <th>
                  Роль
                </th>

                <th>
                  Статус
                </th>

                <th>
                  Дата
                </th>

              </tr>

            </thead>


            <tbody>

              ${
                state.adminUsers

                  .map(
                    user=>`

                      <tr

                          (
                            user.login
                            +
                            " "
                            +
                            user.username
                            +
                            " "
                            +
                            user.public_id
                          )
                          .toLowerCase()
                        )}"
                      >

                        <td>
                          ${esc(
                            user.login
                          )}
                        </td>

                        <td>
                          ${esc(
                            user.username
                          )}
                        </td>

                        <td>
                          ${esc(
                            user.public_id
                          )}
                        </td>

                        <td>

                          <span
                            class="
                              role

                              ${
                                user.role===
                                "admin"

                                  ?"admin"

                                  :""
                              }
                            "
                          >

                            ${esc(
                              user.role
                            )}

                          </span>

                        </td>

                        <td>

                          ${presenceLabel(
                            user.id
                          )}

                        </td>

                        <td>
                          ${formatDate(
                            user.created_at
                          )}
                        </td>

                      </tr>
                    `
                  )

                  .join("")
              }

            </tbody>

          </table>

        </div>

      </section>
    `;


  refreshIcons();

  refreshOnlineIndicators();

}


function filterAdminUsers(value){

  const query=
    value
      .trim()
      .toLowerCase();


  qsa(
    ".admin-user-row"
  )
    .forEach(
      row=>{

        row.style.display=

          row.dataset.search
            .includes(query)

            ?""

            :"none";

      }
    );

}

async function openAdminChat(
  chatId
){

  const {
    data:messages,
    error
  }=
    await sb

      .from("messages")

      .select("*")

      .eq(
        "conversation_id",
        chatId
      )

      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    toast(
      "Не вдалося відкрити чат",
      "error"
    );

    return;

  }


  const ids=[
    ...new Set(

      (messages||[])

        .map(
          message=>
            message.sender_id
        )

    )
  ];


  let users=[];


  if(ids.length){

    const {data}=
      await sb

        .from("profiles")

        .select(
          "id,username"
        )

        .in(
          "id",
          ids
        );


    users=
      data
      ||
      [];

  }


  const map=
    Object.fromEntries(

      users.map(
        user=>[
          user.id,
          user.username
        ]
      )

    );


  const hydrated=
    await Promise.all(
      (messages||[])
        .map(
          hydrateMessageMedia
        )
    );


  modal(

    "Перегляд чату",

    `
      <div
        style="
          display:flex;
          flex-direction:column;
          gap:7px
        "
      >

        ${
          hydrated.length

            ?hydrated

                .map(
                  message=>`

                    <div
                      style="
                        padding:10px;

                        border-radius:12px;

                        border:
                        1px solid var(--border);

                        background:#171717
                      "
                    >

                      <div
                        style="
                          color:var(--yellow);

                          font-size:10px;
                          font-weight:800
                        "
                      >

                        ${esc(
                          map[
                            message.sender_id
                          ]
                          ||
                          "Користувач"
                        )}

                      </div>


                      ${
                        message._imageUrl

                          ?`
                            <img
                              src="${esc(
                                message._imageUrl
                              )}"

                              style="
                                display:block;

                                max-width:100%;

                                max-height:300px;

                                object-fit:contain;

                                border-radius:10px;

                                margin-top:8px;

                                cursor:pointer
                              "

                              onclick="
                                openImageViewer(
                                  ${esc(
                                    jsString(
                                      message._imageUrl
                                    )
                                  )}
                                )
                              "
                            >
                          `

                          :""
                      }


                      ${
                        message.content

                          ?`
                            <div
                              style="
                                margin-top:7px;

                                line-height:1.45;

                                font-size:12px
                              "
                            >
                              ${esc(
                                message.content
                              )}
                            </div>
                          `

                          :""
                      }


                      <div
                        style="
                          margin-top:5px;

                          color:#666;

                          font-size:8px
                        "
                      >

                        ${formatDate(
                          message.created_at
                        )}

                        ${formatTime(
                          message.created_at
                        )}

                      </div>

                    </div>
                  `
                )

                .join("")

            :`
              <div class="empty">
                Повідомлень немає
              </div>
            `
        }

      </div>
    `

  );

}

async function saveAdminLogo(){

  const file=
    qs("#adminLogo")
      ?.files?.[0];


  if(!file){

    toast(
      "Оберіть зображення",
      "error"
    );

    return;

  }


  const allowed=[
    "image/jpeg",
    "image/png",
    "image/webp",
    "image/gif"
  ];


  if(
    !allowed.includes(
      file.type
    )
  ){

    toast(
      "Дозволені JPG, PNG, WEBP або GIF",
      "error"
    );

    return;

  }


  if(
    file.size>
    5*1024*1024
  ){

    toast(
      "Логотип має бути до 5 МБ",
      "error"
    );

    return;

  }


  const button=
    qs("#logoButton");


  setLoading(
    button,
    true
  );


  try{

    const ext=
      imageExtension(file);


    const path=
      `logo-${
        Date.now()
      }.${ext}`;


    const {error}=
      await sb.storage

        .from("branding")

        .upload(

          path,

          file,

          {
            upsert:true
          }

        );


    if(error){

      throw error;

    }


    const {data}=
      sb.storage

        .from("branding")

        .getPublicUrl(path);


    const url=
      data.publicUrl;


    const {
      error:updateError
    }=
      await sb

        .from(
          "app_settings"
        )

        .upsert({

          id:1,

          logo_url:
            url,

          updated_at:
            new Date()
              .toISOString()

        });


    if(updateError){

      throw updateError;

    }


    state.logoUrl=
      url;


    render();


    toast(
      "Логотип змінено",
      "success"
    );


  }catch(error){

    console.error(error);


    toast(
      error.message
      ||
      "Не вдалося змінити логотип",
      "error"
    );


  }finally{

    setLoading(
      button,
      false
    );

  }

}
