<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#f2c314"
>

<title>LiptonGram</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
  box-sizing:border-box;
}

:root{
  --bg:#080808;
  --panel:#111;
  --panel2:#171717;
  --panel3:#202020;

  --text:#fff;
  --muted:#858585;

  --yellow:#f2c314;
  --yellow2:#ffdd4c;

  --danger:#ff5858;
  --success:#3ecf72;

  --border:rgba(255,255,255,.08);

  --shadow:
    0 25px 70px rgba(0,0,0,.36);

  --ease:
    cubic-bezier(.2,.8,.2,1);
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

html{
  scroll-behavior:smooth;
}

body{
  color:var(--text);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      900px 450px at 50% -180px,
      rgba(242,195,20,.14),
      transparent 70%
    ),
    var(--bg);

  -webkit-font-smoothing:antialiased;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  color:inherit;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

input::placeholder,
textarea::placeholder{
  color:#666;
}

img{
  max-width:100%;
}

.hidden{
  display:none!important;
}

.icon{
  width:20px;
  height:20px;
}

.icon-sm{
  width:17px;
  height:17px;
}

.spin{
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@keyframes pageEnter{
  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:
      translateY(18px)
      scale(.975);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes messageAppear{
  from{
    opacity:0;
    transform:
      translateY(7px)
      scale(.985);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes typingBounce{
  0%,
  60%,
  100%{
    transform:translateY(0);
    opacity:.4;
  }

  30%{
    transform:translateY(-4px);
    opacity:1;
  }
}

@keyframes pulseOnline{
  0%{
    box-shadow:
      0 0 0 0
      rgba(62,207,114,.25);
  }

  70%{
    box-shadow:
      0 0 0 5px
      rgba(62,207,114,0);
  }

  100%{
    box-shadow:
      0 0 0 0
      rgba(62,207,114,0);
  }
}

@keyframes imageIn{
  from{
    opacity:0;
    transform:scale(.97);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

.page-animation{
  animation:
    pageEnter .28s var(--ease) both;
}

::-webkit-scrollbar{
  width:7px;
  height:7px;
}

::-webkit-scrollbar-thumb{
  background:#292929;
  border-radius:10px;
}

::-webkit-scrollbar-track{
  background:transparent;
}


/* BUTTONS */

.btn{
  min-height:43px;
  padding:0 16px;
  border:0;
  border-radius:13px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  font-weight:750;

  cursor:pointer;

  transition:.16s ease;
}

.btn:hover{
  filter:brightness(1.055);
}

.btn:active{
  transform:scale(.965);
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.btn-primary{
  color:#111;

  background:
    linear-gradient(
      135deg,
      var(--yellow2),
      var(--yellow)
    );
}

.btn-secondary{
  background:#1a1a1a;
  border:1px solid var(--border);
}

.btn-danger{
  background:rgba(255,88,88,.1);
  color:#ff7979;
  border:1px solid rgba(255,88,88,.17);
}

.icon-btn{
  width:42px;
  height:42px;
  flex:0 0 42px;

  padding:0;

  border:1px solid var(--border);
  border-radius:13px;

  background:#181818;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  transition:.15s ease;
}

.icon-btn:hover{
  background:#222;
}

.icon-btn:active{
  transform:scale(.93);
}


/* INPUTS */

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field label{
  color:#b4b4b4;
  font-size:12px;
  font-weight:700;
}

.input{
  width:100%;
  height:46px;

  padding:0 14px;

  color:#fff;

  background:#101010;

  border:1px solid var(--border);
  outline:0;
  border-radius:13px;

  transition:.16s ease;
}

.input:hover{
  background:#131313;
}

.input:focus{
  border-color:rgba(242,195,20,.55);

  box-shadow:
    0 0 0 4px
    rgba(242,195,20,.07);
}


/* AUTH */

.auth-page{
  min-height:100vh;
  min-height:100dvh;

  padding:20px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.auth-card{
  width:min(430px,100%);

  padding:28px;

  border-radius:27px;

  background:rgba(15,15,15,.9);

  border:1px solid var(--border);

  box-shadow:var(--shadow);

  backdrop-filter:blur(20px);
}

.auth-logo{
  width:70px;
  height:70px;

  margin:0 auto 18px;

  border-radius:21px;

  overflow:hidden;

  color:#111;

  background:
    linear-gradient(
      135deg,
      var(--yellow2),
      var(--yellow)
    );

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:28px;
  font-weight:900;
}

.auth-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.auth-title{
  margin:0;
  text-align:center;
  font-size:30px;
  font-weight:850;
}

.auth-sub{
  margin:7px 0 23px;
  color:var(--muted);
  text-align:center;
  font-size:13px;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;

  padding:4px;

  margin-bottom:18px;

  background:#0c0c0c;

  border:1px solid var(--border);
  border-radius:14px;
}

.auth-tab{
  height:39px;

  border:0;
  border-radius:10px;

  background:transparent;

  color:#777;

  font-weight:750;

  cursor:pointer;
}

.auth-tab.active{
  background:#202020;
  color:#fff;
}

.auth-form{
  display:flex;
  flex-direction:column;
  gap:14px;
}


/* APP */

.app{
  min-height:100vh;
  min-height:100dvh;

  display:grid;

  grid-template-columns:
    260px minmax(0,1fr);
}

.sidebar{
  position:sticky;
  top:0;

  height:100vh;
  height:100dvh;

  padding:18px 13px;

  border-right:1px solid var(--border);

  background:rgba(9,9,9,.88);

  backdrop-filter:blur(20px);

  display:flex;
  flex-direction:column;

  z-index:30;
}

.brand{
  height:55px;

  padding:0 8px;
  margin-bottom:14px;

  display:flex;
  align-items:center;

  gap:11px;
}

.brand-logo{
  width:40px;
  height:40px;
  flex:0 0 40px;

  border-radius:12px;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#111;

  font-size:18px;
  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--yellow2),
      var(--yellow)
    );
}

.brand-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.brand-name{
  font-size:18px;
  font-weight:850;
}

.side-nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav-btn{
  width:100%;
  height:48px;

  padding:0 13px;

  border:0;
  border-radius:13px;

  color:#858585;
  background:transparent;

  display:flex;
  align-items:center;

  gap:12px;

  font-weight:750;

  cursor:pointer;

  transition:.15s ease;
}

.nav-btn:hover{
  color:#fff;
  background:#151515;
}

.nav-btn.active{
  color:#111;

  background:
    linear-gradient(
      135deg,
      var(--yellow2),
      var(--yellow)
    );
}

.sidebar-space{
  flex:1;
}

.side-user{
  padding:9px;

  border-radius:16px;

  border:1px solid var(--border);

  background:#111;

  display:flex;
  align-items:center;

  gap:9px;
}

.side-user-info{
  min-width:0;
  flex:1;
}

.side-user-name{
  font-size:12px;
  font-weight:800;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.side-user-id{
  margin-top:2px;
  color:#777;
  font-size:10px;
}

.main{
  min-width:0;
}

.page{
  width:min(1180px,100%);

  margin:auto;

  padding:25px;
}

.page-head{
  min-height:54px;

  margin-bottom:18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:14px;
}

.page-title{
  margin:0;

  font-size:27px;
  font-weight:850;

  letter-spacing:-.5px;
}

.page-desc{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.card{
  border:1px solid var(--border);

  border-radius:18px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,.008)
    );

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.19);
}


/* AVATAR */

.avatar{
  width:43px;
  height:43px;

  flex:0 0 43px;

  overflow:hidden;

  border-radius:50%;

  border:
    1px solid
    rgba(255,255,255,.09);

  background:#222;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:800;
}

.avatar.large{
  width:106px;
  height:106px;

  flex:0 0 106px;

  font-size:29px;

  border:4px solid #101010;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.avatar-status-wrap{
  position:relative;

  width:43px;
  height:43px;

  flex:0 0 43px;

  display:inline-flex;
}

.avatar-status-wrap.large{
  width:106px;
  height:106px;

  flex:0 0 106px;
}

.avatar-status-wrap .avatar{
  width:100%;
  height:100%;
  flex:1;
}

.presence-dot{
  position:absolute;

  right:-1px;
  bottom:-1px;

  width:13px;
  height:13px;

  border-radius:50%;

  background:#555;

  border:3px solid #111;
}

.avatar-status-wrap.large
.presence-dot{
  width:20px;
  height:20px;

  right:4px;
  bottom:5px;

  border-width:4px;
}

.presence-dot.online{
  background:#3ecf72;
}

.presence-dot.offline{
  background:#5b5b5b;
}

.presence-text{
  display:inline-flex;
  align-items:center;

  gap:5px;

  color:#777;
}

.presence-text.online{
  color:#54d981;
}

.presence-mini-dot{
  width:6px;
  height:6px;

  flex:0 0 6px;

  border-radius:50%;

  background:#5b5b5b;
}

.presence-text.online
.presence-mini-dot{
  background:#3ecf72;
}


/* EMPTY */

.empty{
  min-height:240px;

  padding:30px;

  color:#777;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;
}

.empty-icon{
  width:52px;
  height:52px;

  margin-bottom:13px;

  border-radius:16px;

  border:1px solid var(--border);

  background:#181818;

  display:flex;
  align-items:center;
  justify-content:center;
}

.empty strong{
  color:#fff;
  font-size:15px;
}

.empty p{
  max-width:400px;

  margin:7px 0 0;

  line-height:1.5;

  font-size:12px;
}


/* BALANCE */

.balance{
  height:42px;

  padding:4px 5px 4px 13px;

  border-radius:13px;

  border:1px solid var(--border);

  background:#151515;

  display:inline-flex;
  align-items:center;

  gap:9px;
}

.balance-value{
  font-size:13px;
  font-weight:850;
}

.balance-plus{
  width:31px;
  height:31px;

  padding:0;

  border:0;
  border-radius:9px;

  color:#111;

  background:var(--yellow);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}


/* PROFILE */

.profile-card{
  overflow:hidden;
}

.profile-banner{
  height:235px;

  background:
    linear-gradient(
      120deg,
      #2b250d,
      #534000,
      #181818
    );

  background-size:cover;
  background-position:center;
}

.profile-info{
  padding:0 23px 23px;

  display:flex;
  align-items:flex-end;

  gap:18px;
}

.profile-avatar{
  margin-top:-50px;
}

.profile-main{
  min-width:0;
  flex:1;

  padding-top:16px;
}

.profile-name{
  margin:0;

  font-size:24px;
  font-weight:850;

  word-break:break-word;
}

.profile-login{
  margin-top:4px;

  color:var(--muted);

  font-size:12px;
}

.profile-tags{
  margin-top:10px;

  display:flex;
  flex-wrap:wrap;

  gap:6px;
}

.tag{
  min-height:27px;

  padding:0 8px;

  border-radius:8px;

  border:1px solid var(--border);

  background:#171717;

  color:#aaa;

  display:inline-flex;
  align-items:center;

  gap:5px;

  font-size:10px;
}

.profile-actions{
  padding-top:15px;
}

.profile-stats{
  margin-top:14px;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:13px;
}

.stat{
  padding:19px;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
}

.stat-value{
  margin-top:7px;

  font-size:21px;
  font-weight:850;

  word-break:break-word;
}


/* =====================================================
   CHATS
===================================================== */

.chat-layout{
  height:
    calc(100dvh - 46px);

  padding:22px;

  display:grid;

  grid-template-columns:
    350px minmax(0,1fr);

  gap:14px;
}

.chat-list-panel{
  min-height:0;

  overflow:hidden;

  display:flex;
  flex-direction:column;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,.008)
    );

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:22px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.22);
}

.chat-list-head{
  padding:
    18px 17px 15px;

  border-bottom:
    1px solid
    rgba(255,255,255,.065);
}

.chat-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-bottom:15px;
}

.chat-title-row h2{
  margin:0;

  font-size:22px;
  font-weight:850;
}

.chat-title-subtitle{
  margin-top:4px;

  color:#707070;

  font-size:10px;
}

.new-chat-btn{
  width:42px;
  height:42px;

  border:0;
  border-radius:13px;

  color:#111;

  background:
    linear-gradient(
      135deg,
      var(--yellow2),
      var(--yellow)
    );

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

.chat-search{
  position:relative;
}

.chat-search-icon{
  position:absolute;

  left:13px;
  top:50%;

  transform:translateY(-50%);

  width:17px;
  height:17px;

  color:#666;

  pointer-events:none;
}

.chat-search-input{
  width:100%;
  height:44px;

  padding:
    0 13px
    0 41px;

  border-radius:14px;

  border:
    1px solid
    rgba(255,255,255,.075);

  outline:none;

  color:#fff;

  background:
    rgba(255,255,255,.035);

  font-size:12px;
}

.chat-search-input:focus{
  background:#151515;

  border-color:
    rgba(242,195,20,.42);

  box-shadow:
    0 0 0 4px
    rgba(242,195,20,.055);
}

.chat-list{
  min-height:0;
  flex:1;

  overflow-y:auto;

  padding:8px;
}

.chat-item{
  position:relative;

  width:100%;

  min-height:66px;

  padding:10px;

  border:0;
  border-radius:16px;

  color:#fff;

  background:transparent;

  display:flex;
  align-items:center;

  gap:11px;

  text-align:left;

  cursor:pointer;

  transition:.15s ease;
}

.chat-item:hover{
  background:
    rgba(255,255,255,.04);
}

.chat-item.active{
  background:
    linear-gradient(
      135deg,
      rgba(242,195,20,.12),
      rgba(242,195,20,.035)
    );

  box-shadow:
    inset 0 0 0 1px
    rgba(242,195,20,.10);
}

.chat-item.active::before{
  content:"";

  position:absolute;

  left:0;
  top:17px;
  bottom:17px;

  width:3px;

  border-radius:
    0 4px 4px 0;

  background:var(--yellow);
}

.chat-item
.avatar-status-wrap{
  width:46px;
  height:46px;

  flex:0 0 46px;
}

.chat-item-content{
  min-width:0;
  flex:1;
}

.chat-item-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;
}

.chat-name{
  min-width:0;

  font-size:13px;
  font-weight:780;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-time{
  flex:0 0 auto;

  color:#626262;

  font-size:9px;
  font-weight:600;
}

.chat-preview{
  margin-top:4px;

  color:#757575;

  font-size:11px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}


/* RIGHT CHAT */

.chat-panel{
  min-height:0;
  overflow:hidden;

  display:flex;
  flex-direction:column;

  border-radius:22px;

  border:
    1px solid
    rgba(255,255,255,.08);

  background:
    radial-gradient(
      700px 330px at 50% -130px,
      rgba(242,195,20,.055),
      transparent 70%
    ),
    #0e0e0e;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.22);
}

.active-chat-head{
  height:70px;

  flex:0 0 70px;

  padding:0 17px;

  border-bottom:
    1px solid
    rgba(255,255,255,.07);

  background:
    rgba(15,15,15,.82);

  backdrop-filter:blur(16px);

  display:flex;
  align-items:center;

  gap:11px;
}

.active-chat-user{
  min-width:0;
  flex:1;

  cursor:pointer;
}

.active-chat-name{
  font-size:13px;
  font-weight:820;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.active-chat-id{
  margin-top:3px;

  color:#707070;

  font-size:10px;

  display:flex;
  align-items:center;

  gap:7px;
}

.active-chat-separator{
  color:#4b4b4b;
}


/* =====================================================
   NEW BEAUTIFUL MESSAGE BUBBLES
===================================================== */

.messages{
  min-height:0;
  flex:1;

  overflow-y:auto;

  padding:
    24px 23px 15px;

  display:flex;
  flex-direction:column;

  gap:7px;

  scroll-behavior:smooth;

  background:
    radial-gradient(
      700px 350px
      at 50% 0,
      rgba(255,255,255,.018),
      transparent 70%
    );
}

.message-row{
  width:100%;

  display:flex;

  animation:
    newBubbleIn
    .22s
    cubic-bezier(.2,.8,.2,1)
    both;
}

.message-row.mine{
  justify-content:flex-end;
}

@keyframes newBubbleIn{

  from{
    opacity:0;

    transform:
      translateY(7px)
      scale(.985);
  }

  to{
    opacity:1;
    transform:none;
  }

}


/* ЧУЖА БУЛЬБАШКА */

.message{
  position:relative;

  max-width:
    min(570px,75%);

  padding:
    9px 12px 7px;

  border-radius:
    18px 18px 18px 6px;

  color:#ededed;

  background:
    linear-gradient(
      145deg,

      )}"
    >

      <span
        class="presence-mini-dot"
      ></span>

      <span
        class="presence-label-value"
      >
        ${
          online
            ?"В мережі"
            :"Не в мережі"
        }
      </span>

    </span>
  `;

}

function refreshOnlineIndicators(){

  qsa(
    "[data-presence-dot]"
  )
  .forEach(dot=>{

    const id =
      dot.dataset.presenceDot;

    const online =
      isOnline(id);

    dot.classList.toggle(
      "online",
      online
    );

    dot.classList.toggle(
      "offline",
      !online
    );

  });


  qsa(
    "[data-presence-text]"
  )
  .forEach(element=>{

    const id =
      element.dataset.presenceText;

    const online =
      isOnline(id);

    element.classList.toggle(
      "online",
      online
    );

    const text =
      element.querySelector(
        ".presence-label-value"
      );

    if(text){

      text.textContent =
        online
          ?"В мережі"
          :"Не в мережі";

    }

  });

}

async function stopPresence(){

  if(
    state.presenceChannel
  ){

    try{
      await state
        .presenceChannel
        .untrack();
    }catch{}


    try{
      await sb.removeChannel(
        state.presenceChannel
      );
    }catch{}


    state.presenceChannel =
      null;

  }

  state.onlineUsers =
    new Set();

}

async function startPresence(){

  if(!state.user){
    return;
  }

  await stopPresence();


  const channel =
    sb.channel(
      "liptongram-online",
      {
        config:{
          presence:{
            key:
              state.user.id
          }
        }
      }
    );


  state.presenceChannel =
    channel;


  function sync(){

    const presenceState =
      channel.presenceState();

    state.onlineUsers =
      new Set(
        Object.keys(
          presenceState
        )
      );

    refreshOnlineIndicators();

  }


  channel.on(
    "presence",
    {
      event:"sync"
    },
    sync
  );

  channel.on(
    "presence",
    {
      event:"join"
    },
    sync
  );

  channel.on(
    "presence",
    {
      event:"leave"
    },
    sync
  );


  channel.subscribe(
    async status=>{

      if(
        status==="SUBSCRIBED"
      ){

        await channel.track({

          user_id:
            state.user.id,

          username:
            state.profile
              ?.username
            ||
            state.profile
              ?.login
            ||
            "user",

          online_at:
            new Date()
              .toISOString()

        });

      }

    }
  );

}

  } =

  state.session =
    session;

  state.user =
    session?.user||null;


  if(state.user){

    startPresence();

  }


  render();


  sb.auth.onAuthStateChange(

    async(
      event,
      session
    )=>{

      state.session =
        session;

        session?.user||null;

        startPresence();

/* LOAD USER */

async function loadMe(){

  if(!state.user){
    return;
  }


  try{

    try{

      await sb.rpc(
        "ensure_my_profile"
      );

    }catch(error){

      console.warn(
        "ensure_my_profile",
        error
      );

    }


    const {
      data:profile,
      error:profileError
    } =
      await sb
        .from("profiles")
        .select("*")
        .eq(
          "id",
          state.user.id
        )
        .maybeSingle();


    if(profileError){

      console.error(
        profileError
      );

    }


    if(profile){

      state.profile =
        profile;

    }else{

      const login =
        state.user
          .user_metadata
          ?.login

        ||

        state.user
          .email
          ?.split("@")[0]

        ||

        "user";


      state.profile = {

        id:
          state.user.id,

        login,

        username:
          login,

        public_id:
          "------",

        avatar_url:
          null,

        banner_url:
          null,

        role:
          "user",

        created_at:
          state.user.created_at

      };

    }


    const {
      data:wallet
    } =
      await sb
        .from("wallets")
        .select("*")
        .eq(
          "user_id",
          state.user.id
        )
        .maybeSingle();


    state.wallet =
      wallet
      ||
      {
        balance:0
      };


  }catch(error){

    console.error(
      "LOAD PROFILE ERROR",
      error
    );

  }

}


/* AUTH */

async function signIn(){

  const login =
    qs("#authLogin")
      .value
      .trim();

  const password =
    qs("#authPassword")
      .value;


  if(
    !validLogin(login)
  ){

    toast(
      "Неправильний логін",
      "error"
    );

    return;

  }


  const button =
    qs("#authButton");


  setLoading(
    button,
    true
  );


  const {error} =
    await sb.auth
      .signInWithPassword({

        email:
          loginEmail(login),

        password

      });


  setLoading(
    button,
    false
  );


  if(error){

    toast(
      "Невірний логін або пароль",
      "error"
    );

  }

}

async function signUp(){

  const login =
    qs("#authLogin")
      .value
      .trim();

  const password =
    qs("#authPassword")
      .value;


  if(
    !validLogin(login)
  ){

    toast(
      "Логін: 3–24 символи, букви, цифри або _",
      "error"
    );

    return;

  }


  if(
    !password
    ||
    password.length<8
  ){

    toast(
      "Пароль мінімум 8 символів",
      "error"
    );

    return;

  }


  const button =
    qs("#authButton");


  setLoading(
    button,
    true
  );


  const {
    data,
    error
  } =
    await sb.auth.signUp({

      email:
        loginEmail(login),

      password,

      options:{
        data:{
          login
        }
      }

    });


  setLoading(
    button,
    false
  );


  if(error){

    toast(
      error.message,
      "error"
    );

    return;

  }


  if(!data.session){

    toast(
      "У Supabase потрібно вимкнути Confirm Email",
      "error"
    );

    return;

  }


  toast(
    "Акаунт створено",
    "success"
  );

}

async function logout(){

  await stopTyping();

  await stopChatChannel();

  await stopPresence();

  await sb.auth.signOut();

}

async function uploadProfileImage(
  file,
  prefix
){

  if(!file){
    return null;
  }


  if(
    !file.type
      .startsWith(
        "image/"
      )
  ){

    throw new Error(
      "Оберіть зображення"
    );

  }


  if(
    file.size>
    8*1024*1024
  ){

    throw new Error(
      "Зображення занадто велике"
    );

  }


  const extension =
    file.name
      .split(".")
      .pop()
      ?.toLowerCase()
    ||
    "jpg";


  const path =
    `${state.user.id}/${prefix}-${Date.now()}.${extension}`;


  const {error} =
    await sb.storage
      .from("profiles")
      .upload(
        path,
        file,
        {
          upsert:true
        }
      );


  if(error){
    throw error;
  }


  const {data} =
    sb.storage
      .from("profiles")
      .getPublicUrl(path);


  return data.publicUrl;

}

  const button =

  const username =
    qs("#editUsername")
      .value
      .trim();


  const publicId =
    qs("#editPublicId")
      .value
      .trim();


  if(
    !/^[A-Za-z0-9_]{3,24}$/
      .test(username)
  ){

    toast(
      "Username неправильний",
      "error"
    );

    return;

  }


  if(
    !/^\d{6}$/
      .test(publicId)
  ){

    toast(
      "ID повинен містити 6 цифр",
      "error"
    );

    return;

  }


  setLoading(
    button,
    true
  );


  try{

    let avatarUrl =
      state.profile?.avatar_url||null;

    let bannerUrl =
      state.profile?.banner_url||null;


    const avatarFile =
      qs("#avatarFile")
        ?.files?.[0];


    const bannerFile =
      qs("#bannerFile")
        ?.files?.[0];


    if(avatarFile){

      avatarUrl =
        await uploadProfileImage(
          avatarFile,
          "avatar"
        );

    }


    if(bannerFile){

      bannerUrl =
        await uploadProfileImage(
          bannerFile,
          "banner"
        );

    }


    const {
      data,
      error
    } =
      await sb
        .from("profiles")
        .update({

          username,

          public_id:
            publicId,

          avatar_url:
            avatarUrl,

          banner_url:
            bannerUrl,

          updated_at:
            new Date()
              .toISOString()

        })
        .eq(
          "id",
          state.user.id
        )
        .select()
        .single();


    if(error){
      throw error;
    }


    state.profile =
      data;


    closeModal();

    render();


    toast(
      "Профіль збережено",
      "success"
    );


  }catch(error){

    toast(
      error.message
      ||
      "Не вдалося зберегти профіль",
      "error"
    );


  }finally{

    setLoading(
      button,
      false
    );

  }

}

async function runUserSearch(value){

  const root =
    qs("#userResults");


  if(!root){
    return;
  }


  const query =
    value.trim();


  if(
    query.length<2
  ){

    root.innerHTML="";
    return;

  }


  let request =
    sb
      .from("profiles")
      .select(
        "id,login,username,public_id,avatar_url,banner_url,created_at"
      )
      .neq(
        "id",
        state.user.id
      )
      .limit(15);


  if(
    /^\d{6}$/
      .test(query)
  ){

    request =
      request.eq(
        "public_id",
        query
      );

  }else{

    request =
      request.ilike(
        "username",
        `%${query}%`
      );

  }


  const {
    data
  } =
    await request;


  root.innerHTML =
    (data||[])
      .map(user=>`

        <div class="chat-item">

async function createSignedImageUrl(
  path
){

  if(!path){
    return null;
  }


  const {
    data,
    error
  } =
    await sb.storage
      .from("chat-media")
      .createSignedUrl(
        path,
        3600
      );


  if(error){

    return null;

  }


  return data?.signedUrl||null;

}

async function hydrateMessageMedia(
  message
){

  if(
    !message?.image_path
  ){

    return message;

  }


  if(
    message._imageUrl
  ){

    return message;

  }


  const url =
    await createSignedImageUrl(
      message.image_path
    );


  return {
    ...message,
    _imageUrl:url
  };

}

async function uploadChatImage(
  file
){

  const ext =
    file.name
      .split(".")
      .pop()
      ?.toLowerCase()
    ||
    "jpg";


  const path =
    `${
      state.activeConversation.id
    }/${
      state.user.id
    }/${
      crypto.randomUUID()
    }.${ext}`;


  const {error} =
    await sb.storage
      .from("chat-media")
      .upload(
        path,
        file,
        {
          upsert:false,
          contentType:file.type
        }
      );


  if(error){
    throw error;
  }


  return path;

}

async function loadChats(){

  const uid =
    state.user.id;


  const {
    data
  } =
    await sb
      .from(
        "direct_conversations"
      )
      .select("*")
      .or(
        `user1_id.eq.${uid},user2_id.eq.${uid}`
      )
      .order(
        "updated_at",
        {
          ascending:false
        }
      );


  const chats =
    data||[];


  const ids =
    chats.map(chat=>

      chat.user1_id===uid
        ?chat.user2_id
        :chat.user1_id

    );


  let users=[];


  if(ids.length){

    const {
      data:profiles
    } =
      await sb
        .from("profiles")
        .select("*")
        .in(
          "id",
          ids
        );


    users =
      profiles||[];

  }


  const map =
    Object.fromEntries(
      users.map(
        user=>[
          user.id,
          user
        ]
      )
    );


  state.conversations =
    chats.map(chat=>{

      const otherId =
        chat.user1_id===uid
          ?chat.user2_id
          :chat.user1_id;


      return {
        ...chat,
        other:
          map[otherId]
      };

    });


  renderChatList();

}

              chat.other?.public_id
            )
            .toLowerCase()

          onclick="

            )

async function stopChatChannel(){

  state.chatChannelReady=false;


  if(
    state.messageChannel
  ){

    try{

      await sb.removeChannel(
        state.messageChannel
      );

    }catch{}


    state.messageChannel=null;

  }

}

async function setupChatChannel(
  conversationId
){

  await stopChatChannel();


  const channel =
    sb.channel(
      "chat:"+conversationId,
      {
        config:{
          broadcast:{
            self:false
          }
        }
      }
    );


  state.messageChannel =
    channel;


  channel.on(

    "postgres_changes",

    {
      event:"INSERT",
      schema:"public",
      table:"messages",
      filter:
        `conversation_id=eq.${conversationId}`
    },

    async payload=>{

      const incoming =
        await hydrateMessageMedia(
          payload.new
        );


      const exists =
        state.messages
          .some(
            m=>
              m.id===incoming.id
          );


      if(!exists){

        state.messages.push(
          incoming
        );

      }


      refreshMessages(
        true
      );

    }

  );


  channel.on(

    "broadcast",

    {
      event:"typing"
    },

    payload=>{

      const data =
        payload.payload||{};


      if(
        data.user_id===
        state.user.id
      ){
        return;
      }


      showTypingIndicator(
        data.user_id,
        data.typing
      );

    }

  );


  channel.subscribe(
    status=>{

      state.chatChannelReady =
        status==="SUBSCRIBED";

    }
  );

}

async function openChat(
  conversationId,
  userId
){

  let user =
    state.conversations
      .find(
        c=>c.id===
        conversationId
      )
      ?.other;


  if(!user){

    const {data} =
      await sb
        .from("profiles")
        .select("*")
        .eq(
          "id",
          userId
        )
        .single();


    user=data;

  }


  state.activeConversation={
    id:conversationId
  };


  state.activeChatUser=user;

  state.mobileChatOpen=true;


  const {
    data
  } =
    await sb
      .from("messages")
      .select("*")
      .eq(
        "conversation_id",
        conversationId
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  state.messages =
    await Promise.all(
      (data||[])
        .map(
          hydrateMessageMedia
        )
    );


  await setupChatChannel(
    conversationId
  );


  renderChats();


  setTimeout(
    scrollMessages,
    50
  );

}

function closeMobileChat(){

  state.mobileChatOpen=false;

  renderChats();

}

  scroll=false
){

  if(!root){

  }


  root.innerHTML =

  if(scroll){

  }

}

function messageKey(event){

  if(
    event.key==="Enter"
    &&
    !event.shiftKey
    &&
    window.innerWidth>760
  ){

    event.preventDefault();

    sendMessage();

  }

}

async function sendMessage(){

  const input =
    qs("#messageInput");


  const content =
    input?.value.trim()
    ||
    "";


  const image =
    state.selectedImage;


  if(
    !content
    &&
    !image
  ){
    return;
  }


  await stopTyping();


  let imagePath=null;


  if(image){

    imagePath =
      await uploadChatImage(
        image
      );

  }


  const {
    data,
    error
  } =
    await sb
      .from("messages")
      .insert({

        conversation_id:
          state.activeConversation.id,

        sender_id:
          state.user.id,

        content:
          content||null,

        image_path:
          imagePath

      })
      .select()
      .single();


  if(error){

    toast(
      error.message,
      "error"
    );

    return;

  }


  const finalMessage =
    await hydrateMessageMedia(
      data
    );


  state.messages.push(
    finalMessage
  );


  input.value="";


  clearSelectedImage();


  refreshMessages(
    true
  );

}

    </div>

async function loadListings(){

  const {
    data
  } =
    await sb
      .from(
        "marketplace_listings"
      )
      .select("*")
      .eq(
        "status",
        "active"
      );


  state.listings =
    data||[];


  renderListings();

}

function renderListings(){

  const root =
    qs("#shopGrid");


  if(!root){
    return;
  }


  root.innerHTML =
    state.listings
      .map(item=>`

        <section class="card listing">

          <div class="listing-type">
            ${esc(
              item.asset_type
            )}
          </div>

          <div class="listing-value">
            ${esc(
              item.asset_value
            )}
          </div>

          <div class="listing-space">
          </div>

          <div class="listing-bottom">

            <div class="listing-price">
              ${money(
                item.price
              )}
            </div>

          </div>

        </section>

      `)
      .join("");

}
