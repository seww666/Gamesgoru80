<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>
<meta name="theme-color" content="#f5c518">

<title>LiptonGram</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #080808;
  --panel: #111111;
  --panel2: #171717;
  --panel3: #202020;

  --text: #ffffff;
  --muted: #8a8a8a;

  --yellow: #f5c518;
  --yellow2: #ffda43;

  --danger: #ff5656;
  --success: #42d685;

  --border: rgba(255,255,255,.08);

  --radius: 18px;

  --shadow:
    0 20px 60px rgba(0,0,0,.35);
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
}

body {
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: var(--text);

  background:
    radial-gradient(
      900px 450px at 50% -200px,
      rgba(245,197,24,.15),
      transparent 70%
    ),
    var(--bg);

  -webkit-font-smoothing: antialiased;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  color: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

input::placeholder,
textarea::placeholder {
  color: #666;
}

.hidden {
  display: none !important;
}

.icon {
  width: 20px;
  height: 20px;
}

.icon-sm {
  width: 17px;
  height: 17px;
}

.spin {
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes fade {
  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes modal {
  from {
    opacity: 0;
    transform:
      translateY(15px)
      scale(.98);
  }

  to {
    opacity: 1;
    transform:
      translateY(0)
      scale(1);
  }
}

.page-animation {
  animation: fade .22s ease both;
}


/* =========================================
   BUTTONS
========================================= */

.btn {
  min-height: 44px;

  padding: 0 17px;

  border: 0;
  outline: 0;

  border-radius: 13px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  gap: 8px;

  cursor: pointer;

  font-weight: 750;

  transition:
    transform .15s ease,
    background .15s ease,
    opacity .15s ease;
}

.btn:active {
  transform: scale(.97);
}

.btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.btn-primary {
  background:
    linear-gradient(
      135deg,
      var(--yellow2),
      var(--yellow)
    );

  color: #101010;
}

.btn-secondary {
  background: #1b1b1b;

  border:
    1px solid var(--border);
}

.btn-danger {
  background:
    rgba(255,86,86,.1);

  border:
    1px solid
    rgba(255,86,86,.18);

  color: #ff7676;
}

.icon-btn {
  width: 43px;
  height: 43px;

  flex: 0 0 43px;

  border:
    1px solid var(--border);

  border-radius: 13px;

  background: #181818;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  transition:
    transform .15s ease,
    background .15s ease;
}

.icon-btn:hover {
  background: #222;
}

.icon-btn:active {
  transform: scale(.95);
}


/* =========================================
   INPUTS
========================================= */

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.field label {
  color: #b2b2b2;

  font-size: 12px;
  font-weight: 700;
}

.input {
  width: 100%;
  height: 47px;

  border:
    1px solid var(--border);

  outline: none;

  border-radius: 13px;

  padding: 0 14px;

  background: #111;

  color: white;

  transition:
    border .15s ease,
    box-shadow .15s ease;
}

textarea.input {
  min-height: 100px;
  height: auto;

  padding-top: 12px;
  padding-bottom: 12px;
}

.input:focus {
  border-color:
    rgba(245,197,24,.55);

  box-shadow:
    0 0 0 4px
    rgba(245,197,24,.07);
}


/* =========================================
   AUTH
========================================= */

.auth-page {
  min-height: 100vh;
  min-height: 100dvh;

  padding: 20px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.auth-card {
  width: min(430px,100%);

  padding: 28px;

  border:
    1px solid var(--border);

  border-radius: 27px;

  background:
    rgba(16,16,16,.88);

  backdrop-filter: blur(20px);

  box-shadow: var(--shadow);
}

.auth-logo,
.brand-logo {
  overflow: hidden;

  background:
    linear-gradient(
      135deg,
      var(--yellow2),
      var(--yellow)
    );

  color: #111;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: 900;
}

.auth-logo {
  width: 70px;
  height: 70px;

  margin:
    0 auto 18px;

  border-radius: 21px;

  font-size: 28px;
}

.auth-logo img,
.brand-logo img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.auth-title {
  margin: 0;

  text-align: center;

  font-size: 30px;
  font-weight: 850;
}

.auth-subtitle {
  margin:
    7px 0 24px;

  text-align: center;

  color: var(--muted);

  line-height: 1.5;

  font-size: 13px;
}

.auth-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;

  padding: 4px;

  border:
    1px solid var(--border);

  border-radius: 14px;

  background: #0d0d0d;

  margin-bottom: 18px;
}

.auth-tab {
  height: 39px;

  border: 0;

  border-radius: 10px;

  background: transparent;

  color: #737373;

  cursor: pointer;

  font-weight: 750;
}

.auth-tab.active {
  background: #202020;
  color: white;
}

.auth-form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}


/* =========================================
   APP
========================================= */

.app {
  min-height: 100vh;
  min-height: 100dvh;

  display: grid;
  grid-template-columns:
    265px minmax(0,1fr);
}

.sidebar {
  position: sticky;
  top: 0;

  height: 100vh;
  height: 100dvh;

  border-right:
    1px solid var(--border);

  padding: 18px 13px;

  display: flex;
  flex-direction: column;

  background:
    rgba(9,9,9,.86);

  backdrop-filter: blur(20px);

  z-index: 30;
}

.brand {
  height: 56px;

  display: flex;
  align-items: center;

  gap: 11px;

  padding: 0 8px;

  margin-bottom: 14px;
}

.brand-logo {
  width: 40px;
  height: 40px;

  flex: 0 0 40px;

  border-radius: 12px;

  font-size: 19px;
}

.brand-name {
  font-size: 18px;
  font-weight: 850;
}

.side-nav {
  display: flex;
  flex-direction: column;

  gap: 5px;
}

.nav-btn {
  width: 100%;
  height: 48px;

  border: 0;

  border-radius: 13px;

  padding: 0 14px;

  background: transparent;

  color: #858585;

  display: flex;
  align-items: center;

  gap: 12px;

  cursor: pointer;

  font-weight: 750;

  transition:
    background .15s ease,
    color .15s ease;
}

.nav-btn:hover {
  background: #151515;
  color: white;
}

.nav-btn.active {
  background:
    linear-gradient(
      135deg,
      var(--yellow2),
      var(--yellow)
    );

  color: #111;
}

.sidebar-spacer {
  flex: 1;
}

.side-user {
  padding: 9px;

  border:
    1px solid var(--border);

  border-radius: 16px;

  background: #111;

  display: flex;
  align-items: center;

  gap: 9px;
}

.side-user-info {
  min-width: 0;
  flex: 1;
}

.side-user-name {
  font-size: 12px;
  font-weight: 800;

  overflow: hidden;
  text-overflow: ellipsis;
}

.side-user-id {
  color: #777;
  font-size: 10px;

  margin-top: 2px;
}

.main {
  min-width: 0;
}

.page {
  width: min(1180px,100%);

  margin: auto;

  padding: 25px;
}

.page-head {
  min-height: 55px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 14px;

  margin-bottom: 18px;
}

.page-title {
  margin: 0;

  font-size: 27px;
  font-weight: 850;
}

.page-desc {
  color: var(--muted);

  font-size: 12px;

  margin-top: 5px;
}


/* =========================================
   GENERIC
========================================= */

.card {
  border:
    1px solid var(--border);

  border-radius: var(--radius);

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,.008)
    );

  box-shadow:
    0 14px 40px
    rgba(0,0,0,.2);
}

.avatar {
  width: 43px;
  height: 43px;

  flex: 0 0 43px;

  border-radius: 50%;

  overflow: hidden;

  border:
    1px solid
    rgba(255,255,255,.08);

  background: #222;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: 800;
}

.avatar.large {
  width: 105px;
  height: 105px;

  flex: 0 0 105px;

  border:
    4px solid #101010;

  font-size: 28px;
}

.avatar img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.empty {
  min-height: 240px;

  padding: 30px;

  display: flex;
  align-items: center;
  justify-content: center;

  flex-direction: column;

  text-align: center;

  color: #777;
}

.empty strong {
  color: white;

  font-size: 15px;
}

.empty p {
  max-width: 420px;

  margin:
    7px 0 0;

  line-height: 1.5;

  font-size: 12px;
}

.empty-icon {
  width: 53px;
  height: 53px;

  margin-bottom: 14px;

  border:
    1px solid var(--border);

  border-radius: 16px;

  background: #181818;

  display: flex;
  align-items: center;
  justify-content: center;
}


/* =========================================
   BALANCE
========================================= */

.balance {
  height: 42px;

  padding:
    4px 5px
    4px 13px;

  border:
    1px solid var(--border);

  border-radius: 13px;

  background: #151515;

  display: inline-flex;
  align-items: center;

  gap: 9px;
}

.balance-value {
  font-size: 13px;
  font-weight: 850;
}

.balance-plus {
  width: 31px;
  height: 31px;

  border: 0;

  border-radius: 9px;

  background: var(--yellow);

  color: #111;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}


/* =========================================
   PROFILE
========================================= */

.profile-card {
  overflow: hidden;
}

.profile-banner {
  height: 235px;

  background:
    linear-gradient(
      120deg,
      #2a240e,
      #544000,
      #171717
    );

  background-position: center;
  background-size: cover;
}

.profile-info {
  position: relative;

  display: flex;
  align-items: flex-end;

  gap: 18px;

  padding:
    0 23px 23px;
}

.profile-avatar {
  margin-top: -49px;
}

.profile-main {
  min-width: 0;

  flex: 1;

  padding-top: 16px;
}

.profile-name {
  margin: 0;

  font-size: 24px;
  font-weight: 850;

  word-break: break-word;
}

.profile-login {
  color: var(--muted);

  font-size: 12px;

  margin-top: 4px;
}

.profile-tags {
  margin-top: 10px;

  display: flex;
  flex-wrap: wrap;

  gap: 6px;
}

.tag {
  min-height: 27px;

  padding: 0 8px;

  border:
    1px solid var(--border);

  border-radius: 8px;

  background: #171717;

  color: #aaa;

  display: inline-flex;
  align-items: center;

  gap: 5px;

  font-size: 10px;
}

.profile-actions {
  padding-top: 15px;
}

.profile-stats {
  display: grid;
  grid-template-columns:
    repeat(3,1fr);

  gap: 13px;

  margin-top: 14px;
}

.stat {
  padding: 19px;
}

.stat-label {
  color: var(--muted);

  font-size: 11px;
}

.stat-value {
  margin-top: 7px;

  font-size: 21px;
  font-weight: 850;

  word-break: break-word;
}


/* =========================================
   CHATS
========================================= */

.chat-layout {
  height:
    calc(100dvh - 50px);

  padding: 25px;

  display: grid;

  grid-template-columns:
    335px minmax(0,1fr);

  gap: 14px;
}

.chat-list-panel,
.chat-panel {
  min-height: 0;

  overflow: hidden;
}

.chat-list-panel {
  display: flex;
  flex-direction: column;
}

.chat-list-head {
  padding: 17px;

  border-bottom:
    1px solid var(--border);
}

.chat-head-title {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 13px;
}

.chat-head-title h2 {
  margin: 0;

  font-size: 21px;
}

.search {
  position: relative;
}

.search > i {
  position: absolute;

  left: 12px;
  top: 50%;

  transform:
    translateY(-50%);

  color: #666;

  pointer-events: none;
}

.search .input {
  padding-left: 39px;
  height: 42px;
}

.chat-list {
  min-height: 0;
  flex: 1;

  overflow: auto;

  padding: 6px;
}

.chat-item {
  width: 100%;

  border: 0;

  padding: 9px;

  border-radius: 14px;

  background: transparent;

  color: white;

  display: flex;
  align-items: center;

  gap: 10px;

  cursor: pointer;

  text-align: left;
}

.chat-item:hover,
.chat-item.active {
  background: #1a1a1a;
}

.chat-item-content {
  min-width: 0;
  flex: 1;
}

.chat-item-row {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 7px;
}

.chat-name {
  font-size: 12px;
  font-weight: 800;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chat-time {
  color: #666;

  font-size: 9px;
}

.chat-preview {
  margin-top: 3px;

  color: #777;

  font-size: 11px;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chat-panel {
  display: flex;
  flex-direction: column;
}

.active-chat-head {
  height: 67px;

  flex: 0 0 67px;

  padding: 0 17px;

  border-bottom:
    1px solid var(--border);

  display: flex;
  align-items: center;

  gap: 10px;
}

.active-chat-name {
  font-size: 13px;
  font-weight: 800;
}

.active-chat-id {
  color: #777;

  font-size: 10px;

  margin-top: 2px;
}

.messages {
  min-height: 0;

  flex: 1;

  overflow-y: auto;

  padding: 20px;

  display: flex;
  flex-direction: column;

  gap: 7px;

  scroll-behavior: smooth;
}

.message-row {
  display: flex;
}

.message-row.mine {
  justify-content: flex-end;
}

.message {
  max-width: 78%;

  padding:
    9px 12px 7px;

  border-radius: 16px;

  background: #202020;

  font-size: 13px;

  line-height: 1.45;

  word-break: break-word;
}

.message-row.mine .message {
  background:
    linear-gradient(
      135deg,
      #f5c518,
      #e3ae00
    );

  color: #111;

  border-bottom-right-radius: 5px;
}

.message-row:not(.mine)
.message {
  border-bottom-left-radius: 5px;
}

.message-time {
  margin-top: 3px;

  text-align: right;

  opacity: .55;

  font-size: 8px;
}

.composer {
  padding: 11px 13px;

  border-top:
    1px solid var(--border);

  display: flex;
  align-items: flex-end;

  gap: 8px;

  background:
    rgba(13,13,13,.95);
}

.composer textarea {
  min-height: 43px;
  max-height: 130px;

  flex: 1;

  resize: none;

  border:
    1px solid var(--border);

  outline: 0;

  border-radius: 14px;

  padding: 10px 13px;

  background: #171717;

  color: white;
}

.send {
  width: 43px;
  height: 43px;

  flex: 0 0 43px;

  border: 0;

  border-radius: 13px;

  background: var(--yellow);

  color: #111;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
}


/* =========================================
   SHOP
========================================= */

.shop-grid {
  display: grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap: 13px;
}

.listing {
  min-height: 200px;

  padding: 17px;

  display: flex;
  flex-direction: column;
}

.listing-type {
  width: fit-content;

  padding: 5px 7px;

  border-radius: 7px;

  background:
    rgba(245,197,24,.08);

  color: var(--yellow);

  font-size: 9px;
  font-weight: 850;

  text-transform: uppercase;
}

.listing-value {
  margin-top: 16px;

  font-size: 20px;
  font-weight: 850;

  word-break: break-word;
}

.listing-seller {
  margin-top: 4px;

  color: #777;

  font-size: 11px;
}

.listing-spacer {
  flex: 1;
}

.listing-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 9px;
}

.listing-price {
  font-size: 17px;
  font-weight: 850;
}


/* =========================================
   ADMIN
========================================= */

.admin-tabs {
  display: flex;
  flex-wrap: wrap;

  gap: 6px;

  margin-bottom: 14px;
}

.admin-tab {
  height: 38px;

  padding: 0 12px;

  border:
    1px solid var(--border);

  border-radius: 10px;

  background: #151515;

  color: #777;

  cursor: pointer;

  font-size: 11px;
  font-weight: 750;
}

.admin-tab.active {
  background: var(--yellow);
  color: #111;

  border-color: var(--yellow);
}

.admin-stats {
  display: grid;
  grid-template-columns:
    repeat(4,1fr);

  gap: 12px;

  margin-bottom: 14px;
}

.admin-stat {
  padding: 17px;
}

.admin-number {
  margin-top: 7px;

  font-size: 23px;
  font-weight: 850;
}

.table-wrap {
  overflow: auto;
}

table {
  width: 100%;

  border-collapse: collapse;

  font-size: 11px;
}

th,
td {
  padding: 12px 14px;

  text-align: left;

  border-bottom:
    1px solid
    rgba(255,255,255,.05);

  white-space: nowrap;
}

th {
  color: #777;
}

.role {
  padding: 4px 7px;

  border-radius: 7px;

  background: #222;

  font-size: 9px;
}

.role.admin {
  color: var(--yellow);

  background:
    rgba(245,197,24,.1);
}


/* =========================================
   PAYMENT
========================================= */

.payment-card {
  height: 185px;

  padding: 20px;

  margin-bottom: 17px;

  border-radius: 21px;

  border:
    1px solid
    rgba(245,197,24,.16);

  background:
    radial-gradient(
      250px 120px
      at 90% 0,
      rgba(255,220,60,.28),
      transparent 65%
    ),
    linear-gradient(
      135deg,
      #2b260e,
      #111
    );

  display: flex;
  flex-direction: column;
}

.payment-chip {
  width: 38px;
  height: 28px;

  border-radius: 7px;

  background:
    linear-gradient(
      135deg,
      #dabe6e,
      #8c7024
    );

  margin-bottom: 28px;
}

.payment-number {
  font-size: 16px;

  letter-spacing: 2px;
}

.payment-bottom {
  margin-top: auto;

  display: flex;
  justify-content: space-between;

  color: #aaa;

  font-size: 10px;
}

.payment-error {
  margin-bottom: 12px;

  padding: 11px;

  border-radius: 11px;

  color: #ff7777;

  background:
    rgba(255,80,80,.08);

  border:
    1px solid
    rgba(255,80,80,.15);

  font-size: 11px;
}


/* =========================================
   MODAL
========================================= */

.modal-bg {
  position: fixed;
  inset: 0;

  z-index: 500;

  padding: 17px;

  background:
    rgba(0,0,0,.74);

  backdrop-filter: blur(8px);

  display: flex;
  align-items: center;
  justify-content: center;
}

.modal {
  width: min(480px,100%);

  max-height:
    calc(100dvh - 34px);

  overflow: auto;

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius: 23px;

  background: #111;

  box-shadow: var(--shadow);

  animation: modal .18s ease both;
}

.modal-head {
  padding:
    18px 18px 8px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;
}

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://latgnxbzymbyngslzfko.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9KKwvgywcvchh-s_FMSvbw_hx2LMgX-";

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
========================================================= */

const state = {

  session: null,

  user: null,

  profile: null,

  wallet: {
    balance: 0
  },

  logoUrl: null,

  page: "chats",

  authMode: "login",

  conversations: [],

  activeConversation: null,

  activeChatUser: null,

  messages: [],

  messageChannel: null,

  listings: [],

  adminTab: "dashboard",

  mobileChatOpen: false

};


/* =========================================================
   HELPERS
========================================================= */

function qs(selector) {
  return document.querySelector(
    selector
  );
}


function qsa(selector) {
  return [
    ...document.querySelectorAll(
      selector
    )
  ];
}


function esc(value = "") {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );
}


function icons() {

  requestAnimationFrame(() => {

    if (window.lucide) {

      lucide.createIcons();

    }

  });

}


function money(value) {

  return new Intl.NumberFormat(
    "en-US",
    {
      style: "currency",
      currency: "USD"
    }
  ).format(
    Number(value || 0)
  );

}


function dateFormat(value) {

  if (!value) return "—";

  try {

    return new Intl.DateTimeFormat(
      "uk-UA",
      {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }
    ).format(
      new Date(value)
    );

  } catch {

    return "—";

  }

}


function timeFormat(value) {

  if (!value) return "";

  try {

    return new Intl.DateTimeFormat(
      "uk-UA",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    ).format(
      new Date(value)
    );

  } catch {

    return "";

  }

}


function loginEmail(login) {

  return (
    login
      .trim()
      .toLowerCase()
    +
    "@liptongram.app"
  );

}


function validLogin(login) {

  return /^[A-Za-z0-9_]{3,24}$/
    .test(login);

}


function initials(profile) {

  return (
    profile?.username ||
    profile?.login ||
    "LG"
  )
    .slice(0,2)
    .toUpperCase();

}


function avatar(
  profile,
  large = false
) {

  if (profile?.avatar_url) {

    return `
      <div
        class="
          avatar
          ${large ? "large" : ""}
        "
      >
        <img
          src="${esc(
            profile.avatar_url
          )}"
          alt=""
        >
      </div>
    `;

  }

  return `
    <div
      class="
        avatar
        ${large ? "large" : ""}
      "
    >
      ${esc(
        initials(profile)
      )}
    </div>
  `;

}


function logoMarkup(
  className = "brand-logo"
) {

  if (state.logoUrl) {

    return `
      <div class="${className}">
        <img
          src="${esc(
            state.logoUrl
          )}"
          alt=""
        >
      </div>
    `;

  }

  return `
    <div class="${className}">
      L
    </div>
  `;

}


function toast(
  text,
  type = ""
) {

  const root =
    qs("#toasts");

  const el =
    document.createElement("div");

  el.className =
    "toast " + type;

  const icon =
    type === "error"
      ? "circle-alert"
      : type === "success"
      ? "circle-check"
      : "info";

  el.innerHTML = `
    <i
      data-lucide="${icon}"
      class="icon-sm"
    ></i>

    <span>
      ${esc(text)}
    </span>
  `;

  root.appendChild(el);

  icons();

  setTimeout(() => {

    el.style.opacity = "0";

    setTimeout(
      () => el.remove(),
      200
    );

  },3000);

}


function modal(
  title,
  content
) {

  qs("#modalRoot")
    .innerHTML = `
      <div
        class="modal-bg"

        onclick="
          if(event.target === this)
          closeModal()
        "
      >

        <div class="modal">

          <div class="modal-head">

            <h3 class="modal-title">
              ${esc(title)}
            </h3>

            <button
              class="icon-btn"
              onclick="closeModal()"
            >
              <i
                data-lucide="x"
                class="icon-sm"
              ></i>
            </button>

          </div>

          <div class="modal-body">
            ${content}
          </div>

        </div>

      </div>
    `;

  icons();

}


function closeModal() {

  qs("#modalRoot")
    .innerHTML = "";

}


function loadingButton(
  button,
  loading
) {

  if (!button) return;

  button.disabled = loading;

  if (loading) {

    button.dataset.old =
      button.innerHTML;

    button.innerHTML = `
      <i
        data-lucide="loader-circle"
        class="icon-sm spin"
      ></i>
    `;

  } else {

    if (button.dataset.old) {

      button.innerHTML =
        button.dataset.old;

    }

  }

  icons();

}


/* =========================================================
   BRANDING
========================================================= */

async function loadBranding() {

  try {

    const { data } =
      await sb
        .from("app_settings")
        .select("logo_url")
        .eq("id",1)
        .maybeSingle();

    state.logoUrl =
      data?.logo_url || null;

  } catch {

    state.logoUrl = null;

  }

}


/* =========================================================
   AUTH / INIT
========================================================= */

async function init() {

  await loadBranding();

  const {
    data: {
      session
    }
  } =
    await sb.auth.getSession();

  state.session = session;

  state.user =
    session?.user || null;

  if (state.user) {

    await loadMe();

  }

  render();

  sb.auth.onAuthStateChange(
    async (
      event,
      session
    ) => {

      state.session =
        session;

      state.user =
        session?.user || null;

      if (state.user) {

        await loadMe();

      } else {

        state.profile = null;

        state.wallet = {
          balance: 0
        };

        state.page =
          "chats";

      }

      render();

    }
  );

}


/* =========================================================
   LOAD ME
   FIXED PROFILE
========================================================= */

async function loadMe() {

  if (!state.user) return;

  try {

    const {
      data: profile,
      error: profileError
    } =
      await sb
        .from("profiles")
        .select("*")
        .eq(
          "id",
          state.user.id
        )
        .maybeSingle();


    if (profileError) {

      console.error(
        "PROFILE ERROR",
        profileError
      );

    }


    if (!profile) {

      const fallbackLogin =
        state.user
          .user_metadata
          ?.login
        ||
        state.user
          .email
          ?.split("@")[0]
        ||
        "user";


      state.profile = {

        id:
          state.user.id,

        login:
          fallbackLogin,

        username:
          fallbackLogin,

        public_id:
          "------",

        avatar_url:
          null,

        banner_url:
          null,

        role:
          "user",

        created_at:
          state.user.created_at

      };


      state.wallet = {
        balance: 0
      };

      return;

    }


    state.profile =
      profile;


    try {

      const {
        data: wallet,
        error: walletError
      } =
        await sb
          .from("wallets")
          .select("*")
          .eq(
            "user_id",
            state.user.id
          )
          .maybeSingle();


      if (walletError) {

        console.error(
          "WALLET ERROR",
          walletError
        );

      }


      state.wallet =
        wallet || {
          balance: 0
        };

    } catch {

      state.wallet = {
        balance: 0
      };

    }


  } catch (error) {

    console.error(
      "LOAD USER ERROR",
      error
    );


    const name =
      state.user
        ?.email
        ?.split("@")[0]
      ||
      "user";


    state.profile = {

      id:
        state.user?.id,

      login:
        name,

      username:
        name,

      public_id:
        "------",

      role:
        "user",

      avatar_url:
        null,

      banner_url:
        null,

      created_at:
        state.user?.created_at

    };


    state.wallet = {
      balance: 0
    };

  }

}


/* =========================================================
   LOGIN
========================================================= */

async function signIn() {

  const login =
    qs("#authLogin")
      ?.value
      .trim();

  const password =
    qs("#authPassword")
      ?.value;


  if (!validLogin(login)) {

    toast(
      "Неправильний формат логіна",
      "error"
    );

    return;

  }


  const button =
    qs("#authButton");

  loadingButton(
    button,
    true
  );


  const { error } =
    await sb.auth
      .signInWithPassword({

        email:
          loginEmail(login),

        password

      });


  loadingButton(
    button,
    false
  );


  if (error) {

    toast(
      "Невірний логін або пароль",
      "error"
    );

  }

}


/* =========================================================
   REGISTER
========================================================= */

async function signUp() {

  const login =
    qs("#authLogin")
      ?.value
      .trim();

  const password =
    qs("#authPassword")
      ?.value;


  if (!validLogin(login)) {

    toast(
      "Логін: 3–24 символи, букви, цифри або _",
      "error"
    );

    return;

  }


  if (
    !password ||
    password.length < 8
  ) {

    toast(
      "Пароль мінімум 8 символів",
      "error"
    );

    return;

  }


  const button =
    qs("#authButton");

  loadingButton(
    button,
    true
  );


  const {
    data,
    error
  } =
    await sb.auth.signUp({

      email:
        loginEmail(login),

      password,

      options: {

        data: {
          login
        }

      }

    });


  loadingButton(
    button,
    false
  );


  if (error) {

    toast(
      error.message,
      "error"
    );

    return;

  }


  if (!data.session) {

    toast(
      "Вимкни Confirm Email у Supabase",
      "error"
    );

    return;

  }


  toast(
    "Акаунт створено",
    "success"
  );

}


async function logout() {

  if (state.messageChannel) {

    await sb.removeChannel(
      state.messageChannel
    );

    state.messageChannel =
      null;

  }

  await sb.auth.signOut();

}

function render() {

        ${

            ? bottomButton(

        }

function navigate(page) {

  if (
    page === "admin" &&
    state.profile?.role !==
    "admin"
  ) {

    return;

  }

  state.page = page;

  render();

}


function renderPage() {

  if (
    state.page === "profile"
  ) {

    renderProfile();

    return;

  }


  if (
    state.page === "chats"
  ) {

    renderChats();

    return;

  }


  if (
    state.page === "shop"
  ) {

    renderShop();

    return;

  if (

}

async function uploadImage(
  file,
  name
) {

  if (!file) return null;


  const ext =
    file.name
      .split(".")
      .pop()
    ||
    "jpg";


  const path =
    `${state.user.id}/${name}-${Date.now()}.${ext}`;


  const { error } =
    await sb.storage
      .from("profiles")
      .upload(
        path,
        file,
        {
          upsert: true
        }
      );


  if (error) throw error;


  const { data } =
    sb.storage
      .from("profiles")
      .getPublicUrl(path);


  return data.publicUrl;

}


async function saveProfile() {

  const username =
    qs("#editUsername")
      .value
      .trim();


  const publicId =
    qs("#editId")
      .value
      .trim();


  if (
    !/^[A-Za-z0-9_]{3,24}$/
      .test(username)
  ) {

    toast(
      "Неправильний Username",
      "error"
    );

    return;

  }


  if (
    !/^\d{6}$/
      .test(publicId)
  ) {

    toast(
      "ID повинен мати 6 цифр",
      "error"
    );

    return;

  }


  const button =
    qs("#saveProfile");


  loadingButton(
    button,
    true
  );


  try {

    let avatarUrl =
      state.profile?.avatar_url;

    let bannerUrl =
      state.profile?.banner_url;


    const avatarFile =
      qs("#avatarFile")
        ?.files?.[0];


    const bannerFile =
      qs("#bannerFile")
        ?.files?.[0];


    if (avatarFile) {

      avatarUrl =
        await uploadImage(
          avatarFile,
          "avatar"
        );

    }


    if (bannerFile) {

      bannerUrl =
        await uploadImage(
          bannerFile,
          "banner"
        );

    }


    const { error } =
      await sb
        .from("profiles")
        .update({

          username,

          public_id:
            publicId,

          avatar_url:
            avatarUrl,

          banner_url:
            bannerUrl,

          updated_at:
            new Date()
              .toISOString()

        })
        .eq(
          "id",
          state.user.id
        );


    if (error) throw error;


    await loadMe();


    closeModal();

    render();


    toast(
      "Профіль збережено",
      "success"
    );


  } catch (error) {

    console.error(error);


    if (
      String(error.message)
        .toLowerCase()
        .includes("duplicate")
    ) {

      toast(
        "Цей Username або ID уже зайнятий",
        "error"
      );

    } else {

      toast(
        "Не вдалося зберегти профіль",
        "error"
      );

    }

  }


  loadingButton(
    button,
    false
  );

}

function cardNumberFormat(input) {

  let value =
    input.value
      .replace(/\D/g,"")
      .slice(0,16);


  value =
    value.replace(
      /(\d{4})(?=\d)/g,
      "$1 "
    );


  input.value =
    value;


  const preview =
    qs("#cardPreview");


  if (preview) {

    preview.textContent =
      value ||
      "•••• •••• •••• ••••";

  }

}


function cardDateFormat(input) {

  let value =
    input.value
      .replace(/\D/g,"")
      .slice(0,4);


  if (
    value.length > 2
  ) {

    value =
      value.slice(0,2)
      +
      "/"
      +
      value.slice(2);

  }


  input.value =
    value;


  const preview =
    qs("#datePreview");


  if (preview) {

    preview.textContent =
      value || "MM/YY";

  }

}


async function fakePayment() {

  const amount =
    Number(
      qs("#topupAmount")
        .value
        .replace(",",".")
    );


  if (
    !Number.isFinite(amount) ||
    amount <= 0
  ) {

    toast(
      "Вкажіть суму",
      "error"
    );

    return;

  }


  const button =
    qs("#paymentButton");


  loadingButton(
    button,
    true
  );


  /*
    Номер картки, CVV і дата
    НІКУДИ не відправляються.
    Supabase їх не отримує.
  */


  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        1400
      )
  );


  loadingButton(
    button,
    false
  );


  qs("#paymentError")
    ?.classList
    .remove("hidden");


  const number =
    qs("#cardNumber");

  const date =
    qs("#cardDate");

  const cvv =
    qs("#cardCvv");


  if (number) number.value = "";

  if (date) date.value = "";

  if (cvv) cvv.value = "";

}

async function loadChats() {

  const uid =
    state.user.id;


  const {
    data,
    error
  } =
    await sb
      .from(
        "direct_conversations"
      )
      .select("*")
      .or(
        `user1_id.eq.${uid},user2_id.eq.${uid}`
      )
      .order(
        "updated_at",
        {
          ascending: false
        }
      );


  const root =
    qs("#chatList");


  if (error) {

    if (root) {

      root.innerHTML = `
        <div class="empty">

          <strong>
            Чати поки недоступні
          </strong>

          <p>
            Перевір таблицю
            direct_conversations
            у Supabase.
          </p>

        </div>
      `;

    }

    return;

  }


  const chats =
    data || [];


  const ids =
    chats.map(chat =>

      chat.user1_id === uid

        ? chat.user2_id

        : chat.user1_id

    );


  let profiles = [];


  if (ids.length) {

    const {
      data: users
    } =
      await sb
        .from("profiles")
        .select(
          "id,username,public_id,avatar_url"
        )
        .in(
          "id",
          ids
        );


    profiles =
      users || [];

  }


  const profileMap =
    Object.fromEntries(

      profiles.map(user => [
        user.id,
        user
      ])

    );


  state.conversations =
    chats.map(chat => {

      const otherId =
        chat.user1_id === uid

          ? chat.user2_id

          : chat.user1_id;


      return {

        ...chat,

        other:
          profileMap[otherId]

      };

    });


  renderChatList();

}

function filterChats(value) {

  const query =
    value
      .trim()
      .toLowerCase();


  qsa(".chat-item")
    .forEach(item => {

      item.style.display =

        item.dataset.search
          .includes(query)

          ? ""

          : "none";

    });

}


async function openChat(
  conversationId,
  userId
) {

  let other =
    state.conversations
      .find(
        chat =>
          chat.id ===
          conversationId
      )
      ?.other;


  if (!other) {

    const { data } =
      await sb
        .from("profiles")
        .select("*")
        .eq(
          "id",
          userId
        )
        .maybeSingle();


    other = data;

  }


  state.activeConversation = {
    id:
      conversationId
  };


  state.activeChatUser =
    other;


  state.mobileChatOpen =
    true;


  const {
    data,
    error
  } =
    await sb
      .from("messages")
      .select("*")
      .eq(
        "conversation_id",
        conversationId
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      )
      .limit(300);


  if (error) {

    toast(
      "Не вдалося відкрити чат",
      "error"
    );

    return;

  }


  state.messages =
    data || [];


  if (state.messageChannel) {

    await sb.removeChannel(
      state.messageChannel
    );

  }


  state.messageChannel =
    sb
      .channel(
        "chat-" +
        conversationId
      )

      .on(

        "postgres_changes",

        {

          event:
            "INSERT",

          schema:
            "public",

          table:
            "messages",

          filter:
            `conversation_id=eq.${conversationId}`

        },

        payload => {

          const message =
            payload.new;


          const existing =
            state.messages.some(
              item =>
                item.id ===
                message.id
            );


          if (!existing) {

            state.messages.push(
              message
            );

          } else {

            state.messages =
              state.messages.map(
                item =>

                  item.id ===
                  message.id

                    ? message

                    : item

              );

          }


          refreshMessages(
            true
          );

        }

      )

      .subscribe();


  await renderChats();


  setTimeout(
    scrollMessages,
    30
  );

}


function closeMobileChat() {

  state.mobileChatOpen =
    false;

  renderChats();

}


function refreshMessages(
  scroll = false
) {

  const root =
    qs("#messages");


  if (!root) return;


  root.innerHTML =
    messagesMarkup();


  icons();


  if (scroll) {

    scrollMessages();

  }

}


function scrollMessages() {

  const root =
    qs("#messages");


  if (!root) return;


  root.scrollTop =
    root.scrollHeight;

}


function messageKey(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey &&
    window.innerWidth > 760
  ) {

    event.preventDefault();

    sendMessage();

  }

}


async function sendMessage() {

  if (
    !state.activeConversation
  ) return;


  const input =
    qs("#messageInput");


  const text =
    input
      ?.value
      .trim();


  if (!text) return;


  input.value = "";


  const id =
    crypto.randomUUID();


  state.messages.push({

    id,

    conversation_id:
      state.activeConversation.id,

    sender_id:
      state.user.id,

    content:
      text,

    created_at:
      new Date()
        .toISOString(),

    _pending:
      true

  });


  refreshMessages(true);


  const { error } =
    await sb
      .from("messages")
      .insert({

        id,

        conversation_id:
          state.activeConversation.id,

        sender_id:
          state.user.id,

        content:
          text

      });


  if (error) {

    state.messages =
      state.messages.map(
        message =>

          message.id === id

            ? {
                ...message,
                _pending: false,
                _failed: true
              }

            : message

      );


    refreshMessages();


    toast(
      "Не вдалося надіслати повідомлення",
      "error"
    );

  } else {

    state.messages =
      state.messages.map(
        message =>

          message.id === id

            ? {
                ...message,
                _pending: false
              }

            : message

      );


    refreshMessages();

  }

}

let searchTimer;


function searchUsers(value) {

  clearTimeout(
    searchTimer
  );


  searchTimer =
    setTimeout(
      () =>
        runUserSearch(value),
      250
    );

}


async function runUserSearch(value) {

  const query =
    value.trim();


  const root =
    qs("#userResults");


  if (!root) return;


  if (query.length < 2) {

    root.innerHTML = "";

    return;

  }


  let request =
    sb
      .from("profiles")
      .select(
        "id,username,public_id,avatar_url"
      )
      .neq(
        "id",
        state.user.id
      )
      .limit(15);


  if (
    /^\d{6}$/.test(query)
  ) {

    request =
      request.eq(
        "public_id",
        query
      );

  } else {

    request =
      request.ilike(
        "username",
        `%${query}%`
      );

  }


  const {
    data,
    error
  } =
    await request;


  if (
    error ||
    !data?.length
  ) {

    root.innerHTML = `
      <div class="empty">
        <strong>
          Нічого не знайдено
        </strong>
      </div>
    `;

    return;

  }


  root.innerHTML =
    data.map(user => `

      <button
        class="chat-item"

        onclick="
          createChat(
            '${user.id}'
          )
        "
      >

        ${avatar(user)}

        <div>

          <div class="chat-name">
            ${esc(
              user.username
            )}
          </div>

          <div class="chat-preview">
            ID
            ${esc(
              user.public_id
            )}
          </div>

        </div>

      </button>

    `).join("");


  icons();

}


async function createChat(
  userId
) {

  const {
    data,
    error
  } =
    await sb.rpc(
      "get_or_create_direct_conversation",
      {
        target_user_id:
          userId
      }
    );


  if (error) {

    toast(
      "Не вдалося створити чат",
      "error"
    );

    return;

  }


  closeModal();


  await loadChats();


  const id =
    typeof data ===
    "string"

      ? data

      : data?.id || data;


  await openChat(
    id,
    userId
  );

}

        "conversation_id",
        id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    toast(
      "Не вдалося відкрити",
      "error"
    );

    return;

  }


  modal(
    "Чат",

    `
      <div
        style="
          display:flex;
          flex-direction:column;
          gap:7px
        "
      >

        ${
          data?.length

            ? data.map(message => `

                <div
                  style="
                    padding:10px;
                    border:
                      1px solid
                      var(--border);
                    border-radius:11px;
                    background:#171717
                  "
                >

                  <div
                    style="
                      color:#777;
                      font-size:9px
                    "
                  >
                    ${esc(
                      message.sender_id
                    )}
                  </div>

                  <div
                    style="
                      margin-top:5px;
                      font-size:12px
                    "
                  >
                    ${esc(
                      message.content
                    )}
                  </div>

                  <div
                    style="
                      margin-top:5px;
                      color:#666;
                      font-size:8px
                    "
                  >
                    ${dateFormat(
                      message.created_at
                    )}

                    ${timeFormat(
                      message.created_at
                    )}
                  </div>

                </div>

              `).join("")

            : `
              <div class="empty">
                Повідомлень немає
              </div>
            `
        }

      </div>
    `
  );

}


function adminLogo() {

  qs("#adminContent")
    .innerHTML = `
      <section
        class="card"

        style="

          padding:20px

        <div
          style="

            gap:12px;
            align-items:center;
            margin-bottom:17px
          "

          ${logoMarkup()}

            <strong>

            </strong>

            <div
              style="
                color:#777;
                font-size:10px;
                margin-top:3px
              "
            >
              Відображається
              на сайті
            </div>

          </div>

        </div>


        <div class="field">

          <label>
            Новий логотип
          </label>

          <input
            id="logoFile"

            type="file"

            accept="image/*"

            class="input"
          >

        </div>


        <button
          class="
            btn
            btn-primary
          "

          style="

        </button>

      </section>
    `;


  icons();

}


async function saveLogo(button) {

  const file =
    qs("#logoFile")
      ?.files?.[0];


  if (!file) {

    toast(
      "Оберіть зображення",
      "error"
    );

    return;

  }


  loadingButton(
    button,
    true
  );


  try {

    const ext =
      file.name
        .split(".")
        .pop()
      ||
      "png";


    const path =
      `logo-${Date.now()}.${ext}`;


    const { error } =
      await sb.storage
        .from("branding")
        .upload(
          path,
          file
        );


    if (error) throw error;


    const { data } =
      sb.storage
        .from("branding")
        .getPublicUrl(path);


    const url =
      data.publicUrl;


    const {
      error:
        settingsError
    } =
      await sb
        .from("app_settings")
        .update({

          logo_url:
            url,

          updated_at:
            new Date()
              .toISOString()

        })
        .eq(
          "id",
          1
        );


    if (settingsError) {

      throw settingsError;

    }


    state.logoUrl =
      url;


    render();


    toast(
      "Логотип змінено",
      "success"
    );


  } catch(error) {

    console.error(error);


    toast(
      "Не вдалося змінити логотип",
      "error"
    );

  }


  loadingButton(
    button,
    false
  );

}
