<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#080b10"
>

<meta
  name="description"
  content="LiptonGram — особисті повідомлення та профілі"
>

<meta
  name="color-scheme"
  content="dark"
>

<title>LiptonGram</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&amp;family=Unbounded:wght@600;700;800&amp;display=swap"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
  box-sizing:border-box;
}

:root{
  --bg:#080808;
  --panel:#111;
  --panel2:#171717;
  --panel3:#202020;

  --text:#fff;
  --muted:#858585;

  --yellow:#f2c314;
  --yellow2:#ffdd4c;

  --danger:#ff5858;
  --success:#3ecf72;

  --border:rgba(255,255,255,.08);

  --shadow:
    0 25px 70px rgba(0,0,0,.36);

  --ease:
    cubic-bezier(.2,.8,.2,1);
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

html{
  scroll-behavior:smooth;
}

body{
  color:var(--text);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      900px 450px at 50% -180px,
      rgba(242,195,20,.14),
      transparent 70%
    ),
    var(--bg);

  -webkit-font-smoothing:antialiased;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  color:inherit;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

input::placeholder,
textarea::placeholder{
  color:#666;
}

img{
  max-width:100%;
}

.hidden{
  display:none!important;
}

.icon{
  width:20px;
  height:20px;
}

.icon-sm{
  width:17px;
  height:17px;
}

.spin{
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@keyframes pageEnter{
  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:
      translateY(18px)
      scale(.975);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes typingBounce{
  0%,
  60%,
  100%{
    transform:translateY(0);
    opacity:.4;
  }

  30%{
    transform:translateY(-4px);
    opacity:1;
  }
}

@keyframes pulseOnline{
  0%{
    box-shadow:
      0 0 0 0
      rgba(62,207,114,.25);
  }

  70%{
    box-shadow:
      0 0 0 5px
      rgba(62,207,114,0);
  }

  100%{
    box-shadow:
      0 0 0 0
      rgba(62,207,114,0);
  }
}

@keyframes imageIn{
  from{
    opacity:0;
    transform:scale(.97);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes bubbleInLeft{
  from{
    opacity:0;

    transform:
      translateX(-5px)
      translateY(5px)
      scale(.985);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes bubbleInRight{
  from{
    opacity:0;

    transform:
      translateX(5px)
      translateY(5px)
      scale(.985);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes photoShimmer{
  to{
    background-position:-200% 0;
  }
}

.page-animation{
  animation:
    pageEnter .28s var(--ease) both;
}

::-webkit-scrollbar{
  width:7px;
  height:7px;
}

::-webkit-scrollbar-thumb{
  background:#292929;
  border-radius:10px;
}

::-webkit-scrollbar-track{
  background:transparent;
}


/* =====================================================
   BUTTONS
===================================================== */

.btn{
  min-height:43px;

  padding:0 16px;

  border:0;
  border-radius:13px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  font-weight:750;

  cursor:pointer;

  transition:
    transform .16s var(--ease),
    filter .16s ease,
    background .16s ease,
    border-color .16s ease;
}

.btn:hover{
  filter:brightness(1.055);
}

.btn:active{
  transform:scale(.965);
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.btn-primary{
  color:#111;

  background:
    linear-gradient(
      135deg,
      var(--yellow2),
      var(--yellow)
    );
}

.btn-secondary{
  background:#1a1a1a;

  border:
    1px solid var(--border);
}

.btn-danger{
  background:
    rgba(255,88,88,.1);

  color:#ff7979;

  border:
    1px solid
    rgba(255,88,88,.17);
}

.icon-btn{
  width:42px;
  height:42px;

  flex:0 0 42px;

  padding:0;

  border:
    1px solid var(--border);

  border-radius:13px;

  background:#181818;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  transition:.15s ease;
}

.icon-btn:hover{
  background:#222;
}

.icon-btn:active{
  transform:scale(.93);
}


/* =====================================================
   INPUTS
===================================================== */

.field{
  display:flex;
  flex-direction:column;

  gap:7px;
}

.field label{
  color:#b4b4b4;

  font-size:12px;
  font-weight:700;
}

.input{
  width:100%;
  height:46px;

  padding:0 14px;

  color:#fff;

  background:#101010;

  border:
    1px solid var(--border);

  outline:0;

  border-radius:13px;

  transition:
    border-color .16s ease,
    background .16s ease,
    box-shadow .16s ease;
}

.input:hover{
  background:#131313;
}

.input:focus{
  border-color:
    rgba(242,195,20,.55);

  box-shadow:
    0 0 0 4px
    rgba(242,195,20,.07);
}


/* =====================================================
   AUTH
===================================================== */

.auth-page{
  min-height:100vh;
  min-height:100dvh;

  padding:20px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.auth-card{
  width:min(430px,100%);

  padding:28px;

  border-radius:27px;

  background:
    rgba(15,15,15,.9);

  border:
    1px solid var(--border);

  box-shadow:var(--shadow);

  backdrop-filter:blur(20px);

  animation:
    modalIn .34s var(--ease) both;
}

.auth-logo{
  width:70px;
  height:70px;

  margin:
    0 auto 18px;

  border-radius:21px;

  overflow:hidden;

  color:#111;

  background:
    linear-gradient(
      135deg,
      var(--yellow2),
      var(--yellow)
    );

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:28px;
  font-weight:900;
}

.auth-logo img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.auth-title{
  margin:0;

  text-align:center;

  font-size:30px;
  font-weight:850;
}

.auth-sub{
  margin:
    7px 0 23px;

  color:var(--muted);

  text-align:center;

  font-size:13px;
}

.auth-tabs{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  padding:4px;

  margin-bottom:18px;

  background:#0c0c0c;

  border:
    1px solid var(--border);

  border-radius:14px;
}

.auth-tab{
  height:39px;

  border:0;

  border-radius:10px;

  background:transparent;

  color:#777;

  font-weight:750;

  cursor:pointer;
}

.auth-tab.active{
  background:#202020;
  color:#fff;
}

.auth-form{
  display:flex;
  flex-direction:column;

  gap:14px;
}


/* =====================================================
   APP
===================================================== */

.app{
  min-height:100vh;
  min-height:100dvh;

  display:grid;

  grid-template-columns:
    260px minmax(0,1fr);
}

.sidebar{
  position:sticky;
  top:0;

  height:100vh;
  height:100dvh;

  padding:
    18px 13px;

  border-right:
    1px solid var(--border);

  background:
    rgba(9,9,9,.88);

  backdrop-filter:
    blur(20px);

  display:flex;
  flex-direction:column;

  z-index:30;
}

.brand{
  height:55px;

  padding:0 8px;

  margin-bottom:14px;

  display:flex;
  align-items:center;

  gap:11px;
}

.brand-logo{
  width:40px;
  height:40px;

  flex:0 0 40px;

  border-radius:12px;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#111;

  font-size:18px;
  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--yellow2),
      var(--yellow)
    );
}

.brand-logo img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.brand-name{
  font-size:18px;
  font-weight:850;
}

.side-nav{
  display:flex;
  flex-direction:column;

  gap:5px;
}

.nav-btn{
  width:100%;
  height:48px;

  padding:
    0 13px;

  border:0;
  border-radius:13px;

  color:#858585;

  background:transparent;

  display:flex;
  align-items:center;

  gap:12px;

  font-weight:750;

  cursor:pointer;

  transition:.15s ease;
}

.nav-btn:hover{
  color:#fff;

  background:#151515;

  transform:
    translateX(2px);
}

.nav-btn.active{
  color:#111;

  background:
    linear-gradient(
      135deg,
      var(--yellow2),
      var(--yellow)
    );
}

.sidebar-space{
  flex:1;
}

.side-user{
  padding:9px;

  border-radius:16px;

  border:
    1px solid var(--border);

  background:#111;

  display:flex;
  align-items:center;

  gap:9px;
}

.side-user-info{
  min-width:0;

  flex:1;
}

.side-user-name{
  font-size:12px;
  font-weight:800;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.side-user-id{
  margin-top:2px;

  color:#777;

  font-size:10px;
}

.main{
  min-width:0;
}

.page{
  width:
    min(1180px,100%);

  margin:auto;

  padding:25px;
}

.page-head{
  min-height:54px;

  margin-bottom:18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:14px;
}

.page-title{
  margin:0;

  font-size:27px;
  font-weight:850;

  letter-spacing:-.5px;
}

.page-desc{
  margin-top:4px;

  color:var(--muted);

  font-size:12px;
}

.card{
  border:
    1px solid var(--border);

  border-radius:18px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,.008)
    );

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.19);
}


/* =====================================================
   AVATAR / PRESENCE
===================================================== */

.avatar{
  width:43px;
  height:43px;

  flex:0 0 43px;

  overflow:hidden;

  border-radius:50%;

  border:
    1px solid
    rgba(255,255,255,.09);

  background:#222;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:800;
}

.avatar.large{
  width:106px;
  height:106px;

  flex:0 0 106px;

  font-size:29px;

  border:
    4px solid #101010;
}

.avatar img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.avatar-status-wrap{
  position:relative;

  width:43px;
  height:43px;

  flex:0 0 43px;

  display:inline-flex;
}

.avatar-status-wrap.large{
  width:106px;
  height:106px;

  flex:0 0 106px;
}

.avatar-status-wrap .avatar{
  width:100%;
  height:100%;

  flex:1;
}

.presence-dot{
  position:absolute;

  right:-1px;
  bottom:-1px;

  width:13px;
  height:13px;

  border-radius:50%;

  background:#555;

  border:
    3px solid #111;
}

.avatar-status-wrap.large
.presence-dot{
  width:20px;
  height:20px;

  right:4px;
  bottom:5px;

  border-width:4px;
}

.presence-dot.online{
  background:#3ecf72;

  animation:
    pulseOnline
    2.3s infinite;
}

.presence-dot.offline{
  background:#5b5b5b;
}

.presence-text{
  display:inline-flex;
  align-items:center;

  gap:5px;

  color:#777;
}

.presence-text.online{
  color:#54d981;
}

.presence-mini-dot{
  width:6px;
  height:6px;

  flex:0 0 6px;

  border-radius:50%;

  background:#5b5b5b;
}

.presence-text.online
.presence-mini-dot{
  background:#3ecf72;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
  min-height:240px;

  padding:30px;

  color:#777;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;
}

.empty-icon{
  width:52px;
  height:52px;

  margin-bottom:13px;

  border-radius:16px;

  border:
    1px solid var(--border);

  background:#181818;

  display:flex;
  align-items:center;
  justify-content:center;
}

.empty strong{
  color:#fff;

  font-size:15px;
}

.empty p{
  max-width:400px;

  margin:
    7px 0 0;

  line-height:1.5;

  font-size:12px;
}


/* =====================================================
   PROFILE
===================================================== */

.profile-card{
  overflow:hidden;
}

.profile-banner{
  height:235px;

  background:
    linear-gradient(
      120deg,
      #2b250d,
      #534000,
      #181818
    );

  background-size:cover;
  background-position:center;
}

.profile-info{
  padding:
    0 23px 23px;

  display:flex;
  align-items:flex-end;

  gap:18px;
}

.profile-avatar{
  margin-top:-50px;
}

.profile-main{
  min-width:0;

  flex:1;

  padding-top:16px;
}

.profile-name{
  margin:0;

  font-size:24px;
  font-weight:850;

  word-break:break-word;
}

.profile-login{
  margin-top:4px;

  color:var(--muted);

  font-size:12px;
}

.profile-tags{
  margin-top:10px;

  display:flex;
  flex-wrap:wrap;

  gap:6px;
}

.tag{
  min-height:27px;

  padding:0 8px;

  border-radius:8px;

  border:
    1px solid var(--border);

  background:#171717;

  color:#aaa;

  display:inline-flex;
  align-items:center;

  gap:5px;

  font-size:10px;
}

.profile-actions{
  padding-top:15px;
}

.profile-stats{
  margin-top:14px;

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:13px;
}

.stat{
  padding:19px;
}

.stat-label{
  color:var(--muted);

  font-size:11px;
}

.stat-value{
  margin-top:7px;

  font-size:21px;
  font-weight:850;

  word-break:break-word;
}


/* =====================================================
   CHATS
===================================================== */

.chat-layout{
  height:
    calc(100dvh - 46px);

  padding:22px;

  display:grid;

  grid-template-columns:
    350px minmax(0,1fr);

  gap:14px;
}

.chat-list-panel{
  min-height:0;

  overflow:hidden;

  display:flex;
  flex-direction:column;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,.008)
    );

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:22px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.22);
}

.chat-list-head{
  padding:
    18px 17px 15px;

  border-bottom:
    1px solid
    rgba(255,255,255,.065);

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.025),
      transparent
    );
}

.chat-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-bottom:15px;
}

.chat-title-content{
  min-width:0;
}

.chat-title-row h2{
  margin:0;

  font-size:22px;
  font-weight:850;

  letter-spacing:-.45px;
}

.chat-title-subtitle{
  margin-top:4px;

  color:#707070;

  font-size:10px;
}

.new-chat-btn{
  width:42px;
  height:42px;

  flex:0 0 42px;

  border:
    1px solid
    rgba(242,195,20,.18);

  border-radius:13px;

  color:#111;

  background:
    linear-gradient(
      135deg,
      var(--yellow2),
      var(--yellow)
    );

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  box-shadow:
    0 8px 24px
    rgba(242,195,20,.11);

  transition:.15s ease;
}

.new-chat-btn:hover{
  transform:
    translateY(-1px);

  filter:brightness(1.05);
}

.new-chat-btn:active{
  transform:scale(.92);
}


/* SEARCH */

.chat-search{
  position:relative;
}

.chat-search-icon{
  position:absolute;

  left:13px;
  top:50%;

  transform:
    translateY(-50%);

  width:17px;
  height:17px;

  color:#666;

  pointer-events:none;

  transition:.16s ease;
}

.chat-search-input{
  width:100%;
  height:44px;

  padding:
    0 13px
    0 41px;

  border-radius:14px;

  border:
    1px solid
    rgba(255,255,255,.075);

  outline:none;

  color:#fff;

  background:
    rgba(255,255,255,.035);

  font-size:12px;

  transition:
    border-color .16s ease,
    background .16s ease,
    box-shadow .16s ease;
}

.chat-search-input:hover{
  background:
    rgba(255,255,255,.045);
}

.chat-search-input:focus{
  background:#151515;

  border-color:
    rgba(242,195,20,.42);

  box-shadow:
    0 0 0 4px
    rgba(242,195,20,.055);
}

.chat-search:focus-within
.chat-search-icon{
  color:var(--yellow);
}


/* CHAT LIST */

.chat-list{
  min-height:0;

  flex:1;

  overflow-y:auto;

  padding:8px;
}

.chat-item{
  position:relative;

  width:100%;

  min-height:66px;

  padding:10px;

  border:0;

  border-radius:16px;

  color:#fff;

  background:transparent;

  display:flex;
  align-items:center;

  gap:11px;

  text-align:left;

  cursor:pointer;

  transition:
    background .16s ease,
    transform .16s var(--ease);
}

.chat-item:hover{
  background:
    rgba(255,255,255,.04);

  transform:
    translateX(2px);
}

.chat-item:active{
  transform:scale(.985);
}

.chat-item.active{
  background:
    linear-gradient(
      135deg,
      rgba(242,195,20,.12),
      rgba(242,195,20,.035)
    );

  box-shadow:
    inset 0 0 0 1px
    rgba(242,195,20,.10);
}

.chat-item.active::before{
  content:"";

  position:absolute;

  left:0;
  top:17px;
  bottom:17px;

  width:3px;

  border-radius:
    0 4px 4px 0;

  background:var(--yellow);
}

.chat-item
.avatar-status-wrap{
  width:46px;
  height:46px;

  flex:0 0 46px;
}

.chat-item-content{
  min-width:0;

  flex:1;
}

.chat-item-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;
}

.chat-name{
  min-width:0;

  font-size:13px;
  font-weight:780;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-time{
  flex:0 0 auto;

  color:#626262;

  font-size:9px;
  font-weight:600;
}

.chat-preview{
  margin-top:4px;

  color:#757575;

  font-size:11px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}


/* CHAT WINDOW */

.chat-panel{
  min-height:0;

  overflow:hidden;

  display:flex;
  flex-direction:column;

  border-radius:22px;

  border:
    1px solid
    rgba(255,255,255,.08);

  background:
    radial-gradient(
      700px 330px
      at 50% -130px,
      rgba(242,195,20,.055),
      transparent 70%
    ),
    #0e0e0e;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.22);
}

.active-chat-head{
  height:70px;

  flex:0 0 70px;

  padding:0 17px;

  border-bottom:
    1px solid
    rgba(255,255,255,.07);

  background:
    rgba(15,15,15,.82);

  backdrop-filter:
    blur(16px);

  display:flex;
  align-items:center;

  gap:11px;
}

.active-chat-user{
  min-width:0;

  flex:1;

  cursor:pointer;
}

.active-chat-name{
  font-size:13px;
  font-weight:820;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.active-chat-id{
  margin-top:3px;

  color:#707070;

  font-size:10px;

  display:flex;
  align-items:center;

  gap:7px;
}

.active-chat-separator{
  color:#4b4b4b;
}


/* =====================================================
   NEW MESSAGE BUBBLES
===================================================== */

.messages{
  min-height:0;

  flex:1;

  overflow-y:auto;

  padding:
    24px 22px 14px;

  display:flex;
  flex-direction:column;

  gap:7px;

  scroll-behavior:smooth;

  background:
    radial-gradient(
      620px 300px
      at 50% 0,
      rgba(255,255,255,.018),
      transparent 72%
    );
}

.message-row{
  width:100%;

  display:flex;
}

.message-row:not(.mine){
  justify-content:flex-start;

  animation:
    bubbleInLeft
    .21s var(--ease) both;
}

.message-row.mine{
  justify-content:flex-end;

  animation:
    bubbleInRight
    .21s var(--ease) both;
}


/* FOREIGN MESSAGE */

.message{
  position:relative;

  max-width:
    min(560px,74%);

  padding:
    9px 12px 7px;

  border-radius:
    18px 18px 18px 7px;

  color:#ededed;

  background:
    linear-gradient(
      145deg,
      #222 0%,
      #1a1a1a 100%
    );

  border:
    1px solid
    rgba(255,255,255,.055);

  box-shadow:
    0 4px 14px
    rgba(0,0,0,.12);

  font-size:13px;

  line-height:1.48;

  word-break:break-word;

  transition:
    border-color .16s ease,
    background .16s ease,
    transform .16s var(--ease),
    box-shadow .16s ease;
}

.message-row:not(.mine)
.message:hover{
  border-color:
    rgba(255,255,255,.09);

  background:
    linear-gradient(
      145deg,
      #252525,
      #1d1d1d
    );

  box-shadow:
    0 6px 18px
    rgba(0,0,0,.16);
}


/* FOREIGN TAIL */

.message-row:not(.mine)
.message::after{
  content:"";

  position:absolute;

  left:-5px;
  bottom:-1px;

  width:11px;
  height:12px;

  background:#1b1b1b;

  clip-path:
    polygon(
      100% 0,
      100% 100%,
      0 100%
    );

  z-index:0;
}


/* MY MESSAGE */

.message-row.mine
.message{
  color:#181500;

  border-radius:
    18px 18px 7px 18px;

  background:
    linear-gradient(
      145deg,
      #f8d63d 0%,
      #f2c414 54%,
      #e4af00 100%
    );

  border:
    1px solid
    rgba(255,235,135,.22);

  box-shadow:
    0 5px 16px
    rgba(167,124,0,.12);
}

.message-row.mine
.message:hover{
  background:
    linear-gradient(
      145deg,
      #ffdc49 0%,
      #f6ca1c 54%,
      #eab600 100%
    );

  box-shadow:
    0 7px 20px
    rgba(167,124,0,.15);
}


/* MY TAIL */

.message-row.mine
.message::after{
  content:"";

  position:absolute;

  right:-5px;
  bottom:-1px;

  width:11px;
  height:12px;

  background:#e5b000;

  clip-path:
    polygon(
      0 0,
      100% 100%,
      0 100%
    );

  z-index:0;
}


/* TEXT */

.message-text{
  position:relative;

  z-index:2;

  white-space:pre-wrap;
}


/* TIME */

.message-time{
  position:relative;

  z-index:2;

  margin-top:4px;

  text-align:right;

  color:#777;

  font-size:8px;
  font-weight:650;

  letter-spacing:.1px;

  opacity:.78;
}

.message-row.mine
.message-time{
  color:
    rgba(40,34,0,.62);

  opacity:1;
}


/* =====================================================
   MESSAGE PHOTO
===================================================== */

.message-image-wrap{
  position:relative;

  z-index:2;

  margin:
    -4px -7px 7px;

  overflow:hidden;

  border-radius:14px;

  background:#111;

  cursor:pointer;
}

.message-image-wrap::after{
  content:"";

  position:absolute;

  inset:0;

  opacity:0;

  background:
    linear-gradient(
      180deg,
      transparent 65%,
      rgba(0,0,0,.15)
    );

  transition:
    opacity .16s ease;

  pointer-events:none;
}

.message-image-wrap:hover::after{
  opacity:1;
}

.message-image{
  display:block;

  width:auto;
  max-width:100%;

  max-height:430px;

  object-fit:contain;

  border-radius:14px;

  animation:
    imageIn
    .2s var(--ease);
}

.message-image-loading{
  width:230px;
  height:150px;

  border-radius:13px;

  background:
    linear-gradient(
      90deg,
      #181818,
      #262626,
      #181818
    );

  background-size:
    200% 100%;

  animation:
    photoShimmer
    1.1s linear infinite;
}


/* =====================================================
   TYPING
===================================================== */

.typing-container{
  height:27px;

  padding:
    0 20px;

  flex:0 0 27px;

  display:flex;
  align-items:center;

  color:#777;

  font-size:10px;

  opacity:0;

  transform:
    translateY(4px);

  pointer-events:none;

  transition:
    opacity .17s ease,
    transform .17s var(--ease);
}

.typing-container.visible{
  opacity:1;

  transform:none;
}

.typing-content{
  display:flex;
  align-items:center;

  gap:7px;
}

.typing-dots{
  display:flex;
  align-items:center;

  gap:3px;
}

.typing-dot{
  width:4px;
  height:4px;

  border-radius:50%;

  background:#8b8b8b;

  animation:
    typingBounce
    1.1s infinite;
}

.typing-dot:nth-child(2){
  animation-delay:.14s;
}

.typing-dot:nth-child(3){
  animation-delay:.28s;
}


/* =====================================================
   COMPOSER
===================================================== */

.composer-zone{
  border-top:
    1px solid
    rgba(255,255,255,.07);

  background:
    rgba(13,13,13,.94);

  backdrop-filter:
    blur(16px);
}

.composer-preview{
  display:none;

  padding:
    11px 13px 0;
}

.composer-preview.visible{
  display:block;

  animation:
    pageEnter
    .18s var(--ease);
}

.composer-image-card{
  width:fit-content;

  max-width:250px;

  padding:7px;

  border:
    1px solid var(--border);

  border-radius:15px;

  background:#171717;

  display:flex;
  align-items:center;

  gap:9px;
}

.composer-image-thumb{
  width:60px;
  height:60px;

  flex:0 0 60px;

  object-fit:cover;

  border-radius:10px;
}

.composer-image-info{
  min-width:0;
}

.composer-image-name{
  max-width:120px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  color:#ddd;

  font-size:10px;
  font-weight:700;
}

.composer-image-size{
  margin-top:3px;

  color:#666;

  font-size:9px;
}

.remove-image{
  width:30px;
  height:30px;

  flex:0 0 30px;

  padding:0;

  border:0;
  border-radius:9px;

  background:#242424;

  color:#aaa;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

.composer{
  padding:
    10px 13px
    max(
      11px,
      env(safe-area-inset-bottom)
    );

  display:flex;
  align-items:flex-end;

  gap:8px;
}

.attach{
  width:45px;
  height:45px;

  flex:0 0 45px;

  padding:0;

  border:
    1px solid
    rgba(255,255,255,.075);

  border-radius:14px;

  color:#aaa;

  background:#171717;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  transition:.15s ease;
}

.attach:hover{
  color:var(--yellow);

  border-color:
    rgba(242,195,20,.24);

  background:#1b1b1b;
}

.attach:active{
  transform:scale(.92);
}

.composer textarea{
  min-height:45px;
  max-height:130px;

  flex:1;

  padding:
    11px 14px;

  resize:none;

  outline:none;

  color:#fff;

  background:#171717;

  border:
    1px solid
    rgba(255,255,255,.075);

  border-radius:15px;

  line-height:1.4;

  transition:
    border-color .15s ease,
    background .15s ease,
    box-shadow .15s ease;
}

.composer textarea:focus{
  background:#191919;

  border-color:
    rgba(242,195,20,.32);

  box-shadow:
    0 0 0 4px
    rgba(242,195,20,.045);
}

.send{
  width:45px;
  height:45px;

  flex:0 0 45px;

  padding:0;

  border:0;
  border-radius:14px;

  color:#111;

  background:
    linear-gradient(
      135deg,
      var(--yellow2),
      var(--yellow)
    );

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  box-shadow:
    0 7px 24px
    rgba(242,195,20,.09);

  transition:.14s ease;
}

.send:hover{
  transform:
    translateY(-1px);

  filter:brightness(1.04);
}

.send:active{
  transform:scale(.91);
}


/* =====================================================
   IMAGE VIEWER
===================================================== */

.image-viewer-bg{
  position:fixed;
  inset:0;

  z-index:1500;

  padding:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    rgba(0,0,0,.91);

  backdrop-filter:
    blur(16px);

  animation:
    pageEnter .18s ease both;
}

.image-viewer{
  position:relative;

  max-width:
    min(1100px,100%);

  max-height:
    calc(100dvh - 40px);

  display:flex;
  align-items:center;
  justify-content:center;
}

.image-viewer img{
  display:block;

  max-width:100%;

  max-height:
    calc(100dvh - 40px);

  object-fit:contain;

  border-radius:15px;

  box-shadow:
    0 30px 100px
    rgba(0,0,0,.7);

  animation:
    imageIn .22s var(--ease);
}

.image-viewer-close{
  position:absolute;

  top:10px;
  right:10px;

  width:42px;
  height:42px;

  padding:0;

  border:
    1px solid
    rgba(255,255,255,.13);

  border-radius:13px;

  background:
    rgba(15,15,15,.8);

  backdrop-filter:
    blur(12px);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}


/* =====================================================
   USER SEARCH
===================================================== */

.user-search-help{
  margin-bottom:11px;

  color:#707070;

  font-size:11px;
  line-height:1.45;
}

#userResults{
  max-height:390px;

  overflow-y:auto;

  margin-top:10px;
}


/* =====================================================
   ADMIN
===================================================== */

.admin-tabs{
  margin-bottom:14px;

  display:flex;
  flex-wrap:wrap;

  gap:6px;
}

.admin-tab{
  height:38px;

  padding:0 12px;

  border:
    1px solid var(--border);

  border-radius:10px;

  color:#777;

  background:#151515;

  font-size:11px;
  font-weight:750;

  cursor:pointer;
}

.admin-tab.active{
  color:#111;

  background:var(--yellow);

  border-color:var(--yellow);
}

.admin-stats{
  margin-bottom:14px;

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:12px;
}

.admin-stat{
  padding:17px;
}

.admin-number{
  margin-top:7px;

  font-size:23px;
  font-weight:850;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;

  border-collapse:collapse;

  font-size:11px;
}

th,
td{
  padding:
    12px 14px;

  text-align:left;

  white-space:nowrap;

  border-bottom:
    1px solid
    rgba(255,255,255,.05);
}

th{
  color:#777;
}

.role{
  padding:4px 7px;

  border-radius:7px;

  background:#222;

  font-size:9px;
}

.role.admin{
  color:var(--yellow);

  background:
    rgba(242,195,20,.1);
}


/* =====================================================
   MODAL
===================================================== */

.modal-bg{
  position:fixed;
  inset:0;

  z-index:500;

  padding:17px;

  background:
    rgba(0,0,0,.74);

  backdrop-filter:
    blur(8px);

  display:flex;
  align-items:center;
  justify-content:center;

  animation:
    pageEnter .16s ease both;
}

.modal{
  width:
    min(480px,100%);

  max-height:
    calc(100dvh - 34px);

  overflow:auto;

  border-radius:23px;

  border:
    1px solid
    rgba(255,255,255,.1);

  background:#111;

  box-shadow:var(--shadow);

  animation:
    modalIn
    .21s var(--ease) both;
}

.modal-head{
  padding:
    18px 18px 8px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;
}

.modal-title{
  margin:0;

  font-size:18px;
  font-weight:850;
}

.modal-body{
  padding:
    12px 18px 19px;
}

.modal-form{
  display:flex;
  flex-direction:column;

  gap:13px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;

  gap:8px;
}


/* =====================================================
   TOAST
===================================================== */

#toasts{
  position:fixed;

  right:16px;
  bottom:16px;

  z-index:2000;

  display:flex;
  flex-direction:column;

  gap:7px;

  pointer-events:none;
}

.toast{
  width:
    min(
      340px,
      calc(100vw - 32px)
    );

  padding:
    11px 13px;

  border-radius:13px;

  border:
    1px solid var(--border);

  background:
    rgba(25,25,25,.94);

  backdrop-filter:
    blur(15px);

  box-shadow:var(--shadow);

  display:flex;
  align-items:center;

  gap:9px;

  font-size:11px;

  animation:
    pageEnter .2s var(--ease) both;
}

.bottom-nav{
  display:none;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1000px){

  .app{
    grid-template-columns:
      80px minmax(0,1fr);
  }

  .brand-name,
  .nav-btn span,
  .side-user-info{
    display:none;
  }

  .brand{
    justify-content:center;
  }

  .nav-btn{
    padding:0;

    justify-content:center;
  }

  .admin-stats{
    grid-template-columns:
      repeat(2,1fr);
  }

}


@media(max-width:760px){

  .app{
    display:block;
  }

  .sidebar{
    display:none;
  }

  .main{
    min-height:100dvh;

    padding-bottom:78px;
  }

  .bottom-nav{
    position:fixed;

    left:10px;
    right:10px;

    bottom:
      max(
        10px,
        env(safe-area-inset-bottom)
      );

    z-index:100;

    min-height:61px;

    padding:5px;

    border-radius:19px;

    border:
      1px solid
      rgba(255,255,255,.09);

    background:
      rgba(15,15,15,.92);

    backdrop-filter:
      blur(20px);

    display:grid;

    box-shadow:
      0 18px 60px
      rgba(0,0,0,.45);
  }

  .bottom-nav.two{
    grid-template-columns:
      repeat(2,1fr);
  }

  .bottom-nav.three{
    grid-template-columns:
      repeat(3,1fr);
  }

  .bottom-nav.four{
    grid-template-columns:
      repeat(4,1fr);
  }

  .bottom-btn{
    border:0;

    border-radius:14px;

    color:#777;

    background:transparent;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:2px;

    font-size:9px;
  }

  .bottom-btn.active{
    color:#111;

    background:var(--yellow);
  }

  .page{
    padding:
      17px 13px 100px;
  }

  .page-head{
    align-items:flex-start;
  }

  .page-title{
    font-size:23px;
  }

  .profile-banner{
    height:175px;
  }

  .profile-info{
    padding:
      0 16px 18px;

    align-items:flex-start;

    flex-wrap:wrap;
  }

  .profile-main{
    flex-basis:
      calc(100% - 125px);
  }

  .profile-actions{
    width:100%;

    padding-top:0;
  }

  .profile-actions .btn{
    width:100%;
  }

  .profile-stats{
    grid-template-columns:1fr;

    gap:9px;
  }

  .chat-layout{
    height:
      calc(100dvh - 78px);

    padding:0;

    display:block;
  }

  .chat-list-panel,
  .chat-panel{
    height:100%;

    border:0;

    border-radius:0;

    box-shadow:none;
  }

  .mobile-hidden{
    display:none!important;
  }

  .chat-list-head{
    padding:
      16px 13px 13px;
  }

  .chat-title-row h2{
    font-size:22px;
  }

  .chat-search-input{
    height:45px;
  }

  .chat-list{
    padding:7px;
  }

  .chat-item{
    min-height:67px;

    border-radius:15px;
  }

  .active-chat-head{
    height:67px;

    flex:0 0 67px;

    padding:
      0 11px;
  }

  .messages{
    padding:
      17px 11px 10px;

    gap:6px;
  }

  .message{
    max-width:87%;

    padding:
      9px 11px 7px;

    border-radius:
      17px 17px 17px 7px;

    font-size:13px;
  }

  .message-row.mine
  .message{
    border-radius:
      17px 17px 7px 17px;
  }

  .message-image{
    max-height:330px;
  }

  .typing-container{
    padding:
      0 12px;
  }

  .composer{
    padding:
      8px 10px
      max(
        10px,
        env(safe-area-inset-bottom)
      );
  }

  .composer-preview{
    padding:
      9px 10px 0;
  }

  .admin-stats{
    grid-template-columns:
      1fr 1fr;
  }

}



/* =====================================================
   HUMAN UI PASS — flatter, calmer, more deliberate
   Only visual overrides. App logic is untouched.
===================================================== */

:root{
  --bg:#0b0b0c;
  --panel:#111214;
  --panel2:#151619;
  --panel3:#1b1c20;
  --text:#f4f4f5;
  --muted:#8b8d93;
  --yellow:#f3c623;
  --yellow2:#f3c623;
  --border:rgba(255,255,255,.07);
  --shadow:0 12px 30px rgba(0,0,0,.22);
}

html,body{
  background:var(--bg);
}

body{
  background:var(--bg) !important;
  letter-spacing:0;
}

.page-animation,
.auth-card,
.modal,
.toast,
.message-row,
.message-image{
  animation-duration:.14s !important;
}

/* less "AI glow" */
.card,
.auth-card,
.chat-list-panel,
.chat-panel,
.modal,
.sidebar,
.bottom-nav{
  box-shadow:none !important;
  backdrop-filter:none !important;
}

.card{
  background:var(--panel) !important;
  border:1px solid var(--border) !important;
  border-radius:14px !important;
}

/* SIDEBAR */
.sidebar{
  background:#0d0e10 !important;
  border-right:1px solid #1c1d21 !important;
  padding:16px 12px !important;
}

.brand{
  height:50px !important;
  padding:0 10px !important;
  margin-bottom:12px !important;
}

.brand-logo,
.auth-logo{
  background:var(--yellow) !important;
  border-radius:11px !important;
  box-shadow:none !important;
}

.brand-name{
  font-size:17px !important;
  font-weight:760 !important;
  letter-spacing:-.2px;
}

.nav-btn{
  height:44px !important;
  border-radius:10px !important;
  color:#8c8f96 !important;
  font-weight:650 !important;
  padding:0 12px !important;
}

.nav-btn:hover{
  background:#15161a !important;
  color:#e9e9eb !important;
  transform:none !important;
}

.nav-btn.active{
  background:#1b1c20 !important;
  color:#fff !important;
  box-shadow:inset 3px 0 0 var(--yellow) !important;
}

.side-user{
  background:#121317 !important;
  border:1px solid #202126 !important;
  border-radius:12px !important;
}

/* PAGE */
.page{
  max-width:1120px !important;
  padding:24px 28px !important;
}

.page-title{
  font-size:24px !important;
  font-weight:760 !important;
  letter-spacing:-.35px !important;
}

.page-desc{
  color:#7e8087 !important;
  font-size:12px !important;
}

/* BUTTONS */
.btn,
.icon-btn,
.new-chat-btn,
.send,
.attach{

.page-animation{
  animation:finalPageIn .24s var(--ease) both !important;
}

@keyframes finalPageIn{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:none}
}

@keyframes finalBubbleIn{
  from{opacity:0;transform:translateY(5px) scale(.985)}
  to{opacity:1;transform:none}
}

@keyframes finalToastIn{
  from{opacity:0;transform:translateY(10px) scale(.98)}
  to{opacity:1;transform:none}
}

@keyframes bootPulse{
  0%,100%{opacity:.38;transform:scale(.92)}
  50%{opacity:1;transform:scale(1)}
}

.boot-screen{

  min-height:100dvh;

  flex-direction:column;

  justify-content:center;

.boot-loader{

</head>

<body>

<div id="app">
  <main
    class="boot-screen"
    aria-live="polite"
    aria-label="Завантаження LiptonGram"
  >
    <div class="boot-mark">L</div>
    <div class="boot-name">LiptonGram</div>
    <div
      class="boot-loader"
      aria-hidden="true"
    >
      <span></span>
      <span></span>
      <span></span>
    </div>
  </main>
</div>

<div id="modalRoot"></div>

<div id="imageViewerRoot"></div>

<div id="toasts"></div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://latgnxbzymbyngslzfko.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9KKwvgywcvchh-s_FMSvbw_hx2LMgX-";

const sb =
  window.supabase

    ?window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      )

    :null;


/* =====================================================
   STATE
===================================================== */

const state={

  user:null,

  session:null,

  profile:null,

  wallet:{
    balance:0
  },

  logoUrl:null,

  page:"chats",

  authMode:"login",

  conversations:[],

  activeConversation:null,

  activeChatUser:null,

  messages:[],

  messageChannel:null,

  chatChannelReady:false,

  listings:[],

  mobileChatOpen:false,

  adminTab:"dashboard",

  adminUsers:[],

  presenceChannel:null,

  onlineUsers:
    new Set(),

  typingUserId:null,

  typingHideTimer:null,

  typingSendTimer:null,

  typingActive:false,

  selectedImage:null,

  selectedImagePreview:null,

  sendingMessage:false,

  chatOpenRequest:0,

  chatListRequest:0,

  userSearchRequest:0,

  authEventVersion:0,

  modalReturnFocus:null

};


/* =====================================================
   HELPERS
===================================================== */

function qs(value){

  return document
    .querySelector(value);

}


function qsa(value){

  return [
    ...document
      .querySelectorAll(value)
  ];

}


function esc(value=""){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function jsString(value=""){

  return JSON.stringify(
    String(value)
  )
    .replaceAll(
      "<",
      "\\u003c"
    )
    .replaceAll(
      ">",
      "\\u003e"
    );

}


function syncOverlayState(){

  const hasOverlay=
    Boolean(
      qs("#modalRoot")
        ?.children.length
      ||
      qs("#imageViewerRoot")
        ?.children.length
    );


  document.body.classList
    .toggle(
      "overlay-open",
      hasOverlay
    );

}


function imageExtension(file){

  const extensions={
    "image/jpeg":"jpg",
    "image/png":"png",
    "image/webp":"webp",
    "image/gif":"gif"
  };


  return extensions[file?.type]
  ||
  "jpg";

}


function refreshIcons(){

  requestAnimationFrame(
    ()=>{

      if(window.lucide){

        lucide.createIcons();

      }

    }
  );

}


function money(value){

  return new Intl.NumberFormat(

    "en-US",

    {
      style:"currency",
      currency:"USD"
    }

  ).format(
    Number(value||0)
  );

}


function formatDate(value){

  if(!value){
    return "—";
  }

  try{

    return new Intl.DateTimeFormat(

      "uk-UA",

      {
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      }

    ).format(
      new Date(value)
    );

  }catch{

    return "—";

  }

}


function formatTime(value){

  if(!value){
    return "";
  }

  try{

    return new Intl.DateTimeFormat(

      "uk-UA",

      {
        hour:"2-digit",
        minute:"2-digit"
      }

    ).format(
      new Date(value)
    );

  }catch{

    return "";

  }

}


function fileSize(bytes){

  if(!bytes){
    return "0 KB";
  }

  if(
    bytes<
    1024*1024
  ){

    return (
      bytes/1024
    ).toFixed(1)
    +" KB";

  }

  return (
    bytes/(1024*1024)
  ).toFixed(1)
  +" MB";

}


function loginEmail(login){

  return (
    login
      .trim()
      .toLowerCase()

    +

    "@liptongram.app"
  );

}


function validLogin(value){

  return /^[A-Za-z0-9_]{3,24}$/
    .test(value);

}


function initials(profile){

  return (
    profile?.username
    ||
    profile?.login
    ||
    "LG"
  )
    .slice(0,2)
    .toUpperCase();

}


/* =====================================================
   ONLINE
===================================================== */

function isOnline(userId){

  if(!userId){
    return false;
  }

  if(
    userId===
    state.user?.id
  ){
    return true;
  }

  return state.onlineUsers
    .has(userId);

}


function presenceText(userId){

  return isOnline(userId)
    ?"В мережі"
    :"Не в мережі";

}


function avatar(
  profile,
  large=false
){

  if(
    profile?.avatar_url
  ){

    return `
      <div
        class="
          avatar
          ${large?"large":""}
        "

        data-initials="${esc(
          initials(profile)
        )}"
      >
        <img
          src="${esc(
            profile.avatar_url
          )}"
          alt="Аватар ${esc(
            profile.username
            ||
            profile.login
            ||
            "користувача"
          )}"

          onerror="
            const parent=this.parentElement;
            const value=parent.dataset.initials||'LG';
            this.remove();
            parent.textContent=value
          "
        >
      </div>
    `;

  }

  return `
    <div
      class="
        avatar
        ${large?"large":""}
      "
    >
      ${esc(
        initials(profile)
      )}
    </div>
  `;

}


function avatarStatus(
  profile,
  large=false
){

  const id=
    profile?.id||"";

  const online=
    isOnline(id);

  return `
    <div
      class="
        avatar-status-wrap
        ${large?"large":""}
      "
    >

      ${avatar(
        profile,
        large
      )}

      <span
        class="
          presence-dot
          ${online?"online":"offline"}
        "

        data-presence-dot="${esc(id)}"
      ></span>

    </div>
  `;

}


function presenceLabel(userId){

  const online=
    isOnline(userId);

  return `
    <span
      class="
        presence-text
        ${online?"online":""}
      "

      data-presence-text="${esc(
        userId||""
      )}"
    >

      <span
        class="presence-mini-dot"
      ></span>

      <span
        class="presence-label-value"
      >
        ${
          online
            ?"В мережі"
            :"Не в мережі"
        }
      </span>

    </span>
  `;

}


function refreshOnlineIndicators(){

  qsa(
    "[data-presence-dot]"
  )
    .forEach(
      dot=>{

        const id=
          dot.dataset
            .presenceDot;

        const online=
          isOnline(id);

        dot.classList
          .toggle(
            "online",
            online
          );

        dot.classList
          .toggle(
            "offline",
            !online
          );

      }
    );


  qsa(
    "[data-presence-text]"
  )
    .forEach(
      element=>{

        const id=
          element.dataset
            .presenceText;

        const online=
          isOnline(id);

        element.classList
          .toggle(
            "online",
            online
          );

        const text=
          element
            .querySelector(
              ".presence-label-value"
            );

        if(text){

          text.textContent=
            online
              ?"В мережі"
              :"Не в мережі";

        }

      }
    );

}


async function stopPresence(){

  if(
    state.presenceChannel
  ){

    try{

      await state
        .presenceChannel
        .untrack();

    }catch{}


    try{

      await sb.removeChannel(
        state.presenceChannel
      );

    }catch{}


    state.presenceChannel=
      null;

  }


  state.onlineUsers=
    new Set();

}


async function startPresence(){

  if(!state.user){
    return;
  }


  const activeUser=
    state.user;


  await stopPresence();


  if(
    state.user?.id!==
    activeUser.id
  ){

    return;

  }


  const channel=
    sb.channel(

      "liptongram-online",

      {
        config:{
          presence:{
            key:
              activeUser.id
          }
        }
      }

    );


  state.presenceChannel=
    channel;


  function sync(){

    const presenceState=
      channel
        .presenceState();


    state.onlineUsers=
      new Set(
        Object.keys(
          presenceState
        )
      );


    refreshOnlineIndicators();

  }


  channel.on(

    "presence",

    {
      event:"sync"
    },

    sync

  );


  channel.on(

    "presence",

    {
      event:"join"
    },

    sync

  );


  channel.on(

    "presence",

    {
      event:"leave"
    },

    sync

  );


  channel.subscribe(

    async status=>{

      if(
        status===
        "SUBSCRIBED"
      ){

        await channel.track({

          user_id:
            activeUser.id,

          username:
            state.profile
              ?.username
            ||
            state.profile
              ?.login
            ||
            "user",

          online_at:
            new Date()
              .toISOString()

        });

      }

    }

  );

}


/* =====================================================
   LOGO
===================================================== */

function logoMarkup(
  className="brand-logo"
){

  if(state.logoUrl){

    return `
      <div class="${className}">

        <img
          src="${esc(
            state.logoUrl
          )}"
          alt="Логотип LiptonGram"

          onerror="
            this.remove();
            this.parentElement.textContent='L'
          "
        >

      </div>
    `;

  }

  return `
    <div class="${className}">
      L
    </div>
  `;

}


/* =====================================================
   TOAST / MODAL
===================================================== */

function toast(
  text,
  type=""
){

  const root=
    qs("#toasts");

  const div=
    document.createElement(
      "div"
    );

  div.className=
    "toast";

  let icon=
    "info";

  if(type==="error"){
    icon=
      "circle-alert";
  }

  if(type==="success"){
    icon=
      "circle-check";
  }

  div.innerHTML=`
    <i
      data-lucide="${icon}"
      class="icon-sm"
    ></i>

    <span>
      ${esc(text)}
    </span>
  `;

  root.appendChild(div);

  refreshIcons();

  setTimeout(
    ()=>{

      div.style.opacity="0";

      div.style.transform=
        "translateY(6px)";

      setTimeout(
        ()=>div.remove(),
        200
      );

    },
    3000
  );

}


function modal(
  title,
  content
){

  state.modalReturnFocus=
    document.activeElement;

  qs("#modalRoot")
    .innerHTML=`

      <div
        class="modal-bg"

        onclick="
          if(
            event.target===this
          ){
            closeModal()
          }
        "
      >

        <div
          class="modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modalTitle"
        >

          <div class="modal-head">

            <h3
              id="modalTitle"
              class="modal-title"
            >
              ${esc(title)}
            </h3>

            <button
              type="button"

              class="icon-btn"

              aria-label="Закрити"

              onclick="
                closeModal()
              "
            >

              <i
                data-lucide="x"
                class="icon-sm"
              ></i>

            </button>

          </div>

          <div class="modal-body">
            ${content}
          </div>

        </div>

      </div>
    `;

  refreshIcons();

  refreshOnlineIndicators();

  syncOverlayState();

  requestAnimationFrame(
    ()=>{

      const focusTarget=
        qs("#modalRoot .modal-body input:not([type='hidden']), #modalRoot .modal-body textarea, #modalRoot .modal-body button")
        ||
        qs("#modalRoot button");

      focusTarget?.focus();

    }
  );

}


function closeModal(){

  qs("#modalRoot")
    .innerHTML="";

  syncOverlayState();

  if(
    state.modalReturnFocus
    &&
    document.contains(
      state.modalReturnFocus
    )
  ){

    state.modalReturnFocus
      .focus();

  }

  state.modalReturnFocus=
    null;

}


function setLoading(
  button,
  loading
){

  if(!button){
    return;
  }

  button.disabled=
    loading;

  if(loading){

    button.dataset.oldHtml=
      button.innerHTML;

    button.innerHTML=`
      <i
        data-lucide="loader-circle"
        class="icon-sm spin"
      ></i>
    `;

  }else{

    if(
      button.dataset.oldHtml
    ){

      button.innerHTML=
        button.dataset.oldHtml;

    }

  }

  refreshIcons();

}


/* =====================================================
   IMAGE VIEWER
===================================================== */

function openImageViewer(url){

  if(!url){
    return;
  }

  qs("#imageViewerRoot")
    .innerHTML=`

      <div
        class="image-viewer-bg"

        onclick="
          if(
            event.target===this
          ){
            closeImageViewer()
          }
        "
      >

        <div
          class="image-viewer"
          role="dialog"
          aria-modal="true"
          aria-label="Перегляд фото"

async function loadBranding(){

  try{

    const {data}=
      await sb
        .from(
          "app_settings"
        )
        .select(
          "logo_url"
        )
        .eq(
          "id",
          1
        )
        .maybeSingle();

    state.logoUrl=
      data?.logo_url
      ||
      null;

  }catch{

    state.logoUrl=null;

  }

}


async function applyAuthStateChange(
  event,
  session,
  version
){

  if(
    version!==
    state.authEventVersion
  ){
    return;
  }


  const previousUserId=
    state.user?.id
    ||
    null;


  state.session=
    session;

  state.user=
    session?.user
    ||
    null;


  const sameUser=
    previousUserId===
    state.user?.id;


  if(
    state.user
    &&
    sameUser
    &&
    state.profile
    &&
    event!=="USER_UPDATED"
  ){

    return;

  }


  if(state.user){

    await loadMe();


    if(
      version!==
      state.authEventVersion
    ){
      return;
    }


    await startPresence();

  }else{

    await stopPresence();

    await stopChatChannel();

    state.profile=
      null;

    state.wallet={
      balance:0
    };

    state.page=
      "chats";

    state.activeConversation=
      null;

    state.activeChatUser=
      null;

    state.messages=[];

    state.mobileChatOpen=
      false;

  }


  if(
    version===
    state.authEventVersion
  ){

    render();

  }

}


async function init(){

  if(!sb){

    qs("#app")
      .innerHTML=`
        <main class="auth-page">
          <section class="auth-card page-animation">
            ${logoMarkup("auth-logo")}
            <h1 class="auth-title">
              LiptonGram
            </h1>
            <div class="auth-sub">
              Не вдалося завантажити компоненти сайту.
            </div>
            <button
              type="button"
              class="btn btn-primary"
              style="width:100%"
              onclick="location.reload()"
            >
              Спробувати ще раз
            </button>
          </section>
        </main>
      `;

    return;

  }


  try{

    await loadBranding();


    const {
      data:{
        session
      }
    }=
      await sb.auth
        .getSession();


    state.session=
      session;


    state.user=
      session?.user
      ||
      null;


    if(state.user){

      await loadMe();

      await startPresence();

    }

  }catch(error){

    console.error(
      "INIT ERROR",
      error
    );

    state.session=
      null;

    state.user=
      null;

  }

  render();


  sb.auth
    .onAuthStateChange(

      (
        event,
        session
      )=>{

        const version=
          ++state.authEventVersion;


        setTimeout(
          ()=>{

            applyAuthStateChange(
              event,
              session,
              version
            )
              .catch(
                error=>{

                  console.error(
                    "AUTH STATE ERROR",
                    error
                  );

                  toast(
                    "Не вдалося оновити сесію",
                    "error"
                  );

                }
              );

          },
          0
        );

      }

    );

}

async function loadMe(){

  if(!state.user){
    return;
  }

  try{

    try{

      await sb.rpc(
        "ensure_my_profile"
      );

    }catch(error){

      console.warn(
        "ensure_my_profile",
        error
      );

    }


    const {
      data:profile,
      error:profileError
    }=
      await sb
        .from("profiles")
        .select("*")
        .eq(
          "id",
          state.user.id
        )
        .maybeSingle();


    if(profileError){

      console.error(
        profileError
      );

    }


    if(profile){

      state.profile=
        profile;

    }else{

      const login=
        state.user
          .user_metadata
          ?.login

        ||

        state.user
          .email
          ?.split("@")[0]

        ||

        "user";


      state.profile={

        id:
          state.user.id,

        login,

        username:
          login,

        public_id:
          "------",

        avatar_url:
          null,

        banner_url:
          null,

        role:
          "user",

        created_at:
          state.user.created_at

      };

    }


    const {
      data:wallet
    }=
      await sb
        .from("wallets")
        .select("*")
        .eq(
          "user_id",
          state.user.id
        )
        .maybeSingle();


    state.wallet=
      wallet
      ||
      {
        balance:0
      };


  }catch(error){

    console.error(
      "LOAD PROFILE ERROR",
      error
    );

  }

}

async function signIn(){

  const login=
    qs("#authLogin")
      .value
      .trim();

  const password=
    qs("#authPassword")
      .value;


  if(
    !validLogin(login)
  ){

    toast(
      "Неправильний логін",
      "error"
    );

    return;

  }


  if(!password){

    toast(
      "Введіть пароль",
      "error"
    );

    return;

  }


  const button=
    qs("#authButton");

  setLoading(
    button,
    true
  );


  try{

    const {error}=
      await sb.auth
        .signInWithPassword({

          email:
            loginEmail(login),

          password

        });


    if(error){

      toast(
        "Невірний логін або пароль",
        "error"
      );

    }

  }catch(error){

    console.error(
      "SIGN IN ERROR",
      error
    );

    toast(
      "Немає з'єднання. Спробуйте ще раз",
      "error"
    );

  }finally{

    setLoading(
      button,
      false
    );

  }

}


async function signUp(){

  const login=
    qs("#authLogin")
      .value
      .trim();

  const password=
    qs("#authPassword")
      .value;


  if(
    !validLogin(login)
  ){

    toast(
      "Логін: 3–24 символи, букви, цифри або _",
      "error"
    );

    return;

  }


  if(
    !password
    ||
    password.length<8
  ){

    toast(
      "Пароль мінімум 8 символів",
      "error"
    );

    return;

  }


  const button=
    qs("#authButton");

  setLoading(
    button,
    true
  );


  try{

    const {
      data,
      error
    }=
      await sb.auth
        .signUp({

          email:
            loginEmail(login),

          password,

          options:{
            data:{
              login
            }
          }

        });


    if(error){

      const message=
        error.message
          ?.toLowerCase()
          .includes("already")

          ?"Такий логін уже зареєстрований"

          :error.message;


      toast(
        message
        ||
        "Не вдалося створити акаунт",
        "error"
      );

      return;

    }


    if(!data.session){

      toast(
        "Підтвердження email увімкнене в Supabase",
        "error"
      );

      return;

    }


    toast(
      "Акаунт створено",
      "success"
    );

  }catch(error){

    console.error(
      "SIGN UP ERROR",
      error
    );

    toast(
      "Немає з'єднання. Спробуйте ще раз",
      "error"
    );

  }finally{

    setLoading(
      button,
      false
    );

  }

}


async function logout(){

  await stopTyping();

  await stopChatChannel();

  await stopPresence();

  await sb.auth
    .signOut();

}

    page==="admin"

  if(
    state.page==="chats"
    &&
    page!=="chats"
  ){

    stopTyping();

    state.chatOpenRequest++;

  }


  state.page=
    page;


  render();

    renderProfile();

  }


  if(
    state.page==="admin"
  ){

    renderAdmin();

  }

async function uploadProfileImage(
  file,
  prefix
){

  if(!file){
    return null;
  }


  const allowed=[
    "image/jpeg",
    "image/png",
    "image/webp",
    "image/gif"
  ];


  if(
    !allowed.includes(
      file.type
    )
  ){

    throw new Error(
      "Дозволені JPG, PNG, WEBP або GIF"
    );

  }


  if(
    file.size>
    8*1024*1024
  ){

    throw new Error(
      "Зображення занадто велике"
    );

  }


  const extension=
    imageExtension(file);


  const path=
    `${
      state.user.id
    }/${
      prefix
    }-${
      Date.now()
    }.${extension}`;


  const {error}=
    await sb.storage

      .from("profiles")

      .upload(

        path,

        file,

        {
          upsert:true
        }

      );


  if(error){

    throw error;

  }


  const {data}=
    sb.storage

      .from("profiles")

      .getPublicUrl(path);


  return data.publicUrl;

}


async function saveProfile(){

  const button=
    qs("#profileSaveButton");


  const username=
    qs("#editUsername")
      .value
      .trim();


  const publicId=
    qs("#editPublicId")
      .value
      .trim();


  if(
    !/^[A-Za-z0-9_]{3,24}$/
      .test(username)
  ){

    toast(
      "Username: 3–24 символи, букви, цифри або _",
      "error"
    );

    return;

  }


  if(
    !/^\d{6}$/
      .test(publicId)
  ){

    toast(
      "ID повинен містити рівно 6 цифр",
      "error"
    );

    return;

  }


  setLoading(
    button,
    true
  );


  try{

    let avatarUrl=
      state.profile?.avatar_url
      ||
      null;


    let bannerUrl=
      state.profile?.banner_url
      ||
      null;


    const avatarFile=
      qs("#avatarFile")
        ?.files?.[0];


    const bannerFile=
      qs("#bannerFile")
        ?.files?.[0];


    if(avatarFile){

      avatarUrl=
        await uploadProfileImage(
          avatarFile,
          "avatar"
        );

    }


    if(bannerFile){

      bannerUrl=
        await uploadProfileImage(
          bannerFile,
          "banner"
        );

    }


    const {
      data,
      error
    }=
      await sb

        .from("profiles")

        .upsert({

          id:
            state.user.id,

          login:
            state.profile?.login
            ||
            state.user
              .user_metadata
              ?.login
            ||
            state.user
              .email
              ?.split("@")[0]
            ||
            "user",

          username,

          public_id:
            publicId,

          avatar_url:
            avatarUrl,

          banner_url:
            bannerUrl,

          updated_at:
            new Date()
              .toISOString()

        },{
          onConflict:"id"
        })

        .select()

        .single();


    if(error){

      throw error;

    }


    state.profile=
      data;


    if(
      state.presenceChannel
    ){

      try{

        await state
          .presenceChannel
          .track({

            user_id:
              state.user.id,

            username:
              state.profile.username,

            online_at:
              new Date()
                .toISOString()

          });

      }catch{}

    }


    closeModal();

    render();


    toast(
      "Профіль збережено",
      "success"
    );


  }catch(error){

    console.error(error);


    const message=
      String(
        error?.message
        ||
        ""
      )
        .toLowerCase();


    if(
      message.includes(
        "duplicate"
      )
      ||
      message.includes(
        "unique"
      )
    ){

      toast(
        "Такий Username або ID уже зайнятий",
        "error"
      );

    }else{

      toast(
        error.message
        ||
        "Не вдалося зберегти профіль",
        "error"
      );

    }

  }finally{

    setLoading(
      button,
      false
    );

  }

}

  clearTimeout(
    searchTimer
  );

    setTimeout(
      ()=>runUserSearch(
        value
      ),
      250
    );

}


async function runUserSearch(value){

  const root=
    qs("#userResults");


  if(!root){
    return;
  }


  const query=
    value.trim();


  const requestId=
    ++state.userSearchRequest;


  if(
    query.length<2
  ){

    root.innerHTML="";

    return;

  }


  let request=
    sb
      .from("profiles")

      .select(
        "id,login,username,public_id,avatar_url,banner_url,created_at"
      )

      .neq(
        "id",
        state.user.id
      )

      .limit(15);


  if(
    /^\d{6}$/
      .test(query)
  ){

    request=
      request.eq(
        "public_id",
        query
      );

  }else{

    const safe=
      query.replace(
        /[^A-Za-z0-9_]/g,
        ""
      );


    if(safe.length<2){

      root.innerHTML=`
        <div class="empty">
          <strong>
            Введіть щонайменше 2 допустимі символи
          </strong>
        </div>
      `;

      return;

    }


    request=
      request.ilike(
        "username",
        `%${safe}%`
      );

  }


  const {
    data,
    error
  }=
    await request;


  if(
    requestId!==
    state.userSearchRequest
    ||
    root!==qs("#userResults")
  ){

    return;

  }


  if(error){

    console.error(error);

    root.innerHTML=`
      <div class="empty">
        <strong>
          Не вдалося виконати пошук
        </strong>
        <p>
          Перевірте з'єднання та спробуйте ще раз.
        </p>
      </div>
    `;

    return;

  }


  if(
    !data?.length
  ){

    root.innerHTML=`
      <div class="empty">

        <strong>
          Нічого не знайдено
        </strong>

      </div>
    `;

    return;

  }


  root.innerHTML=
    data
      .map(
        user=>`

          <div
            class="chat-item"

            style="
              cursor:default
            "
          >

            <div
              onclick="
                openPublicProfile(
                  '${user.id}'
                )
              "

              style="
                cursor:pointer
              "
            >

              ${avatarStatus(user)}

            </div>


            <div
              class="chat-item-content"

              onclick="
                openPublicProfile(
                  '${user.id}'
                )
              "

              style="
                cursor:pointer
              "
            >

              <div class="chat-name">
                ${esc(
                  user.username
                )}
              </div>

              <div class="chat-preview">

                ${presenceLabel(
                  user.id
                )}

                <span
                  style="
                    margin-left:6px
                  "
                >
                  ID
                  ${esc(
                    user.public_id
                  )}
                </span>

              </div>

            </div>


            <button
              class="icon-btn"

              onclick="
                createChat(
                  '${user.id}'
                )
              "
            >

              <i
                data-lucide="message-circle"
                class="icon-sm"
              ></i>

            </button>

          </div>
        `
      )
      .join("");


  refreshIcons();

  refreshOnlineIndicators();

}

async function createSignedImageUrl(
  path
){

  if(!path){
    return null;
  }


  try{

    const {
      data,
      error
    }=
      await sb.storage

        .from("chat-media")

        .createSignedUrl(
          path,
          60*60
        );


    if(error){

      throw error;

    }


    return data?.signedUrl
    ||
    null;


  }catch(error){

    console.error(
      "SIGNED IMAGE ERROR",
      error
    );

    return null;

  }

}


async function hydrateMessageMedia(
  message
){

  if(
    !message?.image_path
  ){

    return message;

  }


  if(
    message._imageUrl
  ){

    return message;

  }


  const url=
    await createSignedImageUrl(
      message.image_path
    );


  return {
    ...message,
    _imageUrl:url
  };

}


async function refreshImageMessage(
  imageElement,
  messageId,
  imagePath
){

  if(!imagePath){
    return;
  }


  const freshUrl=
    await createSignedImageUrl(
      imagePath
    );


  if(!freshUrl){
    return;
  }


  state.messages=
    state.messages.map(
      message=>

        message.id===messageId

          ?{
              ...message,
              _imageUrl:freshUrl
            }

          :message
    );


  if(imageElement){

    imageElement.src=
      freshUrl;

  }

}


async function uploadChatImage(
  file,
  conversationId=
    state.activeConversation?.id
){

  if(
    !conversationId
  ){

    throw new Error(
      "Чат не відкрито"
    );

  }


  const allowed=[
    "image/jpeg",
    "image/png",
    "image/webp",
    "image/gif"
  ];


  if(
    !allowed.includes(
      file.type
    )
  ){

    throw new Error(
      "Дозволені JPG, PNG, WEBP або GIF"
    );

  }


  if(
    file.size>
    8*1024*1024
  ){

    throw new Error(
      "Фото має бути до 8 МБ"
    );

  }


  let ext=
    file.name
      .split(".")
      .pop()
      ?.toLowerCase();


  if(
    !ext
    ||
    ext.length>6
  ){

    ext="jpg";

  }


  const path=
    `${
      conversationId
    }/${
      state.user.id
    }/${
      crypto.randomUUID()
    }.${ext}`;


  const {error}=
    await sb.storage

      .from("chat-media")

      .upload(

        path,

        file,

        {
          cacheControl:"3600",
          upsert:false,
          contentType:
            file.type
        }

      );


  if(error){

    throw error;

  }


  return path;

}

function chooseChatImage(){

  const input=
    qs("#chatImageInput");


  if(input){

    input.value="";

    input.click();

  }

}


function handleChatImage(
  input
){

  const file=
    input?.files?.[0];


  if(!file){
    return;
  }


  const allowed=[
    "image/jpeg",
    "image/png",
    "image/webp",
    "image/gif"
  ];


  if(
    !allowed.includes(
      file.type
    )
  ){

    toast(
      "Можна надсилати JPG, PNG, WEBP або GIF",
      "error"
    );

    input.value="";

    return;

  }


  if(
    file.size>
    8*1024*1024
  ){

    toast(
      "Максимальний розмір фото — 8 МБ",
      "error"
    );

    input.value="";

    return;

  }


  clearSelectedImage();


  state.selectedImage=
    file;


  state.selectedImagePreview=
    URL.createObjectURL(
      file
    );


  updateComposerPreview();

}


function updateComposerPreview(){

  const root=
    qs("#composerPreview");


  if(!root){
    return;
  }


  if(
    !state.selectedImage
    ||
    !state.selectedImagePreview
  ){

    root.classList
      .remove(
        "visible"
      );

    root.innerHTML="";

    return;

  }


  root.innerHTML=`

    <div class="composer-image-card">

      <img
        class="composer-image-thumb"

        src="${esc(
          state.selectedImagePreview
        )}"

        alt=""
      >


      <div class="composer-image-info">

        <div class="composer-image-name">

          ${esc(
            state.selectedImage.name
          )}

        </div>

        <div class="composer-image-size">

          ${fileSize(
            state.selectedImage.size
          )}

        </div>

      </div>


      <button
        type="button"

        class="remove-image"

        onclick="
          clearSelectedImage()
        "
      >

        <i
          data-lucide="x"
          class="icon-sm"
        ></i>

      </button>

    </div>
  `;


  root.classList
    .add(
      "visible"
    );


  refreshIcons();

}


function clearSelectedImage(){

  if(
    state.selectedImagePreview
  ){

    try{

      URL.revokeObjectURL(
        state.selectedImagePreview
      );

    }catch{}

  }


  state.selectedImage=
    null;

  state.selectedImagePreview=
    null;


  const input=
    qs("#chatImageInput");


  if(input){

    input.value="";

  }


  updateComposerPreview();

}

function showTypingIndicator(
  userId,
  typing
){

  if(
    !state.activeChatUser
    ||
    userId!==
    state.activeChatUser.id
  ){

    return;

  }


  const indicator=
    qs("#typingIndicator");


  const text=
    qs("#typingText");


  if(!indicator){
    return;
  }


  if(
    state.typingHideTimer
  ){

    clearTimeout(
      state.typingHideTimer
    );

  }


  if(typing){

    state.typingUserId=
      userId;


    if(text){

      text.textContent=
        `${
          state.activeChatUser
            ?.username
          ||
          "Користувач"
        } друкує`;

    }


    indicator.classList
      .add(
        "visible"
      );


    state.typingHideTimer=
      setTimeout(
        ()=>{

          showTypingIndicator(
            userId,
            false
          );

      );


  }else{

    state.typingUserId=
      null;

    indicator.classList
      .remove(
        "visible"
      );

  }

async function broadcastTyping(
  typing
){

  if(
    !state.messageChannel
    ||
    !state.chatChannelReady
    ||
    !state.activeConversation
  ){

    return;

  }


  try{

    await state.messageChannel
      .send({

        type:"broadcast",

        event:"typing",

        payload:{

          user_id:
            state.user.id,

          conversation_id:
            state.activeConversation.id,

          typing:
            Boolean(typing)

        }

      });

  }catch(error){

    console.warn(
      "TYPING SEND",
      error
    );

  }

}


function composerTyping(){

  if(
    !state.activeConversation
  ){

    return;

  }


  if(
    !state.typingActive
  ){

    state.typingActive=
      true;

    broadcastTyping(
      true
    );

  }


  if(
    state.typingSendTimer
  ){

    clearTimeout(
      state.typingSendTimer
    );

  }


  state.typingSendTimer=
    setTimeout(
      ()=>{

        stopTyping();

      },
      1300
    );

}


async function stopTyping(){

  if(
    state.typingSendTimer
  ){

    clearTimeout(
      state.typingSendTimer
    );

    state.typingSendTimer=
      null;

  }


  if(
    state.typingActive
  ){

    state.typingActive=
      false;

    await broadcastTyping(
      false
    );

  }

}
