<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5c518" />

  <title>LiptonGram</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #080808;
      --bg-soft: #101010;
      --panel: #141414;
      --panel-2: #191919;
      --panel-3: #212121;

      --text: #ffffff;
      --muted: #939393;
      --muted-2: #666666;

      --yellow: #f5c518;
      --yellow-2: #ffd84b;
      --yellow-dark: #bd9400;

      --danger: #ff5353;
      --success: #45d483;

      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);

      --shadow:
        0 18px 50px rgba(0,0,0,.28),
        0 2px 8px rgba(0,0,0,.18);

      --radius: 20px;
      --radius-sm: 14px;

      --sidebar: 270px;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          900px 450px at 50% -150px,
          rgba(245, 197, 24, .13),
          transparent 70%
        ),
        var(--bg);

      color: var(--text);

      overflow-x: hidden;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    input::placeholder,
    textarea::placeholder {
      color: #666;
    }

    ::selection {
      background: rgba(245,197,24,.35);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #292929;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    .hidden {
      display: none !important;
    }

    .icon {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }

    .icon-sm {
      width: 17px;
      height: 17px;
    }

    .icon-lg {
      width: 25px;
      height: 25px;
    }

    .spin {
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-animation {
      animation: fadeIn .24s ease both;
    }


    /* =========================================================
       BUTTONS
    ========================================================= */

    .btn {
      border: 0;
      outline: none;

      min-height: 44px;

      padding: 0 18px;

      border-radius: 14px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      cursor: pointer;

      font-weight: 700;

      transition:
        transform .16s ease,
        background .16s ease,
        border-color .16s ease,
        opacity .16s ease;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background:
        linear-gradient(
          135deg,
          var(--yellow-2),
          var(--yellow)
        );

      color: #111;
    }

    .btn-primary:hover {
      filter: brightness(1.04);
    }

    .btn-secondary {
      background: #1c1c1c;
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #232323;
      border-color: var(--border-hover);
    }

    .btn-danger {
      background: rgba(255, 83, 83, .1);
      border: 1px solid rgba(255,83,83,.2);
      color: #ff7777;
    }

    .icon-btn {
      width: 44px;
      height: 44px;

      flex: 0 0 44px;

      border: 1px solid var(--border);

      border-radius: 14px;

      background: #181818;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      transition:
        .16s ease background,
        .16s ease transform,
        .16s ease border-color;
    }

    .icon-btn:hover {
      background: #222;
      border-color: var(--border-hover);
    }

    .icon-btn:active {
      transform: scale(.95);
    }


    /* =========================================================
       INPUTS
    ========================================================= */

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 13px;
      color: #b7b7b7;
      font-weight: 700;
    }

    .input {
      width: 100%;
      height: 48px;

      border: 1px solid var(--border);
      outline: none;

      border-radius: 14px;

      padding: 0 15px;

      background: #111;

      color: white;

      transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }

    textarea.input {
      height: auto;
      min-height: 100px;

      padding-top: 13px;
      padding-bottom: 13px;

      resize: vertical;
    }

    .input:focus {
      border-color: rgba(245,197,24,.6);

      box-shadow:
        0 0 0 4px rgba(245,197,24,.08);

      background: #131313;
    }


    /* =========================================================
       AUTH
    ========================================================= */

    .auth-page {
      min-height: 100vh;
      min-height: 100dvh;

      padding: 24px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      width: min(430px, 100%);

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.015)
        );

      border: 1px solid var(--border);

      border-radius: 28px;

      padding: 30px;

      box-shadow: var(--shadow);

      backdrop-filter: blur(20px);
    }

    .auth-logo {
      width: 70px;
      height: 70px;

      margin: 0 auto 20px;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          #ffe368,
          #eab900
        );

      color: #111;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 27px;
      font-weight: 900;

      overflow: hidden;

      box-shadow:
        0 12px 40px rgba(245,197,24,.18);
    }

    .auth-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .auth-title {
      text-align: center;
      font-size: 30px;
      font-weight: 850;
      letter-spacing: -.8px;
      margin: 0;
    }

    .auth-subtitle {
      text-align: center;
      color: var(--muted);
      line-height: 1.5;
      margin: 8px 0 28px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;

      padding: 4px;

      background: #101010;

      border: 1px solid var(--border);

      border-radius: 15px;

      margin-bottom: 22px;
    }

    .auth-tab {
      height: 40px;

      border: 0;

      background: transparent;

      color: #777;

      border-radius: 11px;

      cursor: pointer;

      font-weight: 750;

      transition: .18s ease;
    }

    .auth-tab.active {
      background: #202020;
      color: white;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }


    /* =========================================================
       APP
    ========================================================= */

    .app-layout {
      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
    }


    /* =========================================================
       SIDEBAR
    ========================================================= */

    .sidebar {
      height: 100vh;
      height: 100dvh;

      position: sticky;
      top: 0;

      border-right: 1px solid var(--border);

      background:
        rgba(10,10,10,.82);

      backdrop-filter: blur(18px);

      padding:
        20px 14px
        max(20px, env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;

      z-index: 40;
    }

    .brand {
      height: 58px;

      padding: 0 9px;

      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 15px;
    }

    .brand-logo {
      width: 41px;
      height: 41px;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          var(--yellow-2),
          var(--yellow)
        );

      display: flex;
      align-items: center;
      justify-content: center;

      color: #111;

      font-weight: 900;
      font-size: 19px;

      overflow: hidden;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-name {
      font-weight: 850;
      font-size: 19px;
      letter-spacing: -.4px;
    }

    .side-nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .side-nav-item {
      border: 0;

      width: 100%;
      height: 49px;

      padding: 0 14px;

      border-radius: 14px;

      background: transparent;

      color: #8b8b8b;

      display: flex;
      align-items: center;
      gap: 13px;

      font-size: 14px;
      font-weight: 760;

      cursor: pointer;

      transition: .16s ease;
    }

    .side-nav-item:hover {
      background: #151515;
      color: #ddd;
    }

    .side-nav-item.active {
      color: #111;

      background:
        linear-gradient(
          135deg,
          var(--yellow-2),
          var(--yellow)
        );
    }

    .sidebar-spacer {
      flex: 1;
    }

    .side-profile {
      border: 1px solid var(--border);

      border-radius: 17px;

      padding: 10px;

      display: flex;
      align-items: center;
      gap: 10px;

      background: #111;

      overflow: hidden;
    }

    .side-profile-info {
      min-width: 0;
      flex: 1;
    }

    .side-profile-name {
      font-size: 13px;
      font-weight: 760;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .side-profile-id {
      margin-top: 2px;

      color: var(--muted);

      font-size: 11px;
    }


    /* =========================================================
       MAIN
    ========================================================= */

    .main-area {
      min-width: 0;
    }

    .page {
      width: min(1180px, 100%);
      margin: 0 auto;

      padding:
        26px
        26px
        40px;
    }

    .page-head {
      min-height: 55px;

      margin-bottom: 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .page-title {
      margin: 0;

      font-size: 27px;
      font-weight: 850;
      letter-spacing: -.7px;
    }

    .page-description {
      color: var(--muted);

      font-size: 13px;

      margin-top: 5px;
    }


    /* =========================================================
       GENERIC
    ========================================================= */

    .card {
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.025),
          rgba(255,255,255,.01)
        );

      border: 1px solid var(--border);

      border-radius: var(--radius);

      box-shadow: var(--shadow);
    }

    .avatar {
      width: 43px;
      height: 43px;

      flex: 0 0 43px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #2b2b2b,
          #1b1b1b
        );

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      color: #c8c8c8;

      font-weight: 800;

      border: 1px solid rgba(255,255,255,.08);
    }

    .avatar.large {
      width: 105px;
      height: 105px;

      flex: 0 0 105px;

      font-size: 32px;

      border: 4px solid #101010;
    }

    .avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .empty {
      min-height: 260px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-direction: column;

      text-align: center;

      color: var(--muted);

      padding: 35px;
    }

    .empty-icon {
      width: 54px;
      height: 54px;

      border-radius: 17px;

      margin-bottom: 15px;

      background: #191919;
      border: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty strong {
      color: white;
      font-size: 16px;
    }

    .empty p {
      max-width: 400px;
      margin: 7px 0 0;

      line-height: 1.5;
      font-size: 13px;
    }


    /* =========================================================
       BALANCE
    ========================================================= */

    .balance-pill {
      min-height: 43px;

      border-radius: 14px;

      padding: 5px 6px 5px 14px;

      background: #151515;
      border: 1px solid var(--border);

      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .balance-amount {
      font-size: 14px;
      font-weight: 800;
    }

    .balance-plus {
      width: 32px;
      height: 32px;

      border: 0;

      border-radius: 10px;

      background: var(--yellow);

      color: #111;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    /* =========================================================
       CHATS
    ========================================================= */

    .chat-layout {
      height: calc(100vh - 52px);
      height: calc(100dvh - 52px);

      padding: 26px;

      display: grid;
      grid-template-columns: 340px minmax(0,1fr);
      gap: 16px;
    }

    .chat-sidebar,
    .chat-window {
      min-height: 0;
      overflow: hidden;
    }

    .chat-sidebar {
      display: flex;
      flex-direction: column;
    }

    .chat-sidebar-head {
      padding: 19px;

      border-bottom: 1px solid var(--border);
    }

    .chat-sidebar-title {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 15px;
    }

    .chat-sidebar-title h2 {
      margin: 0;
      font-size: 22px;
    }

    .search-box {
      position: relative;
    }

    .search-box .icon {
      position: absolute;
      left: 13px;
      top: 50%;

      transform: translateY(-50%);

      color: #626262;

      pointer-events: none;
    }

    .search-box .input {
      padding-left: 40px;
      height: 43px;
    }

    .chat-list {
      min-height: 0;
      overflow: auto;
      flex: 1;

      padding: 7px;
    }

    .chat-list-item {
      width: 100%;

      border: 0;

      border-radius: 15px;

      padding: 10px;

      background: transparent;

      display: flex;
      align-items: center;
      gap: 11px;

      cursor: pointer;

      color: white;

      text-align: left;

      transition: .15s ease;
    }

    .chat-list-item:hover {
      background: #171717;
    }

    .chat-list-item.active {
      background: #202020;
    }

    .chat-item-body {
      flex: 1;
      min-width: 0;
    }

    .chat-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .chat-item-name {
      font-size: 13px;
      font-weight: 780;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item-time {
      color: #656565;
      font-size: 10px;
      white-space: nowrap;
    }

    .chat-item-message {
      margin-top: 4px;

      color: #777;

      font-size: 12px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-window {
      display: flex;
      flex-direction: column;
    }

    .chat-head {
      height: 69px;
      flex: 0 0 69px;

      border-bottom: 1px solid var(--border);

      padding: 0 18px;

      display: flex;
      align-items: center;
      gap: 11px;
    }

    .chat-head-name {
      font-size: 14px;
      font-weight: 800;
    }

    .chat-head-id {
      font-size: 11px;
      color: #777;

      margin-top: 2px;
    }

    .messages {
      min-height: 0;
      flex: 1;

      overflow-y: auto;

      padding: 21px;

      display: flex;
      flex-direction: column;
      gap: 8px;

      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message {
      max-width: min(570px, 80%);

      padding: 10px 13px 8px;

      border-radius: 17px;

      background: #202020;

      color: #eee;

      word-break: break-word;

      font-size: 14px;

      line-height: 1.45;
    }

    .message-row.mine .message {
      background:
        linear-gradient(
          135deg,
          #f4c51f,
          #eab608
        );

      color: #111;

      border-bottom-right-radius: 5px;
    }

    .message-row:not(.mine) .message {
      border-bottom-left-radius: 5px;
    }

    .message-meta {
      margin-top: 4px;

      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 5px;

      font-size: 9px;

      opacity: .58;
    }

    .composer {
      padding:
        12px
        14px
        max(12px, env(safe-area-inset-bottom));

      border-top: 1px solid var(--border);

      display: flex;
      align-items: flex-end;
      gap: 9px;

      background: rgba(13,13,13,.94);
      backdrop-filter: blur(15px);
    }

    .composer textarea {
      flex: 1;

      min-height: 44px;
      max-height: 140px;

      resize: none;

      border: 1px solid var(--border);
      outline: none;

      border-radius: 16px;

      padding: 11px 14px;

      background: #171717;

      color: white;

      line-height: 1.45;
    }

    .composer textarea:focus {
      border-color: rgba(245,197,24,.4);
    }

    .send-btn {
      width: 44px;
      height: 44px;

      flex: 0 0 44px;

      border: 0;
      border-radius: 14px;

      background: var(--yellow);

      color: #111;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: .15s ease;
    }

    .send-btn:active {
      transform: scale(.94);
    }


    /* =========================================================
       SEARCH USERS
    ========================================================= */

    .search-results {
      max-height: 390px;

      overflow: auto;

      margin-top: 10px;
    }

    .search-user {
      width: 100%;

      padding: 10px;

      border: 0;

      border-radius: 14px;

      background: transparent;

      display: flex;
      align-items: center;
      gap: 11px;

      color: white;

      cursor: pointer;

      text-align: left;
    }

    .search-user:hover {
      background: #1b1b1b;
    }


    /* =========================================================
       PROFILE
    ========================================================= */

    .profile-card {
      overflow: hidden;
    }

    .profile-banner {
      height: 240px;

      background:
        linear-gradient(
          120deg,
          #28220b,
          #4f3c00,
          #171717
        );

      background-size: cover;
      background-position: center;

      position: relative;
    }

    .profile-info {
      position: relative;

      padding: 0 25px 25px;

      display: flex;
      align-items: flex-end;
      gap: 20px;
    }

    .profile-avatar-wrap {
      margin-top: -50px;
      z-index: 3;
    }

    .profile-main {
      min-width: 0;
      flex: 1;

      padding-top: 17px;
    }

    .profile-username {
      margin: 0;

      font-size: 25px;
      font-weight: 850;
      letter-spacing: -.5px;

      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-login {
      color: var(--muted);

      font-size: 13px;

      margin-top: 5px;
    }

    .profile-tags {
      margin-top: 11px;

      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      min-height: 28px;

      padding: 0 9px;

      display: inline-flex;
      align-items: center;
      gap: 6px;

      border: 1px solid var(--border);

      border-radius: 9px;

      background: #171717;

      color: #b7b7b7;

      font-size: 11px;
    }

    .profile-actions {
      padding-top: 16px;

      display: flex;
      gap: 8px;
    }

    .profile-grid {
      margin-top: 16px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .stat-card {
      padding: 20px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
    }

    .stat-value {
      margin-top: 8px;

      font-size: 23px;
      font-weight: 850;
    }


    /* =========================================================
       SHOP
    ========================================================= */

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 14px;
    }

    .listing {
      padding: 18px;

      display: flex;
      flex-direction: column;

      min-height: 205px;
    }

    .listing-type {
      width: fit-content;

      padding: 5px 8px;

      border-radius: 8px;

      font-size: 10px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: .5px;

      color: var(--yellow);

      background: rgba(245,197,24,.09);
      border: 1px solid rgba(245,197,24,.14);
    }

    .listing-value {
      margin-top: 18px;

      font-size: 21px;
      font-weight: 850;

      word-break: break-word;
    }

    .listing-seller {
      margin-top: 5px;

      color: var(--muted);
      font-size: 12px;
    }

    .listing-spacer {
      flex: 1;
      min-height: 22px;
    }

    .listing-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .listing-price {
      font-size: 17px;
      font-weight: 850;
    }


    /* =========================================================
       ADMIN
    ========================================================= */

    .admin-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;

      margin-bottom: 16px;
    }

    .admin-tab {
      height: 39px;

      padding: 0 13px;

      border-radius: 11px;

      border: 1px solid var(--border);

      background: #151515;

      color: #858585;

      cursor: pointer;

      font-weight: 700;
      font-size: 12px;
    }

    .admin-tab.active {
      background: var(--yellow);
      border-color: var(--yellow);
      color: #111;
    }

    .admin-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 13px;

      margin-bottom: 15px;
    }

    .admin-stat {
      padding: 18px;
    }

    .admin-stat .number {
      margin-top: 8px;
      font-size: 24px;
      font-weight: 850;
    }

    .table-wrap {
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;

      font-size: 12px;
    }

    th {
      padding: 13px 15px;

      text-align: left;

      color: #777;

      font-weight: 700;

      border-bottom: 1px solid var(--border);

      white-space: nowrap;
    }

    td {
      padding: 12px 15px;

      border-bottom: 1px solid rgba(255,255,255,.05);

      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .role-badge {
      padding: 5px 7px;

      border-radius: 7px;

      font-size: 9px;
      font-weight: 850;

      background: #222;
      color: #aaa;
    }

    .role-badge.admin {
      background: rgba(245,197,24,.1);
      color: var(--yellow);
    }


    /* =========================================================
       MODAL
    ========================================================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;

      z-index: 1000;

      padding: 18px;

      background: rgba(0,0,0,.72);

      backdrop-filter: blur(9px);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      width: min(480px, 100%);

      max-height: min(700px, calc(100dvh - 36px));
      overflow: auto;

      background: #111;

      border: 1px solid rgba(255,255,255,.1);

      border-radius: 24px;

      box-shadow:
        0 30px 100px rgba(0,0,0,.55);

      animation: modalIn .2s ease both;
    }

    .modal-head {
      padding: 20px 20px 10px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .modal-title {
      margin: 0;

      font-size: 19px;
      font-weight: 850;
    }

    .modal-body {
      padding: 13px 20px 21px;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;

      margin-top: 5px;
    }


    /* =========================================================
       CARD PAYMENT
    ========================================================= */

    .payment-card {
      min-height: 185px;

      border-radius: 22px;

      padding: 21px;

      margin-bottom: 19px;

      background:
        radial-gradient(
          250px 120px at 90% 0,
          rgba(255,225,90,.3),
          transparent 60%
        ),
        linear-gradient(
          135deg,
          #2a250d,
          #15130b 55%,
          #0d0d0d
        );

      border: 1px solid rgba(245,197,24,.16);

      display: flex;
      flex-direction: column;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06);
    }

    .payment-chip {
      width: 37px;
      height: 28px;

      border-radius: 7px;

      background:
        linear-gradient(
          135deg,
          #e2c26f,
          #907728
        );

      margin-bottom: 29px;
    }

    .payment-number {
      letter-spacing: 2px;

      font-size: 17px;
      font-weight: 650;
    }

    .payment-bottom {
      margin-top: auto;

      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      font-size: 11px;
      color: #aaa;
    }

    .payment-error {
      padding: 12px;

      border-radius: 12px;

      margin-bottom: 13px;

      color: #ff7c7c;

      background: rgba(255,80,80,.08);
      border: 1px solid rgba(255,80,80,.16);

      font-size: 12px;
    }


    /* =========================================================
       TOASTS
    ========================================================= */

    #toastRoot {
      position: fixed;

      right: 18px;
      bottom: 18px;

      z-index: 2000;

      display: flex;
      flex-direction: column;
      gap: 8px;

      pointer-events: none;
    }

    .toast {
      width: min(350px, calc(100vw - 36px));

      padding: 12px 14px;

      border-radius: 14px;

      background: #1a1a1a;

      border: 1px solid var(--border);

      box-shadow: var(--shadow);

      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 12px;

      animation: toastIn .2s ease both;
    }

    .toast.error {
      border-color: rgba(255,83,83,.2);
    }

    .toast.success {
      border-color: rgba(69,212,131,.2);
    }


    /* =========================================================
       MOBILE BOTTOM NAV
    ========================================================= */

    .bottom-nav {
      display: none;
    }


    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 1000px) {
      :root {
        --sidebar: 84px;
      }

      .brand-name,
      .side-nav-item span,
      .side-profile-info {
        display: none;
      }

      .brand {
        justify-content: center;
      }

      .side-nav-item {
        justify-content: center;
        padding: 0;
      }

      .side-profile {
        justify-content: center;
      }

      .shop-grid {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }

      .admin-stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 760px) {
      .app-layout {
        display: block;
      }

      .sidebar {
        display: none;
      }

      .main-area {
        min-height: 100dvh;
        padding-bottom: 76px;
      }

      .bottom-nav {
        position: fixed;
        z-index: 80;

        display: grid;

        left: 10px;
        right: 10px;

        bottom:
          max(
            10px,
            env(safe-area-inset-bottom)
          );

        min-height: 62px;

        padding: 5px;

        border: 1px solid rgba(255,255,255,.09);

        border-radius: 20px;

        background: rgba(16,16,16,.9);

        backdrop-filter: blur(20px);

        box-shadow:
          0 16px 60px rgba(0,0,0,.45);
      }

      .bottom-nav.three {
        grid-template-columns: repeat(3, 1fr);
      }

      .bottom-nav.four {
        grid-template-columns: repeat(4, 1fr);
      }

      .bottom-nav-item {
        border: 0;
        background: transparent;

        border-radius: 15px;

        color: #757575;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        gap: 3px;

        font-size: 9px;
        font-weight: 760;

        cursor: pointer;
      }

      .bottom-nav-item.active {
        color: #111;
        background: var(--yellow);
      }

      .page {
        padding: 18px 14px 105px;
      }

      .page-head {
        align-items: flex-start;
      }

      .page-title {
        font-size: 24px;
      }

      .profile-banner {
        height: 180px;
      }

      .profile-info {
        padding:
          0 17px 19px;

        align-items: flex-start;
        flex-wrap: wrap;
      }

      .profile-main {
        flex-basis: calc(100% - 125px);
      }

      .profile-actions {
        width: 100%;
        padding-top: 0;
      }

      .profile-actions .btn {
        flex: 1;
      }

      .profile-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .shop-grid {
        grid-template-columns: 1fr;
      }

      .admin-stats {
        grid-template-columns: 1fr 1fr;
      }


      /* mobile chats */

      .chat-layout {
        height: calc(100dvh - 76px);

        padding: 0;

        display: block;
      }

      .chat-sidebar,
      .chat-window {
        border: 0;
        border-radius: 0;

        height: 100%;
      }

      .chat-sidebar.mobile-hidden,
      .chat-window.mobile-hidden {
        display: none;
      }

      .chat-sidebar-head {
        padding:
          17px 14px 14px;
      }

      .chat-list {
        padding: 7px;
      }

      .chat-head {
        padding: 0 12px;
      }

      .messages {
        padding: 14px 11px;
      }

      .message {
        max-width: 84%;
      }

      .composer {
        padding-bottom: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>


<body>

  <div id="app"></div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>


  <script>
    /* =========================================================
       SUPABASE
    ========================================================= */

    const SUPABASE_URL =
      "https://latgnxbzymbyngslzfko.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_9KKwvgywcvchh-s_FMSvbw_hx2LMgX-";

    const sb = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    /* =========================================================
       STATE
    ========================================================= */

    const state = {
      session: null,
      user: null,

      profile: null,
      wallet: null,

      logoUrl: null,

      page: "chats",

      conversations: [],
      messages: [],

      activeConversation: null,
      activeChatUser: null,

      chatChannel: null,

      listings: [],

      authMode: "login",

      adminTab: "dashboard",

      mobileChatOpen: false
    };


    /* =========================================================
       HELPERS
    ========================================================= */

    function qs(selector) {
      return document.querySelector(selector);
    }

    function qsa(selector) {
      return [...document.querySelectorAll(selector)];
    }

    function escapeHtml(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function money(value) {
      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD"
      }).format(Number(value || 0));
    }

    function formatDate(value) {
      if (!value) return "";

      return new Intl.DateTimeFormat("uk-UA", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }).format(new Date(value));
    }

    function formatTime(value) {
      if (!value) return "";

      return new Intl.DateTimeFormat("uk-UA", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(value));
    }

    function loginToEmail(login) {
      const normalized =
        login
          .trim()
          .toLowerCase();

      return `${normalized}@liptongram.app`;
    }

    function validateLogin(login) {
      return /^[A-Za-z0-9_]{3,24}$/.test(login);
    }

    function initials(profile) {
      return (
        profile?.username ||
        profile?.login ||
        "LG"
      )
        .slice(0, 2)
        .toUpperCase();
    }

    function avatar(profile, large = false) {
      if (profile?.avatar_url) {
        return `
          <div class="avatar ${large ? "large" : ""}">
            <img
              src="${escapeHtml(profile.avatar_url)}"
              alt=""
            >
          </div>
        `;
      }

      return `
        <div class="avatar ${large ? "large" : ""}">
          ${escapeHtml(initials(profile))}
        </div>
      `;
    }

    function refreshIcons() {
      requestAnimationFrame(() => {
        if (window.lucide) {
          lucide.createIcons();
        }
      });
    }

    function toast(text, type = "") {
      const root = qs("#toastRoot");

      const div =
        document.createElement("div");

      div.className =
        `toast ${type}`;

      const icon =
        type === "error"
          ? "circle-alert"
          : type === "success"
            ? "circle-check"
            : "info";

      div.innerHTML = `
        <i
          data-lucide="${icon}"
          class="icon icon-sm"
        ></i>

        <span>
          ${escapeHtml(text)}
        </span>
      `;

      root.appendChild(div);

      refreshIcons();

      setTimeout(() => {
        div.style.opacity = "0";
        div.style.transform =
          "translateY(10px)";

        setTimeout(
          () => div.remove(),
          180
        );
      }, 3200);
    }

    function closeModal() {
      qs("#modalRoot").innerHTML = "";
    }

    function modal(title, content) {
      qs("#modalRoot").innerHTML = `
        <div
          class="modal-backdrop"
          onclick="
            if(event.target === this) closeModal()
          "
        >
          <div class="modal">
            <div class="modal-head">
              <h3 class="modal-title">
                ${escapeHtml(title)}
              </h3>

              <button
                class="icon-btn"
                onclick="closeModal()"
              >
                <i
                  data-lucide="x"
                  class="icon icon-sm"
                ></i>
              </button>
            </div>

            <div class="modal-body">
              ${content}
            </div>
          </div>
        </div>
      `;

      refreshIcons();
    }

    function setLoading(button, loading) {
      if (!button) return;

      button.disabled = loading;

      if (loading) {
        button.dataset.oldHtml =
          button.innerHTML;

        button.innerHTML = `
          <i
            data-lucide="loader-circle"
            class="icon icon-sm spin"
          ></i>
        `;
      } else if (
        button.dataset.oldHtml
      ) {
        button.innerHTML =
          button.dataset.oldHtml;
      }

      refreshIcons();
    }


    /* =========================================================
       BRAND
    ========================================================= */

    async function loadBranding() {
      try {
        const { data } =
          await sb
            .from("app_settings")
            .select("logo_url")
            .eq("id", 1)
            .maybeSingle();

        state.logoUrl =
          data?.logo_url || null;
      } catch {
        state.logoUrl = null;
      }
    }

    function logoMarkup(
      className = "brand-logo"
    ) {
      if (state.logoUrl) {
        return `
          <div class="${className}">
            <img
              src="${escapeHtml(state.logoUrl)}"
              alt="LiptonGram"
            >
          </div>
        `;
      }

      return `
        <div class="${className}">
          L
        </div>
      `;
    }


    /* =========================================================
       AUTH
    ========================================================= */

    async function init() {
      await loadBranding();

      const {
        data: { session }
      } =
        await sb.auth.getSession();

      state.session = session;
      state.user = session?.user || null;

      if (state.user) {
        await loadMe();
      }

      render();

      sb.auth.onAuthStateChange(
        async (_, session) => {
          state.session = session;
          state.user =
            session?.user || null;

          if (state.user) {
            await loadMe();
          } else {
            state.profile = null;
            state.wallet = null;
            state.page = "chats";
          }

          render();
        }
      );
    }


    async function signIn() {
      const login =
        qs("#authLogin")
          ?.value
          .trim();

      const password =
        qs("#authPassword")
          ?.value;

      if (!validateLogin(login)) {
        toast(
          "Логін: 3–24 символи, латинські букви, цифри або _",
          "error"
        );

        return;
      }

      const button =
        qs("#authSubmit");

      setLoading(button, true);

      const { error } =
        await sb.auth
          .signInWithPassword({
            email:
              loginToEmail(login),
            password
          });

      setLoading(button, false);

      if (error) {
        toast(
          "Невірний логін або пароль",
          "error"
        );
      }
    }


    async function signUp() {
      const login =
        qs("#authLogin")
          ?.value
          .trim();

      const password =
        qs("#authPassword")
          ?.value;

      if (!validateLogin(login)) {
        toast(
          "Логін: 3–24 символи, латинські букви, цифри або _",
          "error"
        );

        return;
      }

      if (
        !password ||
        password.length < 8
      ) {
        toast(
          "Пароль повинен містити мінімум 8 символів",
          "error"
        );

        return;
      }

      const button =
        qs("#authSubmit");

      setLoading(button, true);

      const { data, error } =
        await sb.auth.signUp({
          email:
            loginToEmail(login),

          password,

          options: {
            data: {
              login
            }
          }
        });

      setLoading(button, false);

      if (error) {
        if (
          error.message
            .toLowerCase()
            .includes("already")
        ) {
          toast(
            "Цей логін уже зайнятий",
            "error"
          );
        } else {
          toast(
            error.message,
            "error"
          );
        }

        return;
      }

      if (!data.session) {
        toast(
          "Для Supabase потрібно вимкнути підтвердження Email у налаштуваннях Auth",
          "error"
        );

        return;
      }

      toast(
        "Акаунт створено",
        "success"
      );
    }


    async function logout() {
      if (state.chatChannel) {
        await sb.removeChannel(
          state.chatChannel
        );

        state.chatChannel = null;
      }

      await sb.auth.signOut();
    }


    /* =========================================================
       CURRENT USER
    ========================================================= */

    async function loadMe() {
      if (!state.user) return;

      const [
        profileResult,
        walletResult
      ] =
        await Promise.all([
          sb
            .from("profiles")
            .select("*")
            .eq("id", state.user.id)
            .single(),

          sb
            .from("wallets")
            .select("*")
            .eq(
              "user_id",
              state.user.id
            )
            .single()
        ]);

      if (profileResult.error) {
        console.error(
          profileResult.error
        );

        return;
      }

      state.profile =
        profileResult.data;

      state.wallet =
        walletResult.data || {
          balance: 0
        };
    }


    async function refreshWallet() {
      if (!state.user) return;

      const { data } =
        await sb
          .from("wallets")
          .select("*")
          .eq(
            "user_id",
            state.user.id
          )
          .single();

      if (data) {
        state.wallet = data;
      }
    }


    /* =========================================================
       RENDER AUTH
    ========================================================= */

    function renderAuth() {
      const isLogin =
        state.authMode === "login";

      qs("#app").innerHTML = `
        <main class="auth-page">
          <section
            class="auth-card page-animation"
          >
            ${logoMarkup("auth-logo")}

            <h1 class="auth-title">
              LiptonGram
            </h1>

            <p class="auth-subtitle">
              Спілкуйся, керуй своїм
              профілем та унікальними
              ідентифікаторами.
            </p>

            <div class="auth-tabs">
              <button
                class="
                  auth-tab
                  ${isLogin ? "active" : ""}
                "
                onclick="
                  state.authMode='login';
                  render()
                "
              >
                Вхід
              </button>

              <button
                class="
                  auth-tab
                  ${!isLogin ? "active" : ""}
                "
                onclick="
                  state.authMode='register';
                  render()
                "
              >
                Реєстрація
              </button>
            </div>

            <form
              class="auth-form"
              onsubmit="
                event.preventDefault();
                ${
                  isLogin
                    ? "signIn()"
                    : "signUp()"
                }
              "
            >
              <div class="field">
                <label>Логін</label>

                <input
                  id="authLogin"
                  class="input"

                  maxlength="24"

                  autocomplete="username"

                  placeholder="Введіть логін"
                >
              </div>

              <div class="field">
                <label>Пароль</label>

                <input
                  id="authPassword"
                  class="input"

                  type="password"

                  autocomplete="${
                    isLogin
                      ? "current-password"
                      : "new-password"
                  }"

                  placeholder="Введіть пароль"
                >
              </div>

              <button
                id="authSubmit"

                class="
                  btn
                  btn-primary
                "

                type="submit"
              >
                ${
                  isLogin
                    ? "Увійти"
                    : "Створити акаунт"
                }
              </button>
            </form>
          </section>
        </main>
      `;

      refreshIcons();
    }


    /* =========================================================
       APP SHELL
    ========================================================= */

    function render() {
      if (!state.user) {
        renderAuth();
        return;
      }

      const admin =
        state.profile?.role === "admin";

      qs("#app").innerHTML = `
        <div class="app-layout">

          <aside class="sidebar">
            <div class="brand">
              ${logoMarkup()}

              <div class="brand-name">
                LiptonGram
              </div>
            </div>

            <nav class="side-nav">
              ${sideNavItem(
                "chats",
                "message-circle",
                "Чати"
              )}

              ${sideNavItem(
                "shop",
                "shopping-bag",
                "Магазин"
              )}

              ${sideNavItem(
                "profile",
                "user-round",
                "Профіль"
              )}

              ${
                admin
                  ? sideNavItem(
                      "admin",
                      "shield",
                      "Адмін"
                    )
                  : ""
              }
            </nav>

            <div class="sidebar-spacer">
            </div>

            <div class="side-profile">
              ${avatar(state.profile)}

              <div class="side-profile-info">
                <div class="side-profile-name">
                  ${escapeHtml(
                    state.profile?.username ||
                    state.profile?.login
                  )}
                </div>

                <div class="side-profile-id">
                  ID
                  ${escapeHtml(
                    state.profile?.public_id
                  )}
                </div>
              </div>

              <button
                class="icon-btn"

                onclick="logout()"

                title="Вийти"
              >
                <i
                  data-lucide="log-out"

    function formatCardNumber(input) {
      let value =
        input.value
          .replace(/\D/g, "")
          .slice(0, 16);

      value =
        value.replace(
          /(\d{4})(?=\d)/g,
          "$1 "
        );

      input.value = value;

      const preview =
        qs("#cardPreviewNumber");

      if (preview) {
        preview.textContent =
          value ||
          "•••• •••• •••• ••••";
      }
    }


    function formatCardDate(input) {
      let value =
        input.value
          .replace(/\D/g, "")
          .slice(0, 4);

      if (value.length > 2) {
        value =
          value.slice(0,2) +
          "/" +
          value.slice(2);
      }

      input.value = value;

      const preview =
        qs("#cardPreviewDate");

      if (preview) {
        preview.textContent =
          value || "MM/YY";
      }
    }


    async function fakePayment() {
      const button =
        qs("#payButton");

      const amount =
        Number(
          qs("#topupAmount")
            ?.value
            .replace(",", ".")
        );

      if (
        !Number.isFinite(amount) ||
        amount <= 0
      ) {
        toast(
          "Вкажіть правильну суму",
          "error"
        );

        return;
      }

      setLoading(button, true);

      /*
        ВАЖЛИВО:
        Дані картки НІКУДИ НЕ НАДСИЛАЮТЬСЯ.
        Вони існують лише в локальних input.
      */

      await new Promise(
        resolve =>
          setTimeout(resolve, 1400)
      );

      setLoading(button, false);

      const error =
        qs("#paymentError");

      if (error) {
        error.classList.remove(
          "hidden"
        );
      }

      const number =
        qs("#cardNumber");

      const date =
        qs("#cardDate");

      const cvv =
        qs("#cardCvv");

      if (number) number.value = "";
      if (date) date.value = "";
      if (cvv) cvv.value = "";
    }

    async function loadConversations() {
      const uid =
        state.user.id;

      const { data, error } =
        await sb
          .from(
            "direct_conversations"
          )
          .select("*")
          .or(
            `user1_id.eq.${uid},user2_id.eq.${uid}`
          )
          .order(
            "updated_at",
            { ascending: false }
          );

      if (error) {
        qs("#chatList").innerHTML = `
          <div class="empty">
            <strong>
              Не вдалося завантажити
              чати
            </strong>

            <p>
              Перевірте таблиці Supabase
              та SQL в кінці файлу.
            </p>
          </div>
        `;

        refreshIcons();
        return;
      }

      const conversations =
        data || [];

      const otherIds =
        conversations.map(c =>
          c.user1_id === uid
            ? c.user2_id
            : c.user1_id
        );

      let profiles = [];

      if (otherIds.length) {
        const { data: p } =
          await sb
            .from("profiles")
            .select(
              "id,login,username,public_id,avatar_url"
            )
            .in("id", otherIds);

        profiles = p || [];
      }

      const map =
        Object.fromEntries(
          profiles.map(p => [
            p.id,
            p
          ])
        );

      const complete =
        await Promise.all(
          conversations.map(
            async c => {
              const otherId =
                c.user1_id === uid
                  ? c.user2_id
                  : c.user1_id;

              const { data: latest } =
                await sb
                  .from("messages")
                  .select(
                    "content,created_at"
                  )
                  .eq(
                    "conversation_id",
                    c.id
                  )
                  .order(
                    "created_at",
                    {
                      ascending:
                        false
                    }
                  )
                  .limit(1)
                  .maybeSingle();

              return {
                ...c,
                other:
                  map[otherId],
                latest
              };
            }
          )
        );

      state.conversations =
        complete;

      renderConversationList();
    }

    async function openConversation(
      conversationId,
      userId
    ) {
      const conversation =
        state.conversations.find(
          c => c.id === conversationId
        );

      let user =
        conversation?.other;

      if (!user) {
        const { data } =
          await sb
            .from("profiles")
            .select("*")
            .eq("id", userId)
            .single();

        user = data;
      }

      state.activeConversation =
        conversation || {
          id: conversationId
        };

      state.activeChatUser =
        user;

      state.mobileChatOpen = true;

      const { data, error } =
        await sb
          .from("messages")
          .select("*")
          .eq(
            "conversation_id",
            conversationId
          )
          .order(
            "created_at",
            { ascending: true }
          )
          .limit(300);

      if (error) {
        toast(
          "Не вдалося відкрити чат",
          "error"
        );

        return;
      }

      state.messages = data || [];

      if (state.chatChannel) {
        await sb.removeChannel(
          state.chatChannel
        );
      }

      state.chatChannel =
        sb
          .channel(
            `chat:${conversationId}`
          )
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages",
              filter:
                `conversation_id=eq.${conversationId}`
            },

            payload => {
              const incoming =
                payload.new;

              const exists =
                state.messages.some(
                  m =>
                    m.id === incoming.id
                );

              if (!exists) {
                state.messages.push(
                  incoming
                );

                rerenderMessages(true);
              } else {
                state.messages =
                  state.messages.map(m =>
                    m.id === incoming.id
                      ? incoming
                      : m
                  );

                rerenderMessages(false);
              }
            }
          )
          .subscribe();

      await renderChats();

      setTimeout(() => {
        const back =
          qs("#mobileBackChat");

        if (
          back &&
          window.innerWidth <= 760
        ) {
          back.style.display =
            "inline-flex";
        }

        scrollMessages();
      }, 10);
    }


    function closeMobileChat() {
      state.mobileChatOpen = false;
      renderChats();
    }


    function rerenderMessages(
      scroll = false
    ) {
      const root =
        qs("#messages");

      if (!root) return;

      root.innerHTML =
        messagesMarkup();

      refreshIcons();

      if (scroll) {
        scrollMessages();
      }
    }


    function scrollMessages() {
      const el =
        qs("#messages");

      if (!el) return;

      el.scrollTop =
        el.scrollHeight;
    }


    function handleMessageKey(event) {
      if (
        event.key === "Enter" &&
        !event.shiftKey &&
        window.innerWidth > 760
      ) {
        event.preventDefault();
        sendMessage();
      }
    }


    function autoGrowMessage(el) {
      el.style.height = "44px";

      el.style.height =
        Math.min(
          el.scrollHeight,
          140
        ) + "px";
    }


    async function sendMessage() {
      if (
        !state.activeConversation
      ) {
        return;
      }

      const input =
        qs("#messageInput");

      if (!input) return;

      const content =
        input.value.trim();

      if (!content) return;

      input.value = "";
      input.style.height = "44px";

      const id =
        crypto.randomUUID();

      const optimistic = {
        id,
        conversation_id:
          state.activeConversation.id,

        sender_id:
          state.user.id,

        content,

        created_at:
          new Date().toISOString(),

        _status: "sending"
      };

      state.messages.push(
        optimistic
      );

      rerenderMessages(true);

      const { error } =
        await sb
          .from("messages")
          .insert({
            id,

            conversation_id:
              state.activeConversation.id,

            sender_id:
              state.user.id,

            content
          });

      if (error) {
        state.messages =
          state.messages.map(m =>
            m.id === id
              ? {
                  ...m,
                  _status:
                    "failed"
                }
              : m
          );

        rerenderMessages(false);

        toast(
          "Повідомлення не надіслано",
          "error"
        );

        return;
      }

      state.messages =
        state.messages.map(m =>
          m.id === id
            ? {
                ...m,
                _status: undefined
              }
            : m
        );

      rerenderMessages(false);
    }

    let userSearchTimeout;

    function searchUsers(query) {
      clearTimeout(
        userSearchTimeout
      );

      userSearchTimeout =
        setTimeout(
          () =>
            runUserSearch(query),
          260
        );
    }


    async function runUserSearch(query) {
      const q =
        query.trim();

      const root =
        qs("#userSearchResults");

      if (!root) return;

      if (q.length < 2) {
        root.innerHTML = "";
        return;
      }

      let request =
        sb
          .from("profiles")
          .select(
            "id,login,username,public_id,avatar_url"
          )
          .neq(
            "id",
            state.user.id
          )
          .limit(15);

      if (/^\d{6}$/.test(q)) {
        request =
          request.eq(
            "public_id",
            q
          );
      } else {
        const safe =
          q.replace(
            /[^A-Za-z0-9_]/g,
            ""
          );

        request =
          request.ilike(
            "username",
            `%${safe}%`
          );
      }

      const { data, error } =
        await request;

      if (error) {
        root.innerHTML = "";
        return;
      }

      if (!data?.length) {
        root.innerHTML = `
          <div class="empty">
            <strong>
              Нічого не знайдено
            </strong>
          </div>
        `;

        return;
      }

      root.innerHTML =
        data.map(user => `
          <button
            class="search-user"

            onclick="
              startDirectChat(
                '${user.id}'
              )
            "
          >
            ${avatar(user)}

            <div>
              <div
                style="
                  font-weight:780;
                  font-size:13px
                "
              >
                ${escapeHtml(
                  user.username

    async function uploadProfileFile(
      file,
      type
    ) {
      if (!file) return null;

      const extension =
        file.name
          .split(".")
          .pop()
          ?.toLowerCase() ||
        "jpg";

      const path =
        `${state.user.id}/${type}-${Date.now()}.${extension}`;

      const { error } =
        await sb.storage
          .from("profiles")
          .upload(
            path,
            file,
            {
              upsert: true
            }
          );

      if (error) {
        throw error;
      }

      const { data } =
        sb.storage
          .from("profiles")
          .getPublicUrl(path);

      return data.publicUrl;
    }


    async function saveProfile() {
      const button =
        qs("#saveProfileButton");

      const username =
        qs("#editUsername")
          .value
          .trim();

      const publicId =
        qs("#editPublicId")
          .value
          .trim();

      if (
        !/^[A-Za-z0-9_]{3,24}$/
          .test(username)
      ) {
        toast(
          "Невірний Username",
          "error"
        );

        return;
      }

      if (
        !/^\d{6}$/.test(publicId)
      ) {
        toast(
          "ID повинен складатися з 6 цифр",
          "error"
        );

        return;
      }

      setLoading(button, true);

      try {
        const avatarFile =
          qs("#avatarFile")
            ?.files?.[0];

        const bannerFile =
          qs("#bannerFile")
            ?.files?.[0];

        let avatarUrl =
          state.profile.avatar_url;

        let bannerUrl =
          state.profile.banner_url;

        if (avatarFile) {
          avatarUrl =
            await uploadProfileFile(
              avatarFile,
              "avatar"
            );
        }

        if (bannerFile) {
          bannerUrl =
            await uploadProfileFile(
              bannerFile,
              "banner"
            );
        }

        const { error } =
          await sb
            .from("profiles")
            .update({
              username,
              public_id:
                publicId,
              avatar_url:
                avatarUrl,
              banner_url:
                bannerUrl,
              updated_at:
                new Date()
                  .toISOString()
            })
            .eq(
              "id",
              state.user.id
            );

        if (error) {
          throw error;
        }

        await loadMe();

        closeModal();

        render();

        toast(
          "Профіль оновлено",
          "success"
        );
      } catch (error) {
        console.error(error);

        if (
          error.message
            ?.toLowerCase()
            .includes("duplicate")
        ) {
          toast(
            "Цей Username або ID уже зайнятий",
            "error"
          );
        } else {
          toast(
            "Не вдалося зберегти профіль",
            "error"
          );
        }
      } finally {
        setLoading(button, false);
      }
    }

          file.name
            .split(".")
            .pop() ||
          "png";

        const path =
          `logo-${Date.now()}.${extension}`;

        const { error } =
          await sb.storage
            .from("branding")
            .upload(
              path,
              file,
              {
                upsert: true
              }
            );

        if (error) {
          throw error;
        }

        const { data } =
          sb.storage
            .from("branding")
            .getPublicUrl(path);

        const logoUrl =
          data.publicUrl;

        const { error: updateError } =
          await sb
            .from("app_settings")
            .update({
              logo_url:
                logoUrl,
              updated_at:
                new Date()
                  .toISOString()

            .eq("id", 1);

        if (updateError) {

        state.logoUrl =

        toast(

        );

        setLoading(button, false);

  create or replace function public.generate_public_id()
  returns text
  language plpgsql
  security definer
  set search_path = public
  as $$
  declare
    new_id text;
  begin
    loop
      new_id :=
        lpad(
          (
            floor(
              random() * 900000
            ) + 100000
          )::int::text,
          6,
          '0'
        );

      exit when not exists (
        select 1
        from public.profiles
        where public_id = new_id
      );
    end loop;

    return new_id;
  end;
  $$;

    avatar_url text,

    banner_url text,

    role text not null
      default 'user'
      check (
        role in (
          'user',
          'admin'
        )
      ),

    created_at timestamptz
      not null
      default now(),

    updated_at timestamptz
      not null
      default now(),

    constraint profiles_login_format
      check (
        login ~
        '^[A-Za-z0-9_]{3,24}$'
      ),

    constraint profiles_username_format
      check (
        username ~
        '^[A-Za-z0-9_]{3,24}$'
      ),

    constraint profiles_public_id_format
      check (
        public_id ~
        '^[0-9]{6}$'

  create or replace function public.handle_new_user()
  returns trigger
  language plpgsql
  security definer
  set search_path = public
  as $$
  declare
    requested_login text;
    generated_username text;
    generated_id text;
  begin

    requested_login :=
      coalesce(
        new.raw_user_meta_data ->> 'login',
        split_part(
          new.email,
          '@',
          1
        )
      );

    if requested_login is null
       or requested_login !~
       '^[A-Za-z0-9_]{3,24}$'
    then
      raise exception
        'Invalid login';
    end if;

    generated_username :=
      requested_login;

    generated_id :=
      public.generate_public_id();

    insert into public.profiles (
      id,
      login,
      username,
      public_id
    )
    values (
      new.id,
      requested_login,
      generated_username,
      generated_id
    );

    insert into public.wallets (
      user_id,
      balance
    )
    values (
      new.id,
      0
    );

    return new;

  end;
  $$;


  drop trigger if exists
    on_auth_user_created
  on auth.users;


  create trigger
    on_auth_user_created
  after insert on auth.users
  for each row
  execute procedure
    public.handle_new_user();

  -- ============================================================

  create or replace function
    public.get_or_create_direct_conversation(
      target_user_id uuid
    )
  returns uuid
  language plpgsql
  security definer
  set search_path = public
  as $$
  declare
    current_user_id uuid;
    first_user uuid;
    second_user uuid;
    conversation_id uuid;
  begin

    current_user_id :=
      auth.uid();

    if current_user_id is null then
      raise exception
        'Not authenticated';
    end if;

    if target_user_id is null
       or target_user_id =
          current_user_id
    then
      raise exception
        'Invalid target user';
    end if;

    if not exists (
      select 1
      from public.profiles
      where id =
        target_user_id
    )
    then
      raise exception
        'User not found';
    end if;

    if current_user_id::text
       < target_user_id::text
    then
      first_user :=
        current_user_id;

      second_user :=
        target_user_id;
    else
      first_user :=
        target_user_id;

      second_user :=
        current_user_id;
    end if;


    select id
    into conversation_id
    from public.direct_conversations
    where user1_id =
      first_user
      and user2_id =
      second_user;


    if conversation_id is null then

      insert into public.direct_conversations (
        user1_id,
        user2_id
      )
      values (
        first_user,
        second_user
      )
      returning id
      into conversation_id;

    end if;


    return conversation_id;

  end;
  $$;


  -- ============================================================
  -- UPDATE CONVERSATION TIME WHEN MESSAGE SENT
  -- ============================================================

  create or replace function
    public.touch_conversation()
  returns trigger
  language plpgsql
  security definer
  set search_path = public
  as $$
  begin

    update public.direct_conversations
    set updated_at = now()
    where id =
      new.conversation_id;

    return new;

  end;
  $$;


  drop trigger if exists
    touch_conversation_after_message
  on public.messages;


  create trigger
    touch_conversation_after_message
  after insert on public.messages
  for each row
  execute procedure
    public.touch_conversation();


  -- ============================================================
  -- PURCHASE LISTING
  --
  -- BUYER AND SELLER SWAP THEIR CURRENT USERNAME / ID.
  -- SELLER RECEIVES THE MONEY.
  -- ============================================================

  create or replace function
    public.purchase_marketplace_listing(
      listing_id uuid
    )
  returns jsonb
  language plpgsql
  security definer
  set search_path = public
  as $$
  declare
    buyer uuid :=
      auth.uid();

    item
      public.marketplace_listings%rowtype;

    buyer_balance
      numeric(14,2);

    buyer_old_value text;
    seller_current_value text;
  begin

    if buyer is null then
      raise exception
        'Not authenticated';
    end if;


    select *
    into item
    from public.marketplace_listings
    where id =
      listing_id
    for update;


    if item.id is null then
      raise exception
        'Listing not found';
    end if;


    if item.status <>
       'active'
    then
      raise exception
        'This listing is no longer active';
    end if;


    if item.seller_id =
       buyer
    then
      raise exception
        'You cannot buy your own listing';
    end if;


    perform 1
    from public.wallets
    where user_id in (
      buyer,
      item.seller_id
    )
    order by user_id
    for update;


    select balance
    into buyer_balance
    from public.wallets
    where user_id =
      buyer;


    if buyer_balance <
       item.price
    then
      raise exception
        'Недостатньо коштів';
    end if;


    if item.asset_type =
       'username'
    then

      select username
      into seller_current_value
      from public.profiles
      where id =
        item.seller_id
      for update;


      select username
      into buyer_old_value
      from public.profiles
      where id =
        buyer
      for update;


      if lower(
        seller_current_value
      ) <> lower(
        item.asset_value
      )
      then
        raise exception
          'Username продавця вже змінився';
      end if;


      -- Cancel buyer's current username listing
      update public.marketplace_listings
      set status =
        'cancelled'
      where seller_id =
        buyer
        and asset_type =
          'username'
        and status =
          'active';


      -- Temporarily change buyer to avoid unique conflict
      update public.profiles
      set username =
        'tmp_' ||
        substr(
          replace(
            buyer::text,
            '-',
            ''
          ),
          1,
          12
        )
      where id =
        buyer;


      update public.profiles
      set username =
        buyer_old_value
      where id =
        item.seller_id;


      update public.profiles
      set username =
        item.asset_value
      where id =
        buyer;


    elsif item.asset_type =
          'id'
    then

      select public_id
      into seller_current_value
      from public.profiles
      where id =
        item.seller_id
      for update;


      select public_id
      into buyer_old_value
      from public.profiles
      where id =
        buyer
      for update;


      if seller_current_value <>
         item.asset_value
      then
        raise exception
          'ID продавця вже змінився';
      end if;


      update public.marketplace_listings
      set status =
        'cancelled'
      where seller_id =
        buyer
        and asset_type =
          'id'
        and status =
          'active';


      update public.profiles
      set public_id =
        (
          (
            floor(
              random() *
              900000
            ) +
            100000
          )::int
        )::text
      where id =
        buyer;


      update public.profiles
      set public_id =
        buyer_old_value
      where id =
        item.seller_id;


      update public.profiles
      set public_id =
        item.asset_value
      where id =
        buyer;

    else

      raise exception
        'Invalid asset type';

    end if;


    update public.wallets
    set
      balance =
        balance -
        item.price,

      updated_at =
        now()
    where user_id =
      buyer;


    update public.wallets
    set
      balance =
        balance +
        item.price,

      updated_at =
        now()
    where user_id =
      item.seller_id;


    insert into public.wallet_transactions (
      user_id,
      amount,
      type,
      related_user_id,
      description
    )
    values (
      buyer,
      -item.price,
      'marketplace_purchase',
      item.seller_id,
      'Marketplace purchase'
    );


    insert into public.wallet_transactions (
      user_id,
      amount,
      type,
      related_user_id,
      description
    )
    values (
      item.seller_id,
      item.price,
      'marketplace_sale',
      buyer,
      'Marketplace sale'
    );


    update public.marketplace_listings
    set
      status =
        'sold',

      buyer_id =
        buyer,

      sold_at =
        now()
    where id =
      item.id;


    insert into public.marketplace_sales (
      listing_id,
      seller_id,
      buyer_id,
      asset_type,
      asset_value,
      price
    )
    values (
      item.id,
      item.seller_id,
      buyer,
      item.asset_type,
      item.asset_value,
      item.price
    );


    return jsonb_build_object(
      'success',
      true,
      'listing_id',
      item.id
    );

  end;
  $$;


  -- ============================================================
  -- ADMIN BALANCE
  -- ============================================================

  create or replace function
    public.admin_adjust_balance(
      target_user_id uuid,
      adjustment_amount numeric,
      adjustment_reason text
    )
  returns numeric
  language plpgsql
  security definer
  set search_path = public
  as $$
  declare
    current_admin uuid :=
      auth.uid();

    current_balance numeric;
    new_balance numeric;
  begin

    if not public.is_admin(
      current_admin
    )
    then
      raise exception
        'Access denied';
    end if;


    if adjustment_amount = 0
       or adjustment_amount is null
    then
      raise exception
        'Invalid amount';
    end if;


    select balance
    into current_balance
    from public.wallets
    where user_id =
      target_user_id
    for update;


    if current_balance is null then
      raise exception
        'Wallet not found';
    end if;


    new_balance :=
      current_balance +
      adjustment_amount;


    if new_balance < 0 then
      raise exception
        'Balance cannot be negative';
    end if;


    update public.wallets
    set
      balance =
        new_balance,

      updated_at =
        now()
    where user_id =
      target_user_id;


    insert into public.wallet_transactions (
      user_id,
      amount,
      type,
      related_user_id,
      description
    )
    values (
      target_user_id,
      adjustment_amount,
      'admin_adjustment',
      current_admin,
      adjustment_reason
    );


    insert into public.admin_audit_logs (
      admin_id,
      action,
      target_user_id,
      details
    )
    values (
      current_admin,
      'balance_adjustment',
      target_user_id,
      jsonb_build_object(
        'amount',
        adjustment_amount,
        'reason',
        adjustment_reason
      )
    );


    return new_balance;

  end;
  $$;
